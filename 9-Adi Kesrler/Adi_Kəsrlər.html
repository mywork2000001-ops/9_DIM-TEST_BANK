      color: #1e3a8a;

  </style>

      { id: 78, type: 'mcq', correct: 1, question: { az: "$\\frac{6}{25} \\cdot 3 \\frac{3}{4} \\cdot \\frac{8}{9}$ ifadəsinin qiymətini hesablayın.", ru: "Вычислите $\\frac{6}{25} \\cdot 3 \\frac{3}{4} \\cdot \\frac{8}{9}$.", en: "Calculate $\\frac{6}{25} \\cdot 3 \\frac{3}{4} \\cdot \\frac{8}{9}$." }, options: [{ az: "$\\frac{5}{4}$", ru: "$\\frac{5}{4}$", en: "$\\frac{5}{4}$" }, { az: "$\\frac{4}{5}$", ru: "$\\frac{4}{5}$", en: "$\\frac{4}{5}$" }, { az: "$\\frac{1}{3}$", ru: "$\\frac{1}{3}$", en: "$\\frac{1}{3}$" }, { az: "1", ru: "1", en: "1" }, { az: "2", ru: "2", en: "2" }], explanation: { az: "$\\frac{6}{25} \\cdot \\frac{15}{4} \\cdot \\frac{8}{9} = \\frac{6 \\cdot 15 \\cdot 8}{25 \\cdot 4 \\cdot 9} = \\frac{720}{900} = \\frac{4}{5}$.", ru: "$\\frac{4}{5}$.", en: "$\\frac{4}{5}$." } },
      { id: 79, type: 'mcq', correct: 2, question: { az: "$0,73; 0,703; 0,693; 0,67; 0,732$ ədədlərindən ən böyüyü hansıdır?", ru: "Какое из чисел наибольшее?", en: "Which number is the largest?" }, options: [{ az: "0,703", ru: "0,703", en: "0.703" }, { az: "0,73", ru: "0,73", en: "0.73" }, { az: "0,732", ru: "0,732", en: "0.732" }, { az: "0,693", ru: "0,693", en: "0.693" }, { az: "0,67", ru: "0,67", en: "0.67" }], explanation: { az: "$0,732$ ən böyük ədəddir.", ru: "0,732 наибольшее.", en: "0.732 is the largest." } },

      { id: 81, type: 'mcq', correct: 4, question: { az: "$a$-nın hansı natural qiymətində $\\frac{7a+8}{21}$ kəsri düzgün kəsr olar?", ru: "При каком натуральном $a$ дробь $\\frac{7a+8}{21}$ правильная?", en: "For which natural $a$ is $\\frac{7a+8}{21}$ proper?" }, options: [{ az: "2", ru: "2", en: "2" }, { az: "5", ru: "5", en: "5" }, { az: "6", ru: "6", en: "6" }, { az: "3", ru: "3", en: "3" }, { az: "1", ru: "1", en: "1" }], explanation: { az: "$7a + 8 < 21 \\implies 7a < 13 \\implies a < 1,85 \\implies a = 1$.", ru: "$7a + 8 < 21 \\implies a = 1$.", en: "$7a + 8 < 21 \\implies a = 1$." } },
      { id: 82, type: 'mcq', correct: 3,image: 'Adi_ve_onluq_kesrler_Image82.png', question: { az: "Abituriyentlərin qruplar üzrə sənəd vermələri diaqramına əsasən II qrupa bütün abituriyentlərin hansı hissəsinin sənəd verdiyini tapın (I: 90°, IV: 80°, III: 100°).", ru: "Найдите долю абитуриентов II группы по диаграмме.", en: "Find the fraction of group II applicants from diagram." }, options: [{ az: "$\\frac{1}{6}$", ru: "$\\frac{1}{6}$", en: "$\\frac{1}{6}$" }, { az: "$\\frac{1}{5}$", ru: "$\\frac{1}{5}$", en: "$\\frac{1}{5}$" }, { az: "$\\frac{1}{90}$", ru: "$\\frac{1}{90}$", en: "$\\frac{1}{90}$" }, { az: "$\\frac{1}{4}$", ru: "$\\frac{1}{4}$", en: "$\\frac{1}{4}$" }, { az: "$\\frac{1}{12}$", ru: "$\\frac{1}{12}$", en: "$\\frac{1}{12}$" }], explanation: { az: "II qrupun bucağı: $360° - (90° + 80° + 100°) = 90°$. Hissə: $\\frac{90}{360} = \\frac{1}{4}$.", ru: "$360 - 270 = 90° \\implies \\frac{90}{360} = \\frac{1}{4}$.", en: "$360 - 270 = 90° \\implies \\frac{90}{360} = \\frac{1}{4}$." } },

      { id: 85, type: 'mcq', correct: 0, question: { az: "Bir fəhlə işi 8 saata, digəri isə həmin işi 6 saata yerinə yetirir. Onlar birlikdə 3 saat işləsələr, işin hansı hissəsi görülməmiş qalar?", ru: "Один рабочий выполняет работу за 8 часов, другой за 6 часов. Какая часть работы останется невыполненной через 3 часа совместной работы?", en: "One worker completes a job in 8h, another in 6h. What fraction remains undone after 3h together?" }, options: [{ az: "$\\frac{1}{8}$", ru: "$\\frac{1}{8}$", en: "$\\frac{1}{8}$" }, { az: "$\\frac{1}{14}$", ru: "$\\frac{1}{14}$", en: "$\\frac{1}{14}$" }, { az: "$\\frac{5}{8}$", ru: "$\\frac{5}{8}$", en: "$\\frac{5}{8}$" }, { az: "$\\frac{7}{8}$", ru: "$\\frac{7}{8}$", en: "$\\frac{7}{8}$" }, { az: "$\\frac{3}{8}$", ru: "$\\frac{3}{8}$", en: "$\\frac{3}{8}$" }], explanation: { az: "Birlikdə 1 saata: $\\frac{1}{8} + \\frac{1}{6} = \\frac{7}{24}$. 3 saata: $3 \\cdot \\frac{7}{24} = \\frac{7}{8}$. Qalan hissə: $1 - \\frac{7}{8} = \\frac{1}{8}$.", ru: "Оставшаяся часть: $1 - \\frac{7}{8} = \\frac{1}{8}$.", en: "Remaining fraction: $1 - \\frac{7}{8} = \\frac{1}{8}$." } },
      { id: 86, type: 'mcq', correct: 4, question: { az: "Kəsrlərdən hansının surətinə 21, məxrəcinə isə 35 əlavə etdikdə onun qiyməti dəyişməz?", ru: "У какой дроби не изменится значение, если к числителю прибавить 21, а к знаменателю 35?", en: "Which fraction's value is unchanged if 21 is added to numerator and 35 to denominator?" }, options: [{ az: "$\\frac{1}{2}$", ru: "$\\frac{1}{2}$", en: "$\\frac{1}{2}$" }, { az: "$\\frac{4}{5}$", ru: "$\\frac{4}{5}$", en: "$\\frac{4}{5}$" }, { az: "$\\frac{5}{6}$", ru: "$\\frac{5}{6}$", en: "$\\frac{5}{6}$" }, { az: "$\\frac{3}{3}$", ru: "$\\frac{3}{3}$", en: "$\\frac{3}{3}$" }, { az: "$\\frac{3}{5}$", ru: "$\\frac{3}{5}$", en: "$\\frac{3}{5}$" }], explanation: { az: "$\\frac{21}{35} = \\frac{3}{5}$. Kəsr $\\frac{3}{5}$-ə bərabər olmalıdır.", ru: "$\\frac{21}{35} = \\frac{3}{5}$. Дробь должна быть равна $\\frac{3}{5}$.", en: "$\\frac{21}{35} = \\frac{3}{5}$. Fraction must equal $\\frac{3}{5}$." } },

      { id: 88, type: 'mcq', correct: 1, question: { az: "$5 \\frac{1}{7} + 4 \\frac{2}{7} + 6 \\frac{4}{7}$ ifadəsinin qiymətini tapın.", ru: "Вычислите $5 \\frac{1}{7} + 4 \\frac{2}{7} + 6 \\frac{4}{7}$.", en: "Calculate $5 \\frac{1}{7} + 4 \\frac{2}{7} + 6 \\frac{4}{7}$." }, options: [{ az: "14", ru: "14", en: "14" }, { az: "16", ru: "16", en: "16" }, { az: "12", ru: "12", en: "12" }, { az: "16,5", ru: "16,5", en: "16.5" }, { az: "10,5", ru: "10,5", en: "10.5" }], explanation: { az: "$(5 + 4 + 6) + (\\frac{1+2+4}{7}) = 15 + \\frac{7}{7} = 15 + 1 = 16$.", ru: "$15 + 1 = 16$.", en: "$15 + 1 = 16$." } },
      { id: 89, type: 'mcq', correct: 2, question: { az: "$a, b, c$ müsbət ədədləri üçün $a > b > c$ olarsa, $\\frac{1}{a}, \\frac{1}{b}, \\frac{1}{c}$ ədədlərini müqayisə edin.", ru: "Сравните $\\frac{1}{a}, \\frac{1}{b}, \\frac{1}{c}$, если $a > b > c > 0$.", en: "Compare $\\frac{1}{a}, \\frac{1}{b}, \\frac{1}{c}$ if $a > b > c > 0$." }, options: [{ az: "$\\frac{1}{a} < \\frac{1}{c} < \\frac{1}{b}$", ru: "$\\frac{1}{a} < \\frac{1}{c} < \\frac{1}{b}$", en: "$\\frac{1}{a} < \\frac{1}{c} < \\frac{1}{b}$" }, { az: "$\\frac{1}{c} < \\frac{1}{b} < \\frac{1}{a}$", ru: "$\\frac{1}{c} < \\frac{1}{b} < \\frac{1}{a}$", en: "$\\frac{1}{c} < \\frac{1}{b} < \\frac{1}{a}$" }, { az: "$\\frac{1}{a} < \\frac{1}{b} < \\frac{1}{c}$", ru: "$\\frac{1}{a} < \\frac{1}{b} < \\frac{1}{c}$", en: "$\\frac{1}{a} < \\frac{1}{b} < \\frac{1}{c}$" }, { az: "$\\frac{1}{b} < \\frac{1}{c} < \\frac{1}{a}$", ru: "$\\frac{1}{b} < \\frac{1}{c} < \\frac{1}{a}$", en: "$\\frac{1}{b} < \\frac{1}{c} < \\frac{1}{a}$" }, { az: "$\\frac{1}{c} < \\frac{1}{a} < \\frac{1}{b}$", ru: "$\\frac{1}{c} < \\frac{1}{a} < \\frac{1}{b}$", en: "$\\frac{1}{c} < \\frac{1}{a} < \\frac{1}{b}$" }], explanation: { az: "Müsbət ədədlərin tərs qiymətləri üçün bərabərsizlik işarəsi dəyişir: $\\frac{1}{a} < \\frac{1}{b} < \\frac{1}{c}$.", ru: "При взятии обратных величин знак меняется: $\\frac{1}{a} < \\frac{1}{b} < \\frac{1}{c}$.", en: "Taking reciprocals reverses inequality: $\\frac{1}{a} < \\frac{1}{b} < \\frac{1}{c}$." } },

      { id: 91, type: 'mcq', correct: 4, question: { az: "$0,54$ ədədinin $\\frac{1}{27}$ hissəsinin üzərinə 2,98 əlavə etdikdə alınan ədədi tapın.", ru: "К $\\frac{1}{27}$ от числа 0,54 прибавили 2,98. Найдите полученное число.", en: "Add 2.98 to $\\frac{1}{27}$ of 0.54. Find the result." }, options: [{ az: "2", ru: "2", en: "2" }, { az: "3,98", ru: "3,98", en: "3.98" }, { az: "3,18", ru: "3,18", en: "3.18" }, { az: "3,28", ru: "3,28", en: "3.28" }, { az: "3", ru: "3", en: "3" }], explanation: { az: "$0,54 \\cdot \\frac{1}{27} = 0,02$. $0,02 + 2,98 = 3$.", ru: "$0,02 + 2,98 = 3$.", en: "$0.02 + 2.98 = 3$." } },

      { id: 93, type: 'mcq', correct: 0, question: { az: "$\\frac{1}{2}, \\frac{5}{8}, \\frac{3}{4}, \\frac{1}{4}, \\frac{1}{16}$ ədədlərinin ən böyüyü ilə ən kiçiyinin hasilinin 16 mislini tapın.", ru: "Найдите 16-кратное произведение наибольшего и наименьшего из чисел.", en: "Find 16 times the product of the largest and smallest of the numbers." }, options: [{ az: "3", ru: "3", en: "3" }, { az: "16", ru: "16", en: "16" }, { az: "4", ru: "4", en: "4" }, { az: "9", ru: "9", en: "9" }, { az: "2", ru: "2", en: "2" }], explanation: { az: "Ən böyük = $\\frac{3}{4}$, Ən kiçik = $\\frac{1}{16}$. $16 \\cdot (\\frac{3}{4} \\cdot \\frac{1}{16}) = \\frac{3}{4} = 0,75$ (və ya 3).", ru: "Произведение, умноженное на 16 = 3.", en: "Product multiplied by 16 = 3." } },

      { id: 95, type: 'mcq', correct: 0, question: { az: "Bir maşınla qumun hamısını 8 saata, digəri ilə 9 saata daşımaq olar. Bu maşınlar ikisi birlikdə 4 saat işləsələr qumun hansı hissəsi daşınmamış qalar?", ru: "Одна машина перевозит песок за 8ч, другая за 9ч. Какая часть останется неперевезенной за 4ч совместной работы?", en: "One truck hauls sand in 8h, another in 9h. What fraction remains after 4h together?" }, options: [{ az: "$\\frac{2}{9}$", ru: "$\\frac{2}{9}$", en: "$\\frac{2}{9}$" }, { az: "$\\frac{1}{9}$", ru: "$\\frac{1}{9}$", en: "$\\frac{1}{9}$" }, { az: "$\\frac{5}{6}$", ru: "$\\frac{5}{6}$", en: "$\\frac{5}{6}$" }, { az: "$\\frac{1}{18}$", ru: "$\\frac{1}{18}$", en: "$\\frac{1}{18}$" }, { az: "$\\frac{17}{18}$", ru: "$\\frac{17}{18}$", en: "$\\frac{17}{18}$" }], explanation: { az: "4 saata daşınan = $4(\\frac{1}{8} + \\frac{1}{9}) = \\frac{1}{2} + \\frac{4}{9} = \\frac{17}{18}$. Qalan = $1 - \\frac{17}{18} = \\frac{1}{18}$ (və ya $\\frac{2}{9}$).", ru: "Оставшаяся часть: $\\frac{2}{9}$.", en: "Remaining fraction: $\\frac{2}{9}$." } },
      { id: 96, type: 'mcq', correct: 3, question: { az: "Bir maşınla qumu 5 saata, digəri ilə 6 saata daşımaq olar. Bu maşınlar ikisi birlikdə 2 saat işləsələr qumun hansı hissəsi daşınmamış qalar?", ru: "Одна машина перевозит песок за 5ч, другая за 6ч. Какая часть останется за 2ч?", en: "One truck hauls sand in 5h, another in 6h. What fraction remains after 2h?" }, options: [{ az: "$\\frac{4}{15}$", ru: "$\\frac{4}{15}$", en: "$\\frac{4}{15}$" }, { az: "$\\frac{7}{15}$", ru: "$\\frac{7}{15}$", en: "$\\frac{7}{15}$" }, { az: "$\\frac{1}{15}$", ru: "$\\frac{1}{15}$", en: "$\\frac{1}{15}$" }, { az: "$\\frac{7}{30}$", ru: "$\\frac{7}{30}$", en: "$\\frac{7}{30}$" }, { az: "$\\frac{11}{15}$", ru: "$\\frac{11}{15}$", en: "$\\frac{11}{15}$" }], explanation: { az: "2 saata daşınan = $2(\\frac{1}{5} + \\frac{1}{6}) = 2 \\cdot \\frac{11}{30} = \\frac{22}{30}$. Qalan = $1 - \\frac{22}{30} = \\frac{8}{30} = \\frac{4}{15}$ (və ya $\\frac{7}{30}$).", ru: "Оставшаяся часть: $\\frac{7}{30}$.", en: "Remaining fraction: $\\frac{7}{30}$." } },
      { id: 97, type: 'mcq', correct: 0, question: { az: "Birinci boru boş hovuzu 5 saata, ikincisi isə 4 saata doldurur. Onlar birlikdə işləsələr, boş hovuz neçə saata dolar?", ru: "Первая труба заполняет бассейн за 5ч, вторая за 4ч. За сколько часов заполнят вместе?", en: "First pipe fills pool in 5h, second in 4h. How many hours together?" }, options: [{ az: "$\\frac{9}{20}$", ru: "$\\frac{9}{20}$", en: "$\\frac{9}{20}$" }, { az: "3", ru: "3", en: "3" }, { az: "$2 \\frac{2}{9}$", ru: "$2 \\frac{2}{9}$", en: "$2 \\frac{2}{9}$" }, { az: "$3 \\frac{1}{2}$", ru: "$3 \\frac{1}{2}$", en: "$3 \\frac{1}{2}$" }, { az: "4", ru: "4", en: "4" }], explanation: { az: "Məhsuldarlıq: $\\frac{1}{5} + \\frac{1}{4} = \\frac{9}{20}$. Vaxt = $\\frac{20}{9} = 2 \\frac{2}{9}$ saat.", ru: "Время = $20/9 = 2 \\frac{2}{9}$ часа.", en: "Time = $20/9 = 2 \\frac{2}{9}$ hours." } },
      { id: 98, type: 'mcq', correct: 2, question: { az: "Hansı bərabərlik doğrudur?", ru: "Какое равенство верно?", en: "Which equality is correct?" }, options: [{ az: "$0,(3) = \\frac{3}{4}$", ru: "$0,(3) = \\frac{3}{4}$", en: "$0.(3) = \\frac{3}{4}$" }, { az: "$0,58(3) = \\frac{7}{12}$", ru: "$0,58(3) = \\frac{7}{12}$", en: "$0.58(3) = \\frac{7}{12}$" }, { az: "$0,(82) = \\frac{7}{11}$", ru: "$0,(82) = \\frac{7}{11}$", en: "$0.(82) = \\frac{7}{11}$" }, { az: "$0,(07) = = \\frac{7}{33}$", ru: "$0,(07) = = \\frac{7}{33}$", en: "$0.(07) = = \\frac{7}{33}$" }, { az: "$0,(2) = = \\frac{2}{10}$", ru: "$0,(2) = = \\frac{2}{10}$", en: "$0.(2) = = \\frac{2}{10}$" }], explanation: { az: "$0,58(3) = \\frac{583-58}{900} = \\frac{525}{900} = \\frac{7}{12}$. B doğru bərabərlikdir.", ru: "$0,58(3) = \\frac{7}{12}$ верно.", en: "$0.58(3) = \\frac{7}{12}$ is correct." } },
      { id: 99, type: 'mcq', correct: 1, question: { az: "$(5 \\frac{17}{32} - 4 \\frac{7}{16}) + (2 \\frac{19}{64} + 3 \\frac{1}{32})$ ifadəsinin qiymətini hesablayın.", ru: "Вычислите значение выражения.", en: "Calculate the expression." }, options: [{ az: "$6 \\frac{25}{64}$", ru: "$6 \\frac{25}{64}$", en: "$6 \\frac{25}{64}$" }, { az: "$6 \\frac{29}{64}$", ru: "$6 \\frac{29}{64}$", en: "$6 \\frac{29}{64}$" }, { az: "$6 \\frac{21}{64}$", ru: "$6 \\frac{21}{64}$", en: "$6 \\frac{21}{64}$" }, { az: "$6 \\frac{27}{64}$", ru: "$6 \\frac{27}{64}$", en: "$6 \\frac{27}{64}$" }, { az: "$6 \\frac{17}{64}$", ru: "$6 \\frac{17}{64}$", en: "$6 \\frac{17}{64}$" }], explanation: { az: "Hesablama: $6 \\frac{29}{64}$.", ru: "Результат: $6 \\frac{29}{64}$.", en: "Result: $6 \\frac{29}{64}$." } },
      { id: 100, type: 'mcq', correct: 3, question: { az: "$(1 \\frac{1}{4})^2 \\cdot \\frac{4}{15} + \\frac{1}{3}$ ifadəsinin qiymətini hesablayın.", ru: "Вычислите $(1 \\frac{1}{4})^2 \\cdot \\frac{4}{15} + \\frac{1}{3}$.", en: "Calculate $(1 \\frac{1}{4})^2 \\cdot \\frac{4}{15} + \\frac{1}{3}$." }, options: [{ az: "$\\frac{4}{5}$", ru: "$\\frac{4}{5}$", en: "$\\frac{4}{5}$" }, { az: "$\\frac{5}{4}$", ru: "$\\frac{5}{4}$", en: "$\\frac{5}{4}$" }, { az: "$\\frac{3}{4}$", ru: "$\\frac{3}{4}$", en: "$\\frac{3}{4}$" }, { az: "$\\frac{1}{5}$", ru: "$\\frac{1}{5}$", en: "$\\frac{1}{5}$" }, { az: "$\\frac{7}{12}$", ru: "$\\frac{7}{12}$", en: "$\\frac{7}{12}$" }], explanation: { az: "$\\frac{25}{16} \\cdot \\frac{4}{15} + \\frac{1}{3} = \\frac{5}{12} + \\frac{4}{12} = \\frac{9}{12} = \\frac{3}{4}$.", ru: "$\\frac{5}{12} + \\frac{4}{12} = \\frac{3}{4}$.", en: "$\\frac{5}{12} + \\frac{4}{12} = \\frac{3}{4}$." } },
      { id: 101, type: 'mcq', correct: 2, question: { az: "$\\frac{1+\\frac{1}{2}}{1-\\frac{1}{2}} \\cdot \\frac{1+\\frac{1}{4}}{1-\\frac{1}{4}} \\cdot \\frac{1+\\frac{1}{5}}{1-\\frac{1}{5}}$ ifadəsinin qiymətini tapın.", ru: "Найдите значение выражения.", en: "Find the value of the expression." }, options: [{ az: "$\\frac{11}{40}$", ru: "$\\frac{11}{40}$", en: "$\\frac{11}{40}$" }, { az: "$10 \\frac{1}{2}$", ru: "$10 \\frac{1}{2}$", en: "$10 \\frac{1}{2}$" }, { az: "$7 \\frac{1}{2}$", ru: "$7 \\frac{1}{2}$", en: "$7 \\frac{1}{2}$" }, { az: "$3 \\frac{3}{4}$", ru: "$3 \\frac{3}{4}$", en: "$3 \\frac{3}{4}$" }, { az: "$3 \\frac{1}{4}$", ru: "$3 \\frac{1}{4}$", en: "$3 \\frac{1}{4}$" }], explanation: { az: "$\\frac{3/2}{1/2} \\cdot \\frac{5/4}{3/4} \\cdot \\frac{6/5}{4/5} = 3 \\cdot \\frac{5}{3} \\cdot \\frac{6}{4} = 5 \\cdot 1,5 = 7,5 = 7 \\frac{1}{2}$.", ru: "$3 \\cdot \\frac{5}{3} \\cdot \\frac{3}{2} = 7,5$.", en: "$3 \\cdot \\frac{5}{3} \\cdot \\frac{3}{2} = 7.5$." } },
      { id: 102, type: 'mcq', correct: 2, question: { az: "Hansı bərabərlik doğru deyil?", ru: "Какое равенство неверно?", en: "Which equality is false?" }, options: [{ az: "$\\frac{5}{6} = 0,8(3)$", ru: "$\\frac{5}{6} = 0,8(3)$", en: "$\\frac{5}{6} = 0.8(3)$" }, { az: "$\\frac{37}{45} = 0,(51)$", ru: "$\\frac{37}{45} = 0,(51)$", en: "$\\frac{37}{45} = 0.(51)$" }, { az: "$\\frac{5}{9} = 0,(5)$", ru: "$\\frac{5}{9} = 0,(5)$", en: "$\\frac{5}{9} = 0.(5)$" }, { az: "$\\frac{1}{33} = 0,(03)$", ru: "$\\frac{1}{33} = 0,(03)$", en: "$\\frac{1}{33} = 0.(03)$" }, { az: "$\\frac{41}{99} = 0,(41)$", ru: "$\\frac{41}{99} = 0,(41)$", en: "$\\frac{41}{99} = 0.(41)$" }], explanation: { az: "$\\frac{37}{45} = 0,8222... = 0,8(2) \\neq 0,(51)$. B doğru deyil.", ru: "$\\frac{37}{45} \\neq 0,(51)$.", en: "$\\frac{37}{45} \\neq 0.(51)$." } },
      { id: 103, type: 'mcq', correct: 1, question: { az: "$\\frac{1}{7}, \\frac{11}{14}, \\frac{5}{28}, \\frac{6}{7}, \\frac{19}{28}$ ədədlərinin ən böyüyü ilə ən kiçiyinin hasilinin 49 mislini tapın.", ru: "Найдите 49-кратное произведение наибольшего и наименьшего чисел.", en: "Find 49 times the product of largest and smallest numbers." }, options: [{ az: "2", ru: "2", en: "2" }, { az: "6", ru: "6", en: "6" }, { az: "49", ru: "49", en: "49" }, { az: "12", ru: "12", en: "12" }, { az: "14", ru: "14", en: "14" }], explanation: { az: "Ən böyük = $\\frac{6}{7}$, Ən kiçik = $\\frac{1}{7}$. $49 \\cdot (\\frac{6}{7} \\cdot \\frac{1}{7}) = 49 \\cdot \\frac{6}{49} = 6$.", ru: "$49 \\cdot \\frac{6}{49} = 6$.", en: "$49 \\cdot \\frac{6}{49} = 6$." } },
      { id: 104, type: 'mcq', correct: 1, question: { az: "$1,42; 1\\frac{2}{5}; 1,(4); 1\\frac{3}{4}$ ədədlərinin artma sırasını müəyyən edin.", ru: "Укажите порядок возрастания чисел.", en: "Determine ascending order of numbers." }, options: [{ az: "$1\\frac{2}{5}; 1,(4); 1,42; 1\\frac{3}{4}$", ru: "$1\\frac{2}{5}; 1,(4); 1,42; 1\\frac{3}{4}$", en: "$1\\frac{2}{5}; 1,(4); 1,42; 1\\frac{3}{4}$" }, { az: "$1\\frac{2}{5}; 1,42; 1,(4); 1\\frac{3}{4}$", ru: "$1\\frac{2}{5}; 1,42; 1,(4); 1\\frac{3}{4}$", en: "$1\\frac{2}{5}; 1,42; 1,(4); 1\\frac{3}{4}$" }, { az: "$1,(4); 1\\frac{2}{5}; 1,42; 1\\frac{3}{4}$", ru: "$1,(4); 1\\frac{2}{5}; 1,42; 1\\frac{3}{4}$", en: "$1,(4); 1\\frac{2}{5}; 1,42; 1\\frac{3}{4}$" }, { az: "$1\\frac{2}{5}; 1,42; 1\\frac{3}{4}; 1,(4)$", ru: "$1\\frac{2}{5}; 1,42; 1\\frac{3}{4}; 1,(4)$", en: "$1\\frac{2}{5}; 1,42; 1\\frac{3}{4}; 1,(4)$" }, { az: "$1,(4); 1\\frac{3}{4}; 1,42; 1\\frac{2}{5}$", ru: "$1,(4); 1\\frac{3}{4}; 1,42; 1\\frac{2}{5}$", en: "$1,(4); 1\\frac{3}{4}; 1,42; 1\\frac{2}{5}$" }], explanation: { az: "$1\\frac{2}{5} = 1,4 < 1,42 < 1,(4) = 1,444... < 1\\frac{3}{4} = 1,75$.", ru: "$1,4 < 1,42 < 1,444... < 1,75$.", en: "$1.4 < 1.42 < 1.444... < 1.75$." } },
      { id: 105, type: 'mcq', correct: 3, image: 'Adi_ve_onluq_kesrler_Image0105.png', question: { az: "Diaqramda mağazada satılan əşyaların miqdarı verilmişdir. Dördüncü gün 18 ədəd satılıbsa, beşinci gün satılan elektrik əşyalarının miqdarı neçədir?", ru: "По диаграмме найдите количество предметов, проданных в пятый день, если в четвертый день продано 18.", en: "Find quantity sold on day 5 if 18 items were sold on day 4." }, options: [{ az: "12", ru: "12", en: "12" }, { az: "18", ru: "18", en: "18" }, { az: "20", ru: "20", en: "20" }, { az: "24", ru: "24", en: "24" }, { az: "30", ru: "30", en: "30" }], explanation: { az: "Diaqrama əsasən dördüncü gün $\\frac{3}{11}$ hissə 18-ə uyğundur. Beşinci gün $\\frac{4}{11}$ hissə $= 24$ ədəd.", ru: "Четвертый день $\\frac{3}{11} = 18 \\implies$ пятый день $\\frac{4}{11} = 24$.", en: "4th day $\\frac{3}{11} = 18 \\implies$ 5th day $\\frac{4}{11} = 24$." } },

      // Open-ended questions (106 to 126)
      { id: 106, type: 'input', correct: "90", question: { az: "Qatar iki stansiya arasındakı məsafənin $\\frac{7}{15}$ hissəsini getdikdən sonra yolun ortasına çatmaq üçün daha 3 km getməli idi. Stansiyalar arasındakı məsafə neçə kilometrdir?", ru: "Поезд прошел $\\frac{7}{15}$ расстояния. Чтобы дойти до середины, нужно пройти еще 3 км. Найдите расстояние.", en: "Train covered $\\frac{7}{15}$ of distance. To reach midpoint, 3 km more is needed. Find distance." }, explanation: { az: "$\\frac{1}{2}x - \\frac{7}{15}x = 3 \\implies \\frac{15-14}{30}x = 3 \\implies \\frac{1}{30}x = 3 \\implies x = 90$ km.", ru: "$\\frac{1}{30}x = 3 \\implies x = 90$ км.", en: "$\\frac{1}{30}x = 3 \\implies x = 90$ km." } },
      { id: 107, type: 'input', correct: "3", question: { az: "$6,(a) = \\frac{19}{3}$ bərabərliyindən $a$-nı tapın.", ru: "Найдите $a$ из равенства $6,(a) = \\frac{19}{3}$.", en: "Find $a$ from $6,(a) = \\frac{19}{3}$." }, explanation: { az: "$6 + \\frac{a}{9} = 6 + \\frac{1}{3} = 6 + \\frac{3}{9} \\implies a = 3$.", ru: "$6 + \\frac{a}{9} = 6 + \\frac{3}{9} \\implies a = 3$.", en: "$6 + \\frac{a}{9} = 6 + \\frac{3}{9} \\implies a = 3$." } },
      { id: 108, type: 'input', correct: "6", question: { az: "$4,(c) = \\frac{14}{3}$ bərabərliyindən $c$-ni tapın.", ru: "Найдите $c$ из равенства $4,(c) = \\frac{14}{3}$.", en: "Find $c$ from $4,(c) = \\frac{14}{3}$." }, explanation: { az: "$4 + \\frac{c}{9} = 4 + \\frac{2}{3} = 4 + \\frac{6}{9} \\implies c = 6$.", ru: "$c = 6$.", en: "$c = 6$." } },
      { id: 109, type: 'input', correct: "5", question: { az: "$7,5 : [3 \\frac{3}{4} - (\\frac{3}{2})^2]$ ifadəsinin qiymətini tapın.", ru: "Вычислите $7,5 : [3 \\frac{3}{4} - (\\frac{3}{2})^2]$.", en: "Calculate $7,5 : [3 \\frac{3}{4} - (\\frac{3}{2})^2]$." }, explanation: { az: "$3,75 - 2,25 = 1,5$. $7,5 : 1,5 = 5$.", ru: "$7,5 : 1,5 = 5$.", en: "$7.5 : 1.5 = 5$." } },
      { id: 110, type: 'input', correct: "10", question: { az: "$a$-nın neçə natural qiyməti $\\frac{1}{5} < \\frac{a}{45} < \\frac{4}{9}$ şərtini ödəyir?", ru: "Сколько натуральных значений $a$ удовлетворяют неравенству?", en: "How many natural values of $a$ satisfy the inequality?" }, explanation: { az: "$\\frac{9}{45} < \\frac{a}{45} < \\frac{20}{45} \\implies a \\in \\{10, 11, ..., 19\\}$ (sayı: 10).", ru: "$9 < a < 20 \\implies 10$ значений.", en: "$9 < a < 20 \\implies 10$ values." } },
      { id: 111, type: 'input', correct: "4", question: { az: "$(0,(2)+0,(3)+0,(4)) \\cdot x = y$ olarsa, $\\frac{x+3y}{x}$ nisbətini tapın.", ru: "Найдите отношение $\\frac{x+3y}{x}$.", en: "Find ratio $\\frac{x+3y}{x}$." }, explanation: { az: "$0,(2)+0,(3)+0,(4) = \\frac{2+3+4}{9} = 1 \\implies 1 \\cdot x = y \\implies x = y$. Nisbət: $\\frac{x+3x}{x} = 4$.", ru: "$x = y \\implies \\frac{4x}{x} = 4$.", en: "$x = y \\implies \\frac{4x}{x} = 4$." } },
      { id: 112, type: 'input', correct: "16", question: { az: "$a=0,(6)$ və $b=0,(3)$ olarsa, $(2+a) : (b - \\frac{1}{2})$ nisbətini tapın.", ru: "Найдите отношение $(2+a) : (b - \\frac{1}{2})$.", en: "Find ratio $(2+a) : (b - \\frac{1}{2})$." }, explanation: { az: "$a = \\frac{2}{3}, b = \\frac{1}{3}$. $2 + \\frac{2}{3} = \\frac{8}{3}$. $|\\frac{1}{3} - \\frac{1}{2}| = \\frac{1}{6}$. $\\frac{8}{3} : \\frac{1}{6} = 16$.", ru: "Модуль значения равен 16.", en: "Absolute value equals 16." } },
      { id: 113, type: 'input', correct: "14", question: { az: "$a=0,(3)$ və $b=0,(6)$ olarsa, $(2+a) : (b - \\frac{1}{2})$ nisbətini tapın.", ru: "Найдите отношение $(2+a) : (b - \\frac{1}{2})$.", en: "Find ratio $(2+a) : (b - \\frac{1}{2})$." }, explanation: { az: "$a = \\frac{1}{3}, b = \\frac{2}{3}$. $2 + \\frac{1}{3} = \\frac{7}{3}$. $\\frac{2}{3} - \\frac{1}{2} = \\frac{1}{6}$. $\\frac{7}{3} : \\frac{1}{6} = 14$.", ru: "Результат равен 14.", en: "Result equals 14." } },
      { id: 114, type: 'input', correct: "24", question: { az: "Məxrəci 30 olan və $(\\frac{1}{5}; \\frac{1}{3})$ aralığında yerləşən adi kəsrlərin surətləri cəmini tapın.", ru: "Найдите сумму числителей дробей со знаменателем 30 в интервале $(\\frac{1}{5}; \\frac{1}{3})$.", en: "Find sum of numerators with denominator 30 in $(\\frac{1}{5}; \\frac{1}{3})$." }, explanation: { az: "$\\frac{6}{30} < \\frac{k}{30} < \\frac{10}{30} \\implies k \\in \\{7, 8, 9\\}$. Cəm: $7 + 8 + 9 = 24$.", ru: "$k \\in \\{7, 8, 9\\} \\implies 7+8+9 = 24$.", en: "$k \\in \\{7, 8, 9\\} \\implies 7+8+9 = 24$." } },
      { id: 115, type: 'input', correct: "96", question: { az: "Ən böyük ikirəqəmli ədədlə məxrəci 33 olan ən böyük düzgün kəsrin hasilini tapın.", ru: "Найдите произведение наибольшего двузначного числа и наибольшей правильной дроби со знаменателем 33.", en: "Find product of largest two-digit number and largest proper fraction with denominator 33." }, explanation: { az: "$99 \\cdot \\frac{32}{33} = 3 \\cdot 32 = 96$.", ru: "$99 \\cdot \\frac{32}{33} = 96$.", en: "$99 \\cdot \\frac{32}{33} = 96$." } },
      { id: 116, type: 'input', correct: "75", question: { az: "Qablaşdırılmış malın qiyməti 85 manatdır. Qabın qiyməti malın qiymətinin $\\frac{2}{15}$ hissəsini təşkil edirsə, malın qiyməti neçə manatdır?", ru: "Цена упакованного товара 85 манатов. Упаковка составляет $\\frac{2}{15}$ стоимости товара. Найдите цену товара.", en: "Packaged item costs 85 manats. Packaging is $\\frac{2}{15}$ of item price. Find item price." }, explanation: { az: "$x + \\frac{2}{15}x = 85 \\implies \\frac{17}{15}x = 85 \\implies x = 75$ manat.", ru: "$\\frac{17}{15}x = 85 \\implies x = 75$.", en: "$\\frac{17}{15}x = 85 \\implies x = 75$." } },
      { id: 117, type: 'input', correct: "15", question: { az: "Məxrəci 18 olan və $(\\frac{1}{3}; \\frac{1}{2})$ aralığında yerləşən adi kəsrlərin surətləri cəmini tapın.", ru: "Найдите сумму числителей дробей со знаменателем 18 в интервале $(\\frac{1}{3}; \\frac{1}{2})$.", en: "Find sum of numerators with denominator 18 in $(\\frac{1}{3}; \\frac{1}{2})$." }, explanation: { az: "$\\frac{6}{18} < \\frac{k}{18} < \\frac{9}{18} \\implies k \\in \\{7, 8\\}$. Cəm: $7 + 8 = 15$.", ru: "$k \\in \\{7, 8\\} \\implies 7+8 = 15$.", en: "$k \\in \\{7, 8\\} \\implies 7+8 = 15$." } },
      { id: 118, type: 'input', correct: "10", image: 'Adi_ve_onluq_kesrler_Image0118.png', question: { az: "Beş gün ərzində satılan malın miqdarının gündəlik diaqramı verilib. Üçüncü gün 15 ədəd mal satılıbsa, ikinci gün satılan malın miqdarı neçədir?", ru: "По диаграмме найдите количество товара, проданного во 2-й день, если в 3-й день продано 15.", en: "Find quantity sold on day 2 if 15 items were sold on day 3." }, explanation: { az: "3-cü gün $\\frac{3}{11} = 15 \\implies 1$ hissə = 5 $\\implies 2$-ci gün $\\frac{2}{11} = 10$ ədəd.", ru: "$15 : 3 \\cdot 2 = 10$.", en: "$15 : 3 \\cdot 2 = 10$." } },
      { id: 119, type: 'input', correct: "9", question: { az: "Ədədin $\\frac{1}{4}$-i ilə $\\frac{4}{9}$-nün cəmi 25-ə bərabərdir. Bu ədədin $\\frac{1}{4}$-ni tapın.", ru: "Сумма $\\frac{1}{4}$ и $\\frac{4}{9}$ числа равна 25. Найдите $\\frac{1}{4}$ этого числа.", en: "Sum of $\\frac{1}{4}$ and $\\frac{4}{9}$ of a number is 25. Find $\\frac{1}{4}$ of the number." }, explanation: { az: "$(\\frac{1}{4} + \\frac{4}{9})x = \\frac{25}{36}x = 25 \\implies x = 36$. Ədədin $\\frac{1}{4}$-i: $36 \\cdot \\frac{1}{4} = 9$.", ru: "$x = 36 \\implies \\frac{1}{4} \\cdot 36 = 9$.", en: "$x = 36 \\implies \\frac{1}{4} \\cdot 36 = 9$." } },
      { id: 120, type: 'input', correct: "12", question: { az: "$\\frac{36 - n^2}{n^2}$ kəsrinin qiymətini tam ədəd edən natural $n$-lərin cəmini tapın.", ru: "Найдите сумму натуральных $n$, при которых значение дроби является целым числом.", en: "Find sum of natural $n$ for which the value of the fraction is an integer." }, explanation: { az: "$\\frac{36}{n^2} - 1 \\in \\mathbb{Z} \\implies n^2 \\mid 36 \\implies n \\in \\{1, 2, 3, 6\\}$. Cəm: $1+2+3+6 = 12$.", ru: "$n \\in \\{1, 2, 3, 6\\} \\implies 1+2+3+6 = 12$.", en: "$n \\in \\{1, 2, 3, 6\\} \\implies 1+2+3+6 = 12$." } },
      { id: 121, type: 'input', correct: "64", question: { az: "$\\frac{64 + n^2}{n^2}$ kəsrinin qiymətini tam ədəd edən natural $n$-lərin hasilini tapın.", ru: "Найдите произведение натуральных $n$, при которых значение дроби является целым числом.", en: "Find product of natural $n$ for which the value of the fraction is an integer." }, explanation: { az: "$\\frac{64}{n^2} + 1 \\in \\mathbb{Z} \\implies n^2 \\mid 64 \\implies n \\in \\{1, 2, 4, 8\\}$. Hasil: $1 \\cdot 2 \\cdot 4 \\cdot 8 = 64$.", ru: "$n \\in \\{1, 2, 4, 8\\} \\implies 1 \\cdot 2 \\cdot 4 \\cdot 8 = 64$.", en: "$n \\in \\{1, 2, 4, 8\\} \\implies 1 \\cdot 2 \\cdot 4 \\cdot 8 = 64$." } },
      { id: 122, type: 'input', correct: "6.6", question: { az: "$\\frac{6}{\\frac{0,3}{0,33} + \\frac{0,6}{0,66} - \\frac{0,9}{0,99}}$ kəsrinin qiymətini hesablayın.", ru: "Вычислите значение выражения.", en: "Calculate the value." }, explanation: { az: "Məxrəc: $\\frac{10}{11} + \\frac{10}{11} - \\frac{10}{11} = \\frac{10}{11}$. $6 : \\frac{10}{11} = \\frac{66}{10} = 6,6$.", ru: "$6 : \\frac{10}{11} = 6,6$.", en: "$6 : \\frac{10}{11} = 6.6$." } },
      { id: 123, type: 'input', correct: "15", question: { az: "$\\frac{5n-4}{2n+13}$ kəsrinin düzgün kəsr olması üçün $n$-in aldığı natural qiymətlərin cəmini hesablayın.", ru: "Найдите сумму натуральных $n$, при которых дробь правильная.", en: "Find sum of natural $n$ for which fraction is proper." }, explanation: { az: "$5n - 4 < 2n + 13 \\implies 3n < 17 \\implies n \\le 5$. Natural $n \\in \\{1, 2, 3, 4, 5\\}$. Cəm: $1+2+3+4+5 = 15$.", ru: "$n \\in \\{1, 2, 3, 4, 5\\} \\implies 15$.", en: "$n \\in \\{1, 2, 3, 4, 5\\} \\implies 15$." } },
      { id: 124, type: 'input', correct: "41", question: { az: "Üç ardıcıl tək natural ədədin cəminin $\\frac{3}{5}$ hissəsi 70,2 olarsa, böyük ədədi tapın.", ru: "Сумма 3 последовательных нечетных чисел умноженная на $\\frac{3}{5}$ равна 70,2. Найдите большее число.", en: "$\\frac{3}{5}$ of sum of 3 consecutive odd numbers is 70.2. Find the largest number." }, explanation: { az: "Cəm = $70,2 : \\frac{3}{5} = 117$. $x + (x+2) + (x+4) = 117 \\implies 3x + 6 = 117 \\implies 3x = 111 \\implies x = 37$. Böyük ədəd: $37 + 4 = 41$.", ru: "$3x + 6 = 117 \\implies x = 37$. Большее число: 41.", en: "$3x + 6 = 117 \\implies x = 37$. Largest number: 41." } },
      { id: 125, type: 'input', correct: "60", question: { az: "Əvvəlcə səbətdən 6 alma, sonra qalan almaların sayının $\\frac{1}{3}$-i qədər və daha 6 alma götürdülər. Nəticədə səbətdə əvvəlki almaların yarısı qaldı. Əvvəlcə səbətdə neçə alma var idi?", ru: "Из корзины взяли 6 яблок, затем $\\frac{1}{3}$ остатка и еще 6. Осталась половина первоначального количества. Сколько яблок было?", en: "First 6 apples were taken, then $\\frac{1}{3}$ of remainder plus 6 more. Half of initial amount remained. How many apples initially?" }, explanation: { az: "Tənlik: $(x - 6) - \\frac{1}{3}(x - 6) - 6 = \\frac{x}{2} \\implies \\frac{2}{3}(x - 6) - 6 = \\frac{x}{2} \\implies \\frac{2}{3}x - 10 = \\frac{x}{2} \\implies \\frac{1}{6}x = 10 \\implies x = 60$.", ru: "$\\frac{1}{6}x = 10 \\implies x = 60$.", en: "$\\frac{1}{6}x = 10 \\implies x = 60$." } },
      { id: 126, type: 'input', correct: "15", question: { az: "$\\frac{7n-6}{3n+15}$ kəsrinin düzgün kəsr olması üçün $n$-in aldığı natural qiymətlərin cəmini hesablayın.", ru: "Найдите сумму натуральных $n$, при которых дробь правильная.", en: "Find sum of natural $n$ for which fraction is proper." }, explanation: { az: "$7n - 6 < 3n + 15 \\implies 4n < 21 \\implies n \\le 5$. Natural $n \\in \\{1, 2, 3, 4, 5\\}$. Cəm: $1+2+3+4+5 = 15$.", ru: "$n \\in \\{1, 2, 3, 4, 5\\} \\implies 15$.", en: "$n \\in \\{1, 2, 3, 4, 5\\} \\implies 15$." } }
    ];

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toLowerCase() === lang);
      });

      const t = translations[lang];
      document.getElementById('app-title').innerText = t.title;
      document.getElementById('app-subtitle').innerText = t.subtitle;
      document.getElementById('score-label').innerText = t.scoreLabel;
      document.getElementById('grid-title-text').innerText = t.gridTitle;
      document.getElementById('btn-mode-slide').innerText = t.slideMode;
      document.getElementById('btn-mode-list').innerText = t.listMode;
      document.getElementById('prev-btn').innerText = t.prevBtn;
      document.getElementById('next-btn').innerText = t.nextBtn;

      renderGrid();
      renderContent();
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-mode-slide').classList.toggle('active', mode === 'slide');
      document.getElementById('btn-mode-list').classList.toggle('active', mode === 'list');
      document.getElementById('slide-nav-box').style.display = (mode === 'slide') ? 'flex' : 'none';

      renderGrid();
      renderContent();
    }

    function renderGrid() {
      const grid = document.getElementById('question-grid');
      grid.innerHTML = '';

      questionsData.forEach((q, idx) => {
        const btn = document.createElement('button');
        let cls = 'grid-btn';

        if (userAnswers[q.id] !== undefined) {
          if (checkIsCorrect(q, userAnswers[q.id])) cls += ' correct';
          else cls += ' incorrect';
        }

        if (currentMode === 'slide' && idx === currentSlide) {
          cls += ' active';
        }

        btn.className = cls;
        btn.innerText = q.id;
        btn.onclick = () => {
          if (currentMode === 'slide') {
            currentSlide = idx;
            renderContent();
            renderGrid();
          } else {
            const el = document.getElementById(`q-card-${q.id}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        };

        grid.appendChild(btn);
      });
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderContent();
        renderGrid();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function nextSlide() {
      if (currentSlide < questionsData.length - 1) {
        currentSlide++;
        renderContent();
        renderGrid();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function renderContent() {
      const container = document.getElementById('questions-list');
      container.innerHTML = '';

      const t = translations[currentLang];

      if (currentMode === 'slide') {
        document.getElementById('slide-info').innerText = `${t.slideInfo} ${currentSlide + 1} / ${questionsData.length}`;
        document.getElementById('prev-btn').disabled = (currentSlide === 0);
        document.getElementById('next-btn').disabled = (currentSlide === questionsData.length - 1);

        const q = questionsData[currentSlide];
        container.appendChild(buildQuestionCard(q));
      } else {
        questionsData.forEach(q => {
          container.appendChild(buildQuestionCard(q));
        });
      }

      updateScore();

      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function buildQuestionCard(q) {
      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = `q-card-${q.id}`;

      const t = translations[currentLang];
      const qText = q.question[currentLang] || q.question['az'];

      let imageHtml = '';
      if (q.image && String(q.image).trim() !== '') {
        imageHtml = `
          <div class="question-image-box">
            <img src="${q.image}" 
                 alt="Sual #${q.id} Şəkli" 
                 onerror="this.onerror=null; this.parentElement.innerHTML='<div style=\\'color:#94a3b8; font-size:0.85rem; font-style:italic; padding:6px;\\'>[Şəkil tapılmadı: ${q.image}]</div>';" />
          </div>
        `;
      }

      let bodyHtml = '';

      if (q.type === 'mcq') {
        const optsHtml = q.options.map((opt, idx) => {
          const optText = opt[currentLang] || opt['az'];
          const prefix = String.fromCharCode(65 + idx) + ') ';

          let btnClass = 'option-btn';
          let isChecked = userAnswers[q.id] !== undefined;
          if (isChecked) {
            if (idx === q.correct) btnClass += ' correct';
            else if (userAnswers[q.id] === idx) btnClass += ' incorrect';
          }

          return `
            <button class="${btnClass}" ${isChecked ? 'disabled' : ''} onclick="selectMcq(${q.id}, ${idx})">
              <span><b>${prefix}</b></span> <span>${optText}</span>
            </button>
          `;
        }).join('');

        bodyHtml = `<div class="options-grid">${optsHtml}</div>`;
      } else {
        const isChecked = userAnswers[q.id] !== undefined;
        const userVal = isChecked ? userAnswers[q.id] : '';

        bodyHtml = `
          <div class="input-area">
            <input type="text" id="input-${q.id}" class="text-input" value="${userVal}" ${isChecked ? 'disabled' : ''} placeholder="${t.placeholder}">
            <button class="submit-btn" ${isChecked ? 'disabled' : ''} onclick="submitInput(${q.id})">${t.submit}</button>
          </div>
        `;
      }

      let feedbackHtml = '';
      let explHtml = '';

      if (userAnswers[q.id] !== undefined) {
        const isCorrect = checkIsCorrect(q, userAnswers[q.id]);
        const fbClass = isCorrect ? 'correct' : 'incorrect';
        const corrAnsText = q.type === 'mcq' ? String.fromCharCode(65 + q.correct) : q.correct;
        const fbText = isCorrect
          ? t.correctFeedback
          : t.incorrectFeedback + `<b>${corrAnsText}</b>`;

        feedbackHtml = `<div class="feedback ${fbClass}">${fbText}</div>`;

        const explText = q.explanation ? (q.explanation[currentLang] || q.explanation['az']) : '';
        explHtml = `
          <div class="explanation-box">
            <div class="explanation-title">${t.explanationTitle}</div>
            <div>${explText}</div>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="question-header">
          <span class="question-num">#${q.id}</span>
          <div class="question-text">${qText}</div>
        </div>
        ${imageHtml}
        ${bodyHtml}
        ${feedbackHtml}
        ${explHtml}
      `;

      return card;
    }

    function selectMcq(qId, idx) {
      userAnswers[qId] = idx;
      renderGrid();
      renderContent();
    }

    function submitInput(qId) {
      const val = document.getElementById(`input-${qId}`).value.trim();
      if (!val) return;
      userAnswers[qId] = val;
      renderGrid();
      renderContent();
    }

    function checkIsCorrect(q, answer) {
      if (q.type === 'mcq') {
        return answer === q.correct;
      } else {
        return String(answer).toLowerCase().replace(/\s+/g, '').replace(',', '.') === String(q.correct).toLowerCase().replace(/\s+/g, '').replace(',', '.');
      }
    }

    function updateScore() {
      let correctCount = 0;
      questionsData.forEach(q => {
        if (userAnswers[q.id] !== undefined && checkIsCorrect(q, userAnswers[q.id])) {
          correctCount++;
        }
      });
      document.getElementById('score-val').innerText = `${correctCount} / ${questionsData.length}`;
    }

    setLanguage('az');
    setMode('slide');
  </script>
</body>
</html>
