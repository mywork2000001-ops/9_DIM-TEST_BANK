    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toLowerCase() === lang);
      });

      const t = translations[lang];
      document.getElementById('app-title').innerText = t.title;
      document.getElementById('app-subtitle').innerText = t.subtitle;
      document.getElementById('score-label').innerText = t.scoreLabel;
      document.getElementById('grid-title-text').innerText = t.gridTitle;
      document.getElementById('btn-mode-slide').innerText = t.slideMode;
      document.getElementById('btn-mode-list').innerText = t.listMode;
      document.getElementById('prev-btn').innerText = t.prevBtn;
      document.getElementById('next-btn').innerText = t.nextBtn;

      renderGrid();
      renderContent();
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-mode-slide').classList.toggle('active', mode === 'slide');
      document.getElementById('btn-mode-list').classList.toggle('active', mode === 'list');
      document.getElementById('slide-nav-box').style.display = (mode === 'slide') ? 'flex' : 'none';

      renderGrid();
      renderContent();
    }

    function renderGrid() {
      const grid = document.getElementById('question-grid');
      grid.innerHTML = '';

      questionsData.forEach((q, idx) => {
        const btn = document.createElement('button');
        let cls = 'grid-btn';

        if (userAnswers[q.id] !== undefined) {
          if (checkIsCorrect(q, userAnswers[q.id])) cls += ' correct';
          else cls += ' incorrect';
        }

        if (currentMode === 'slide' && idx === currentSlide) {
          cls += ' active';
        }

        btn.className = cls;
        btn.innerText = q.id;
        btn.onclick = () => {
          if (currentMode === 'slide') {
            currentSlide = idx;
            renderContent();
            renderGrid();
          } else {
            const el = document.getElementById(`q-card-${q.id}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        };

        grid.appendChild(btn);
      });
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderContent();
        renderGrid();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function nextSlide() {
      if (currentSlide < questionsData.length - 1) {
        currentSlide++;
        renderContent();
        renderGrid();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function renderContent() {
      const container = document.getElementById('questions-list');
      container.innerHTML = '';

      const t = translations[currentLang];

      if (currentMode === 'slide') {
        document.getElementById('slide-info').innerText = `${t.slideInfo} ${currentSlide + 1} / ${questionsData.length}`;
        document.getElementById('prev-btn').disabled = (currentSlide === 0);
        document.getElementById('next-btn').disabled = (currentSlide === questionsData.length - 1);

        const q = questionsData[currentSlide];
        container.appendChild(buildQuestionCard(q));
      } else {
        questionsData.forEach(q => {
          container.appendChild(buildQuestionCard(q));
        });
      }

      updateScore();

      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function buildQuestionCard(q) {
      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = `q-card-${q.id}`;

      const t = translations[currentLang];
      const qText = q.question[currentLang] || q.question['az'];

      // Safe image rendering with onerror fallback
      let imageHtml = '';
      if (q.image && String(q.image).trim() !== '') {
        imageHtml = `
          <div class="question-image-box">
            <img src="${q.image}" 
                 alt="Sual #${q.id} İllüstrasiyası" 
                 onerror="this.onerror=null; this.parentElement.innerHTML='<div style=\\'color:#94a3b8; font-size:0.85rem; font-style:italic; padding:6px;\\'>[Şəkil tapılmadı: ${q.image}]</div>';" />
          </div>
        `;
      }

      let bodyHtml = '';

      if (q.type === 'mcq') {
        const optsHtml = q.options.map((opt, idx) => {
          const optText = opt[currentLang] || opt['az'];
          const prefix = String.fromCharCode(65 + idx) + ') ';

          let btnClass = 'option-btn';
          let isChecked = userAnswers[q.id] !== undefined;
          if (isChecked) {
            if (idx === q.correct) btnClass += ' correct';
            else if (userAnswers[q.id] === idx) btnClass += ' incorrect';
          }

          return `
            <button class="${btnClass}" ${isChecked ? 'disabled' : ''} onclick="selectMcq(${q.id}, ${idx})">
              <span><b>${prefix}</b></span> <span>${optText}</span>
            </button>
          `;
        }).join('');

        bodyHtml = `<div class="options-grid">${optsHtml}</div>`;
      } else {
        const isChecked = userAnswers[q.id] !== undefined;
        const userVal = isChecked ? userAnswers[q.id] : '';

        bodyHtml = `
          <div class="input-area">
            <input type="text" id="input-${q.id}" class="text-input" value="${userVal}" ${isChecked ? 'disabled' : ''} placeholder="${t.placeholder}">
            <button class="submit-btn" ${isChecked ? 'disabled' : ''} onclick="submitInput(${q.id})">${t.submit}</button>
          </div>
        `;
      }

      let feedbackHtml = '';
      let explHtml = '';

      if (userAnswers[q.id] !== undefined) {
        const isCorrect = checkIsCorrect(q, userAnswers[q.id]);
        const fbClass = isCorrect ? 'correct' : 'incorrect';
        const corrAnsText = q.type === 'mcq' ? String.fromCharCode(65 + q.correct) : q.correct;
        const fbText = isCorrect
          ? t.correctFeedback
          : t.incorrectFeedback + `<b>${corrAnsText}</b>`;

        feedbackHtml = `<div class="feedback ${fbClass}">${fbText}</div>`;

        const explText = q.explanation ? (q.explanation[currentLang] || q.explanation['az']) : '';
        explHtml = `
          <div class="explanation-box">
            <div class="explanation-title">${t.explanationTitle}</div>
            <div>${explText}</div>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="question-header">
          <span class="question-num">#${q.id}</span>
          <div class="question-text">${qText}</div>
        </div>
        ${imageHtml}
        ${bodyHtml}
        ${feedbackHtml}
        ${explHtml}
      `;

      return card;
    }

    function selectMcq(qId, idx) {
      userAnswers[qId] = idx;
      renderGrid();
      renderContent();
    }

    function submitInput(qId) {
      const val = document.getElementById(`input-${qId}`).value.trim();
      if (!val) return;
      userAnswers[qId] = val;
      renderGrid();
      renderContent();
    }

    function checkIsCorrect(q, answer) {
      if (q.type === 'mcq') {
        return answer === q.correct;
      } else {
        return String(answer).toLowerCase().replace(/\s+/g, '') === String(q.correct).toLowerCase().replace(/\s+/g, '');
      }
    }

    function updateScore() {
      let correctCount = 0;
      questionsData.forEach(q => {
        if (userAnswers[q.id] !== undefined && checkIsCorrect(q, userAnswers[q.id])) {
          correctCount++;
        }
      });
      document.getElementById('score-val').innerText = `${correctCount} / ${questionsData.length}`;
    }

    // App Initialization
    setLanguage('az');
    setMode('slide');
  </script>
</body>
