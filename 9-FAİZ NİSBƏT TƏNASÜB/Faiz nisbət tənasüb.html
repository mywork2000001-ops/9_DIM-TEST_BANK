<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faiz, nisbət, tənasüb — İnteraktiv Test</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">

<script>
document.addEventListener("DOMContentLoaded", function() {
  if(window.renderMathInElement){
    renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ], throwOnError:false

});

<style>
:root{--indigo:#6366f1;--indigo-d:#4f46e5;--green:#10b981;--red:#ef4444;--slate:#64748b;--bg:#f1f5f9;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:#1e293b;}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid #e2e8f0;box-shadow:0 2px 10px rgba(15,23,42,.06);}
.h-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 18px;max-width:1100px;margin:0 auto;}
.h-title{display:flex;flex-direction:column;}
.h-title h1{font-size:1.05rem;background:linear-gradient(90deg,var(--indigo-d),#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;}
.h-title span{font-size:.72rem;color:var(--slate);}
.h-ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.seg{display:flex;background:#eef2ff;border-radius:10px;padding:3px;gap:2px;}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:.78rem;cursor:pointer;font-weight:600;color:#475569;transition:.2s;}
.seg button.on{background:var(--indigo);color:#fff;box-shadow:0 2px 6px rgba(99,102,241,.4);}
.score{display:flex;gap:6px;font-size:.75rem;font-weight:700;}
.chip{padding:5px 10px;border-radius:999px;background:#f8fafc;border:1px solid #e2e8f0;}
.chip.g{color:var(--green);border-color:#a7f3d0;}
.chip.r{color:var(--red);border-color:#fecaca;}
.chip.n{color:var(--slate);}
.grid-wrap{max-width:1100px;margin:0 auto;padding:0 18px 10px;}
#qGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:4px;max-height:112px;overflow-y:auto;padding:4px;}
.qbtn{border:0;background:#e2e8f0;color:#475569;border-radius:6px;height:26px;font-size:.68rem;font-weight:700;cursor:pointer;transition:.15s;}
.qbtn:hover{transform:scale(1.12);}
.qbtn.right{background:var(--green);color:#fff;}
.qbtn.wrong{background:var(--red);color:#fff;}
.qbtn.current{outline:2.5px solid var(--indigo);outline-offset:1px;transform:scale(1.1);}
main{max-width:860px;margin:0 auto;padding:18px 14px 80px;}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 18px rgba(15,23,42,.07);margin-bottom:16px;border:1px solid #e8edf4;}
.q-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.q-num{background:linear-gradient(135deg,var(--indigo),#a855f7);color:#fff;border-radius:8px;padding:4px 10px;font-size:.8rem;font-weight:800;white-space:nowrap;}
.q-badge{font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:999px;}
.b-ok{background:#d1fae5;color:#065f46;}
.b-no{background:#fee2e2;color:#991b1b;}
.b-un{background:#f1f5f9;color:#64748b;}
.q-text{font-size:.95rem;line-height:1.65;margin-bottom:12px;}
.q-image{margin:10px 0 14px;text-align:center;}
.q-image img{max-width:100%;max-height:260px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;padding:6px;}
.img-missing{color:#94a3b8;font-size:.85rem;font-style:italic;}
.opt{display:flex;gap:10px;align-items:center;border:2px solid #e2e8f0;border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:.18s;font-size:.9rem;}
.opt:hover{border-color:#c7d2fe;background:#f5f7ff;}
.opt .letter{flex:0 0 28px;height:28px;border-radius:8px;background:#eef2ff;color:var(--indigo-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;}
.opt.correct{border-color:var(--green);background:#ecfdf5;}
.opt.correct .letter{background:var(--green);color:#fff;}
.opt.wrongsel{border-color:var(--red);background:#fef2f2;}
.opt.wrongsel .letter{background:var(--red);color:#fff;}
.opt.muted{opacity:.55;}
.opt.disabled{cursor:default;}
.expl{margin-top:14px;background:#eff6ff;border-left:4px solid var(--indigo);border-radius:10px;padding:14px 16px;font-size:.88rem;line-height:1.7;animation:fadeIn .4s;}
.expl h4{color:var(--indigo-d);margin-bottom:6px;font-size:.9rem;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.nav-btns{display:flex;justify-content:space-between;gap:10px;margin:6px 0 18px;}
.nav-btns button{flex:1;padding:12px;border:0;border-radius:12px;background:var(--indigo);color:#fff;font-weight:700;font-size:.9rem;cursor:pointer;transition:.2s;}
.nav-btns button:hover{background:var(--indigo-d);}
.nav-btns button:disabled{background:#cbd5e1;cursor:not-allowed;}
.reset-btn{display:block;margin:20px auto;padding:10px 26px;border:0;border-radius:10px;background:#fff;color:var(--red);border:2px solid #fecaca;font-weight:700;cursor:pointer;}
.reset-btn:hover{background:#fef2f2;}
@media(max-width:640px){.h-top{padding:10px;gap:8px;}.q-text{font-size:.9rem;}}
</style>
</head>

    <div class="h-title"><h1 id="appTitle"></h1><span id="appSub"></span></div>

      <div class="seg" id="modeSeg"></div>
    </div>

</header>

const questionsData=[
{id:1,type:'mcq',correct:2,image:'Faiz_nisbet_tenasub_Image0001.png',question:{az:"Şəkildə göstərilən kvadrat 25 konqruyent kvadrata bölünmüşdür. Ştrixlənmiş hissənin sahəsi böyük kvadratın sahəsinin neçə faizidir?",ru:"Квадрат на рисунке разделён на 25 конгруэнтных квадратов. Сколько процентов площади большого квадрата составляет площадь заштрихованной части?",en:"The square shown is divided into 25 congruent squares. What percent of the large square's area is the shaded part?"},options:[{az:"40%",ru:"40%",en:"40%"},{az:"50%",ru:"50%",en:"50%"},{az:"48%",ru:"48%",en:"48%"},{az:"56%",ru:"56%",en:"56%"},{az:"44%",ru:"44%",en:"44%"}],explanation:{az:"Həlli: 1) Böyük kvadrat 25 bərabər kvadrata bölünüb, onlardan 12-si ştrixlənib. 2) $\\frac{12}{25}\\cdot100\\%=48\\%$. Cavab: 48%.",ru:"Решение: 1) Большой квадрат разделён на 25 равных квадратов, заштриховано 12. 2) $\\frac{12}{25}\\cdot100\\%=48\\%$. Ответ: 48%.",en:"Solution: 1) The square is split into 25 equal squares; 12 are shaded. 2) $\\frac{12}{25}\\cdot100\\%=48\\%$. Answer: 48%."}},
{id:2,type:'mcq',correct:0,image:'Faiz_nisbet_tenasub_Image0002.png',question:{az:"Şəkildə göstərilən kvadrat 25 konqruyent kvadrata bölünmüşdür. Ştrixlənmiş hissənin sahəsi böyük kvadratın sahəsinin neçə faizidir?",ru:"Квадрат на рисунке разделён на 25 конгруэнтных квадратов. Сколько процентов площади большого квадрата составляет заштрихованная часть?",en:"The square shown is divided into 25 congruent squares. What percent of the large square is shaded?"},options:[{az:"44%",ru:"44%",en:"44%"},{az:"40%",ru:"40%",en:"40%"},{az:"64%",ru:"64%",en:"64%"},{az:"50%",ru:"50%",en:"50%"},{az:"48%",ru:"48%",en:"48%"}],explanation:{az:"Həlli: 1) 25 kvadratdan 11-i ştrixlənib. 2) $\\frac{11}{25}\\cdot100\\%=44\\%$. Cavab: 44%.",ru:"Решение: 1) Из 25 квадратов заштриховано 11. 2) $\\frac{11}{25}\\cdot100\\%=44\\%$. Ответ: 44%.",en:"Solution: 1) 11 of 25 squares are shaded. 2) $\\frac{11}{25}\\cdot100\\%=44\\%$. Answer: 44%."}},

{id:6,type:'mcq',correct:3,image:'Faiz_nisbet_tenasub_Image0006.png',question:{az:"Konqruyent kvadratlara bölünmüş $ABCD$ kvadratının neçə faizi ştrixlənməmişdir?",ru:"Сколько процентов квадрата $ABCD$, разбитого на конгруэнтные квадраты, не заштриховано?",en:"What percent of square $ABCD$, divided into congruent squares, is NOT shaded?"},options:[{az:"93%",ru:"93%",en:"93%"},{az:"80%",ru:"80%",en:"80%"},{az:"97%",ru:"97%",en:"97%"},{az:"90%",ru:"90%",en:"90%"},{az:"88%",ru:"88%",en:"88%"}],explanation:{az:"Həlli: 1) Kvadrat 100 konqruyent kvadrata bölünüb, 10-u ştrixlənib. 2) Ştrixlənməmiş hissə: $100-10=90$ kvadrat. 3) $\\frac{90}{100}=90\\%$.",ru:"Решение: 1) Квадрат разбит на 100 конгруэнтных квадратов, заштриховано 10. 2) Незаштриховано: $100-10=90$. 3) $\\frac{90}{100}=90\\%$.",en:"Solution: 1) The square has 100 congruent cells; 10 are shaded. 2) Unshaded: $100-10=90$. 3) $\\frac{90}{100}=90\\%$."}},

{id:14,type:'mcq',correct:0,question:{az:"$32{,}18\\%$-i onluq kəsr şəklində göstərin.",ru:"Запишите $32{,}18\\%$ в виде десятичной дроби.",en:"Write $32{,}18\\%$ as a decimal."},options:[{az:"0,3218",ru:"0,3218",en:"0,3218"},{az:"3,218",ru:"3,218",en:"3,218"},{az:"32,18",ru:"32,18",en:"32,18"},{az:"321,8",ru:"321,8",en:"321,8"},{az:"0,03218",ru:"0,03218",en:"0,03218"}],explanation:{az:"Həlli: $32{,}18:100=0{,}3218$.",ru:"Решение: $32{,}18:100=0{,}3218$.",en:"Solution: $32{,}18:100=0{,}3218$."}},
{id:15,type:'mcq',correct:3,question:{az:"Ədədin yarısı onun neçə faizidir?",ru:"Сколько процентов составляет половина числа от самого числа?",en:"What percent of a number is its half?"},options:[{az:"55%",ru:"55%",en:"55%"},{az:"5%",ru:"5%",en:"5%"},{az:"25%",ru:"25%",en:"25%"},{az:"50%",ru:"50%",en:"50%"},{az:"75%",ru:"75%",en:"75%"}],explanation:{az:"Həlli: Yarım $=\\frac{1}{2}$. $\\frac{1}{2}\\cdot100\\%=50\\%$.",ru:"Решение: Половина $=\\frac{1}{2}$. $\\frac{1}{2}\\cdot100\\%=50\\%$.",en:"Solution: Half $=\\frac{1}{2}$. $\\frac{1}{2}\\cdot100\\%=50\\%$."}},
{id:16,type:'mcq',correct:0,question:{az:"130-un $30\\%$-ni tapın.",ru:"Найдите $30\\%$ от 130.",en:"Find $30\\%$ of 130."},options:[{az:"39",ru:"39",en:"39"},{az:"60",ru:"60",en:"60"},{az:"42",ru:"42",en:"42"},{az:"26",ru:"26",en:"26"},{az:"15",ru:"15",en:"15"}],explanation:{az:"Həlli: $130\\cdot\\frac{30}{100}=130\\cdot0{,}3=39$.",ru:"Решение: $130\\cdot\\frac{30}{100}=130\\cdot0{,}3=39$.",en:"Solution: $130\\cdot\\frac{30}{100}=130\\cdot0{,}3=39$."}},
{id:17,type:'mcq',correct:0,question:{az:"300 ədədinin $40\\%$-ni tapın.",ru:"Найдите $40\\%$ от числа 300.",en:"Find $40\\%$ of 300."},options:[{az:"120",ru:"120",en:"120"},{az:"100",ru:"100",en:"100"},{az:"150",ru:"150",en:"150"},{az:"180",ru:"180",en:"180"},{az:"200",ru:"200",en:"200"}],explanation:{az:"Həlli: $300\\cdot0{,}4=120$.",ru:"Решение: $300\\cdot0{,}4=120$.",en:"Solution: $300\\cdot0{,}4=120$."}},
{id:18,type:'mcq',correct:3,question:{az:"$d=\\frac{a\\cdot b}{c}$ ifadəsində $a$, $b$ və $c$ müsbət ədədlərdir. $a$-nı 10 dəfə artırıb, $c$-ni 5 dəfə azaldıb, $b$-ni isə dəyişmədikdə $d$ necə dəyişər?",ru:"В выражении $d=\\frac{a\\cdot b}{c}$ числа $a$, $b$, $c$ положительны. Если $a$ увеличить в 10 раз, $c$ уменьшить в 5 раз, а $b$ не менять, как изменится $d$?",en:"In $d=\\frac{a\\cdot b}{c}$, $a$, $b$, $c$ are positive. If $a$ is multiplied by 10, $c$ divided by 5 and $b$ unchanged, how does $d$ change?"},options:[{az:"5 dəfə artar",ru:"Увеличится в 5 раз",en:"Increases 5 times"},{az:"2 dəfə azalar",ru:"Уменьшится в 2 раза",en:"Decreases 2 times"},{az:"2 dəfə artar",ru:"Увеличится в 2 раза",en:"Increases 2 times"},{az:"50 dəfə artar",ru:"Увеличится в 50 раз",en:"Increases 50 times"},{az:"50 dəfə azalar",ru:"Уменьшится в 50 раз",en:"Decreases 50 times"}],explanation:{az:"Həlli: 1) $d'=\\frac{10a\\cdot b}{c:5}=\\frac{10a\\cdot b\\cdot5}{c}$. 2) $d'=50\\cdot\\frac{ab}{c}=50d$. Deməli, $d$ 50 dəfə artar.",ru:"Решение: 1) $d'=\\frac{10a\\cdot b}{c:5}=\\frac{10a\\cdot b\\cdot5}{c}$. 2) $d'=50\\cdot\\frac{ab}{c}=50d$. Значит, $d$ увеличится в 50 раз.",en:"Solution: 1) $d'=\\frac{10a\\cdot b}{c:5}=\\frac{10a\\cdot b\\cdot5}{c}$. 2) $d'=50d$. So $d$ increases 50 times."}},
{id:19,type:'mcq',correct:3,question:{az:"4 və 5 ədədləri ilə mütənasib olan iki müsbət ədədin cəmi 45-dir. Bu ədədlərin hasilini tapın.",ru:"Сумма двух положительных чисел, пропорциональных 4 и 5, равна 45. Найдите произведение этих чисел.",en:"The sum of two positive numbers proportional to 4 and 5 is 45. Find their product."},options:[{az:"180",ru:"180",en:"180"},{az:"600",ru:"600",en:"600"},{az:"225",ru:"225",en:"225"},{az:"500",ru:"500",en:"500"},{az:"250",ru:"250",en:"250"}],explanation:{az:"Həlli: 1) Ədədlər $4k$ və $5k$: $4k+5k=45\\Rightarrow 9k=45\\Rightarrow k=5$. 2) Ədədlər 20 və 25. 3) Hasil: $20\\cdot25=500$.",ru:"Решение: 1) Числа $4k$ и $5k$: $9k=45\\Rightarrow k=5$. 2) Числа 20 и 25. 3) Произведение: $20\\cdot25=500$.",en:"Solution: 1) Numbers are $4k$ and $5k$: $9k=45\\Rightarrow k=5$. 2) They are 20 and 25. 3) Product: $20\\cdot25=500$."}},
{id:20,type:'mcq',correct:3,question:{az:"Məktəbə gətirilən 400 kitabın $34{,}5\\%$-i ədəbiyyat, qalanları riyaziyyat kitablarıdır. Məktəbə neçə riyaziyyat kitabı gətirilmişdir?",ru:"Из 400 книг, привезённых в школу, $34{,}5\\%$ — литература, остальные — математика. Сколько книг по математике привезено?",en:"Of 400 books brought to school, $34{,}5\\%$ are literature and the rest are mathematics. How many math books were brought?"},options:[{az:"138",ru:"138",en:"138"},{az:"241",ru:"241",en:"241"},{az:"145",ru:"145",en:"145"},{az:"262",ru:"262",en:"262"},{az:"135",ru:"135",en:"135"}],explanation:{az:"Həlli: 1) Riyaziyyat kitablarının faizi: $100\\%-34{,}5\\%=65{,}5\\%$. 2) $400\\cdot0{,}655=262$ kitab.",ru:"Решение: 1) Доля книг по математике: $100\\%-34{,}5\\%=65{,}5\\%$. 2) $400\\cdot0{,}655=262$ книги.",en:"Solution: 1) Math share: $100\\%-34{,}5\\%=65{,}5\\%$. 2) $400\\cdot0{,}655=262$ books."}},
{id:21,type:'mcq',correct:1,question:{az:"Səyyah 15 km getdikdən sonra yolun $25\\%$-i gedilməmiş qaldı. Bütün yolun uzunluğunu tapın.",ru:"После того как путешественник прошёл 15 км, непройденной осталось $25\\%$ пути. Найдите длину всего пути.",en:"After a traveler covered 15 km, $25\\%$ of the road remained. Find the total length of the road."},options:[{az:"24 km",ru:"24 км",en:"24 km"},{az:"20 km",ru:"20 км",en:"20 km"},{az:"23 km",ru:"23 км",en:"23 km"},{az:"26 km",ru:"26 км",en:"26 km"},{az:"22 km",ru:"22 км",en:"22 km"}],explanation:{az:"Həlli: 1) Gedilmiş hissə: $100\\%-25\\%=75\\%$. 2) $75\\%=15$ km, bütöv yol: $15:0{,}75=20$ km.",ru:"Решение: 1) Пройдено: $100\\%-25\\%=75\\%$. 2) $75\\%=15$ км, весь путь: $15:0{,}75=20$ км.",en:"Solution: 1) Covered: $100\\%-25\\%=75\\%$. 2) $75\\%=15$ km, total: $15:0{,}75=20$ km."}},
{id:22,type:'mcq',correct:3,question:{az:"Boro 4 saatda 20,4 km yol getdi. Eyni sürətlə 6 saatda o neçə kilometr yol gedər?",ru:"Боро за 4 часа прошёл 20,4 км. Сколько километров он пройдёт за 6 часов с той же скоростью?",en:"Boro walked 20,4 km in 4 hours. At the same speed, how many km will he walk in 6 hours?"},options:[{az:"30,8",ru:"30,8",en:"30,8"},{az:"35,2",ru:"35,2",en:"35,2"},{az:"35,3",ru:"35,3",en:"35,3"},{az:"30,6",ru:"30,6",en:"30,6"},{az:"31,6",ru:"31,6",en:"31,6"}],explanation:{az:"Həlli: 1) Sürət: $20{,}4:4=5{,}1$ km/saat. 2) 6 saatda: $5{,}1\\cdot6=30{,}6$ km.",ru:"Решение: 1) Скорость: $20{,}4:4=5{,}1$ км/ч. 2) За 6 часов: $5{,}1\\cdot6=30{,}6$ км.",en:"Solution: 1) Speed: $20{,}4:4=5{,}1$ km/h. 2) In 6 hours: $5{,}1\\cdot6=30{,}6$ km."}},
{id:23,type:'mcq',correct:3,question:{az:"$3{,}6:x=9:5$ tənasübündən $x$-i tapın.",ru:"Найдите $x$ из пропорции $3{,}6:x=9:5$.",en:"Find $x$ from the proportion $3{,}6:x=9:5$."},options:[{az:"1,8",ru:"1,8",en:"1,8"},{az:"1",ru:"1",en:"1"},{az:"1,5",ru:"1,5",en:"1,5"},{az:"2",ru:"2",en:"2"},{az:"2,5",ru:"2,5",en:"2,5"}],explanation:{az:"Həlli: 1) Tənasübün xassəsi: $9x=3{,}6\\cdot5=18$. 2) $x=18:9=2$.",ru:"Решение: 1) Свойство пропорции: $9x=3{,}6\\cdot5=18$. 2) $x=18:9=2$.",en:"Solution: 1) Cross-multiply: $9x=3{,}6\\cdot5=18$. 2) $x=18:9=2$."}},
{id:24,type:'mcq',correct:1,question:{az:"$2{,}4:0{,}3=x:0{,}5$ tənasübündən $x$-i tapın.",ru:"Найдите $x$ из пропорции $2{,}4:0{,}3=x:0{,}5$.",en:"Find $x$ from the proportion $2{,}4:0{,}3=x:0{,}5$."},options:[{az:"2",ru:"2",en:"2"},{az:"4",ru:"4",en:"4"},{az:"6",ru:"6",en:"6"},{az:"-2",ru:"-2",en:"-2"},{az:"8",ru:"8",en:"8"}],explanation:{az:"Həlli: 1) $0{,}3x=2{,}4\\cdot0{,}5=1{,}2$. 2) $x=1{,}2:0{,}3=4$.",ru:"Решение: 1) $0{,}3x=2{,}4\\cdot0{,}5=1{,}2$. 2) $x=1{,}2:0{,}3=4$.",en:"Solution: 1) $0{,}3x=2{,}4\\cdot0{,}5=1{,}2$. 2) $x=1{,}2:0{,}3=4$."}},
{id:25,type:'mcq',correct:0,question:{az:"$10:4=25:y$ tənasübündən $y$-i tapın.",ru:"Найдите $y$ из пропорции $10:4=25:y$.",en:"Find $y$ from the proportion $10:4=25:y$."},options:[{az:"10",ru:"10",en:"10"},{az:"20",ru:"20",en:"20"},{az:"16",ru:"16",en:"16"},{az:"12,5",ru:"12,5",en:"12,5"},{az:"40",ru:"40",en:"40"}],explanation:{az:"Həlli: 1) $10y=4\\cdot25=100$. 2) $y=100:10=10$.",ru:"Решение: 1) $10y=4\\cdot25=100$. 2) $y=100:10=10$.",en:"Solution: 1) $10y=4\\cdot25=100$. 2) $y=100:10=10$."}},
{id:26,type:'mcq',correct:4,question:{az:"$36:7=x:14$ tənasübündən $x$-i tapın.",ru:"Найдите $x$ из пропорции $36:7=x:14$.",en:"Find $x$ from the proportion $36:7=x:14$."},options:[{az:"84",ru:"84",en:"84"},{az:"12",ru:"12",en:"12"},{az:"36",ru:"36",en:"36"},{az:"49",ru:"49",en:"49"},{az:"72",ru:"72",en:"72"}],explanation:{az:"Həlli: 1) $7x=36\\cdot14=504$. 2) $x=504:7=72$.",ru:"Решение: 1) $7x=36\\cdot14=504$. 2) $x=504:7=72$.",en:"Solution: 1) $7x=36\\cdot14=504$. 2) $x=504:7=72$."}},
{id:27,type:'mcq',correct:4,question:{az:"Ət bişirildikdə öz çəkisinin $4\\%$-ni itirir. 20 kg təzə ətdən neçə kg bişmiş ət alınır?",ru:"При варке мясо теряет $4\\%$ своего веса. Сколько кг варёного мяса получится из 20 кг сырого?",en:"Meat loses $4\\%$ of its weight when cooked. How many kg of cooked meat are obtained from 20 kg of fresh meat?"},options:[{az:"19,6",ru:"19,6",en:"19,6"},{az:"18,4",ru:"18,4",en:"18,4"},{az:"18,8",ru:"18,8",en:"18,8"},{az:"19,4",ru:"19,4",en:"19,4"},{az:"19,2",ru:"19,2",en:"19,2"}],explanation:{az:"Həlli: 1) Bişmiş ət təzə ətin $100\\%-4\\%=96\\%$-ni təşkil edir. 2) $20\\cdot0{,}96=19{,}2$ kg.",ru:"Решение: 1) Варёное мясо составляет $100\\%-4\\%=96\\%$ от сырого. 2) $20\\cdot0{,}96=19{,}2$ кг.",en:"Solution: 1) Cooked meat is $100\\%-4\\%=96\\%$ of fresh. 2) $20\\cdot0{,}96=19{,}2$ kg."}},
{id:28,type:'mcq',correct:0,question:{az:"Sinifdəki 30 şagirddən $30\\%$-i oğlandır. Sinifdə neçə qız var?",ru:"Из 30 учеников класса $30\\%$ — мальчики. Сколько в классе девочек?",en:"Of 30 students in a class, $30\\%$ are boys. How many girls are there?"},options:[{az:"21",ru:"21",en:"21"},{az:"14",ru:"14",en:"14"},{az:"25",ru:"25",en:"25"},{az:"5",ru:"5",en:"5"},{az:"7",ru:"7",en:"7"}],explanation:{az:"Həlli: 1) Oğlanlar: $30\\cdot0{,}3=9$. 2) Qızlar: $30-9=21$.",ru:"Решение: 1) Мальчиков: $30\\cdot0{,}3=9$. 2) Девочек: $30-9=21$.",en:"Solution: 1) Boys: $30\\cdot0{,}3=9$. 2) Girls: $30-9=21$."}},
{id:29,type:'mcq',correct:1,question:{az:"240 ədədinin $25\\%$-ini tapın.",ru:"Найдите $25\\%$ от числа 240.",en:"Find $25\\%$ of 240."},options:[{az:"150",ru:"150",en:"150"},{az:"60",ru:"60",en:"60"},{az:"30",ru:"30",en:"30"},{az:"100",ru:"100",en:"100"},{az:"125",ru:"125",en:"125"}],explanation:{az:"Həlli: $240\\cdot0{,}25=60$ (və ya $240:4=60$).",ru:"Решение: $240\\cdot0{,}25=60$ (или $240:4=60$).",en:"Solution: $240\\cdot0{,}25=60$ (or $240:4=60$)."}},
{id:30,type:'mcq',correct:1,question:{az:"Fəhlə gündə 32 detal hazırlayır. O, məhsuldarlığını $25\\%$ artırarsa, bir gündə neçə detal hazırlayar?",ru:"Рабочий делает 32 детали в день. Если он повысит производительность на $25\\%$, сколько деталей будет делать в день?",en:"A worker makes 32 parts a day. If productivity increases by $25\\%$, how many parts will he make per day?"},options:[{az:"44",ru:"44",en:"44"},{az:"40",ru:"40",en:"40"},{az:"38",ru:"38",en:"38"},{az:"36",ru:"36",en:"36"},{az:"42",ru:"42",en:"42"}],explanation:{az:"Həlli: 1) Artım: $32\\cdot0{,}25=8$ detal. 2) $32+8=40$ detal.",ru:"Решение: 1) Прирост: $32\\cdot0{,}25=8$ деталей. 2) $32+8=40$ деталей.",en:"Solution: 1) Increase: $32\\cdot0{,}25=8$ parts. 2) $32+8=40$ parts."}},
{id:31,type:'mcq',correct:0,question:{az:"155 t mis filizindən 31 t mis alınır. Filizin tərkibində neçə faiz mis var?",ru:"Из 155 т медной руды получают 31 т меди. Сколько процентов меди в руде?",en:"31 t of copper is obtained from 155 t of copper ore. What percent of the ore is copper?"},options:[{az:"20%",ru:"20%",en:"20%"},{az:"30%",ru:"30%",en:"30%"},{az:"25%",ru:"25%",en:"25%"},{az:"15%",ru:"15%",en:"15%"},{az:"40%",ru:"40%",en:"40%"}],explanation:{az:"Həlli: $\\frac{31}{155}\\cdot100\\%=\\frac{1}{5}\\cdot100\\%=20\\%$.",ru:"Решение: $\\frac{31}{155}\\cdot100\\%=\\frac{1}{5}\\cdot100\\%=20\\%$.",en:"Solution: $\\frac{31}{155}\\cdot100\\%=\\frac{1}{5}\\cdot100\\%=20\\%$."}},
{id:32,type:'mcq',correct:0,question:{az:"Avtobus 2 saatda 220 km yol gedir. Həmin sürətlə 4 saatda avtobus neçə km yol gedər?",ru:"Автобус за 2 часа проезжает 220 км. Сколько км он проедет за 4 часа с той же скоростью?",en:"A bus travels 220 km in 2 hours. At the same speed, how far does it go in 4 hours?"},options:[{az:"440 km",ru:"440 км",en:"440 km"},{az:"400 km",ru:"400 км",en:"400 km"},{az:"480 km",ru:"480 км",en:"480 km"},{az:"340 km",ru:"340 км",en:"340 km"},{az:"380 km",ru:"380 км",en:"380 km"}],explanation:{az:"Həlli: 1) Sürət: $220:2=110$ km/saat. 2) 4 saatda: $110\\cdot4=440$ km.",ru:"Решение: 1) Скорость: $220:2=110$ км/ч. 2) За 4 часа: $110\\cdot4=440$ км.",en:"Solution: 1) Speed: $220:2=110$ km/h. 2) In 4 hours: $110\\cdot4=440$ km."}},
{id:33,type:'mcq',correct:4,question:{az:"4 saatda 17 detal hazırlayan fəhlə eyni məhsuldarlıqla 85 detali neçə saata hazırlayar?",ru:"Рабочий за 4 часа делает 17 деталей. За сколько часов он сделает 85 детали с той же производительностью?",en:"A worker makes 17 parts in 4 hours. How many hours for 85 parts at the same rate?"},options:[{az:"28",ru:"28",en:"28"},{az:"60",ru:"60",en:"60"},{az:"40",ru:"40",en:"40"},{az:"16",ru:"16",en:"16"},{az:"20",ru:"20",en:"20"}],explanation:{az:"Həlli: 1) $85:17=5$ dəfə çox detal. 2) Vaxt: $4\\cdot5=20$ saat.",ru:"Решение: 1) $85:17=5$ раз больше деталей. 2) Время: $4\\cdot5=20$ часов.",en:"Solution: 1) $85:17=5$ times more parts. 2) Time: $4\\cdot5=20$ hours."}},
{id:34,type:'mcq',correct:1,question:{az:"Briqada 190 otağı təmir etdikdən sonra məlum oldu ki, plan $95\\%$ yerinə yetirilmişdir. Plana görə briqada neçə otağı təmir etməli idi?",ru:"После ремонта 190 комнат оказалось, что план выполнен на $95\\%$. Сколько комнат бригада должна была отремонтировать по плану?",en:"After repairing 190 rooms, the plan was $95\\%$ complete. How many rooms were planned?"},options:[{az:"210",ru:"210",en:"210"},{az:"200",ru:"200",en:"200"},{az:"196",ru:"196",en:"196"},{az:"198",ru:"198",en:"198"},{az:"192",ru:"192",en:"192"}],explanation:{az:"Həlli: 1) $190$ otaq planın $95\\%$-dir. 2) Plan: $190:0{,}95=200$ otaq.",ru:"Решение: 1) 190 комнат — это $95\\%$ плана. 2) План: $190:0{,}95=200$ комнат.",en:"Solution: 1) 190 rooms is $95\\%$ of the plan. 2) Plan: $190:0{,}95=200$ rooms."}},
{id:35,type:'mcq',correct:2,question:{az:"Fəhlə 170 detal hazırladıqdan sonra məlum oldu ki, plan $68\\%$ yerinə yetirilmişdir. Plana görə fəhlə neçə detal hazırlamalı idi?",ru:"После изготовления 170 деталей оказалось, что план выполнен на $68\\%$. Сколько деталей по плану должен был изготовить рабочий?",en:"After making 170 parts, the plan was $68\\%$ complete. How many parts were planned?"},options:[{az:"240",ru:"240",en:"240"},{az:"230",ru:"230",en:"230"},{az:"250",ru:"250",en:"250"},{az:"290",ru:"290",en:"290"},{az:"210",ru:"210",en:"210"}],explanation:{az:"Həlli: $170:0{,}68=250$ detal.",ru:"Решение: $170:0{,}68=250$ деталей.",en:"Solution: $170:0{,}68=250$ parts."}},
{id:36,type:'mcq',correct:4,question:{az:"Sinifdə oxuyan 25 şagirddən 4 nəfəri \"5\"-lə, 9 nəfəri \"3\"-lə, qalanları isə \"4\"-lə oxuyur. Bütün şagirdlərin neçə faizi \"4\"-lə oxuyur?",ru:"Из 25 учеников класса 4 учатся на «5», 9 — на «3», остальные — на «4». Сколько процентов всех учеников учатся на «4»?",en:"Of 25 students, 4 get \"5\", 9 get \"3\", the rest get \"4\". What percent get \"4\"?"},options:[{az:"70",ru:"70",en:"70"},{az:"36",ru:"36",en:"36"},{az:"20",ru:"20",en:"20"},{az:"16",ru:"16",en:"16"},{az:"48",ru:"48",en:"48"}],explanation:{az:"Həlli: 1) \"4\"-lə oxuyanlar: $25-4-9=12$. 2) $\\frac{12}{25}\\cdot100\\%=48\\%$.",ru:"Решение: 1) На «4»: $25-4-9=12$. 2) $\\frac{12}{25}\\cdot100\\%=48\\%$.",en:"Solution: 1) \"4\" students: $25-4-9=12$. 2) $\\frac{12}{25}\\cdot100\\%=48\\%$."}},
{id:37,type:'mcq',correct:1,question:{az:"Sinifdə oxuyan 30 şagirddən 5 nəfəri \"5\"-lə, 13 nəfəri \"3\"-lə, qalanları isə \"4\"-lə oxuyur. Bütün şagirdlərin neçə faizi \"4\"-lə oxuyur?",ru:"Из 30 учеников 5 учатся на «5», 13 — на «3», остальные — на «4». Сколько процентов учатся на «4»?",en:"Of 30 students, 5 get \"5\", 13 get \"3\", the rest get \"4\". What percent get \"4\"?"},options:[{az:"30",ru:"30",en:"30"},{az:"40",ru:"40",en:"40"},{az:"42",ru:"42",en:"42"},{az:"36",ru:"36",en:"36"},{az:"48",ru:"48",en:"48"}],explanation:{az:"Həlli: 1) \"4\"-lə oxuyanlar: $30-5-13=12$. 2) $\\frac{12}{30}\\cdot100\\%=40\\%$.",ru:"Решение: 1) На «4»: $30-5-13=12$. 2) $\\frac{12}{30}\\cdot100\\%=40\\%$.",en:"Solution: 1) \"4\" students: $30-5-13=12$. 2) $\\frac{12}{30}\\cdot100\\%=40\\%$."}},
{id:38,type:'mcq',correct:2,question:{az:"450 ədədi 2, 3, 4 ədədləri ilə düz mütənasib hissələrə bölünmüşdür. Alınmış ədədlərdən ən kiçiyini tapın.",ru:"Число 450 разделено на части, прямо пропорциональные 2, 3 и 4. Найдите наименьшую часть.",en:"450 is divided into parts proportional to 2, 3, 4. Find the smallest part."},options:[{az:"150",ru:"150",en:"150"},{az:"300",ru:"300",en:"300"},{az:"100",ru:"100",en:"100"},{az:"200",ru:"200",en:"200"},{az:"250",ru:"250",en:"250"}],explanation:{az:"Həlli: 1) Hissələrin cəmi $2+3+4=9$ vahid. 2) Vahid: $450:9=50$. 3) Ən kiçik hissə: $2\\cdot50=100$.",ru:"Решение: 1) Всего $2+3+4=9$ частей. 2) Одна часть: $450:9=50$. 3) Наименьшая: $2\\cdot50=100$.",en:"Solution: 1) Total units $2+3+4=9$. 2) One unit: $450:9=50$. 3) Smallest: $2\\cdot50=100$."}},
{id:39,type:'mcq',correct:3,question:{az:"Şəhərin əhalisi bir il ərzində 70000 nəfərdən 74200 nəfərə qədər artdı. Əhalinin illik artım faizini tapın.",ru:"Население города за год выросло с 70000 до 74200 человек. Найдите годовой процент прироста.",en:"A city's population grew from 70000 to 74200 in a year. Find the annual growth percent."},options:[{az:"10%",ru:"10%",en:"10%"},{az:"8%",ru:"8%",en:"8%"},{az:"4%",ru:"4%",en:"4%"},{az:"6%",ru:"6%",en:"6%"},{az:"12%",ru:"12%",en:"12%"}],explanation:{az:"Həlli: 1) Artım: $74200-70000=4200$. 2) $\\frac{4200}{70000}\\cdot100\\%=6\\%$.",ru:"Решение: 1) Прирост: $74200-70000=4200$. 2) $\\frac{4200}{70000}\\cdot100\\%=6\\%$.",en:"Solution: 1) Increase: $74200-70000=4200$. 2) $\\frac{4200}{70000}\\cdot100\\%=6\\%$."}},
{id:40,type:'mcq',correct:1,question:{az:"Şagird kitabın 60 səhifəsini oxudu. Oxunmamış hissə bütün kitabın $60\\%$-i olarsa, kitab neçə səhifədir?",ru:"Ученик прочитал 60 страниц книги. Если непрочитанная часть составляет $60\\%$ всей книги, сколько страниц в книге?",en:"A student read 60 pages. If the unread part is $60\\%$ of the book, how many pages does the book have?"},options:[{az:"120",ru:"120",en:"120"},{az:"150",ru:"150",en:"150"},{az:"180",ru:"180",en:"180"},{az:"100",ru:"100",en:"100"},{az:"160",ru:"160",en:"160"}],explanation:{az:"Həlli: 1) Oxunmuş hissə: $100\\%-60\\%=40\\%$. 2) $60:0{,}4=150$ səhifə.",ru:"Решение: 1) Прочитано: $100\\%-60\\%=40\\%$. 2) $60:0{,}4=150$ страниц.",en:"Solution: 1) Read part: $100\\%-60\\%=40\\%$. 2) $60:0{,}4=150$ pages."}},
{id:41,type:'mcq',correct:0,question:{az:"Bağı gübrələmək üçün bağban 2 kg azot, 3 kg fosfat və 6 kg şonqı qarışdırır. Azotun kütləsinin ümumi qarışığın kütləsinə nisbətini tapın.",ru:"Садовник смешивает 2 кг азота, 3 кг фосфата и 6 кг навоза. Найдите отношение массы азота к массе всей смеси.",en:"A gardener mixes 2 kg of nitrogen, 3 kg of phosphate and 6 kg of manure. Find the ratio of nitrogen's mass to the total mixture."},options:[{az:"$\\frac{2}{11}$",ru:"$\\frac{2}{11}$",en:"$\\frac{2}{11}$"},{az:"$\\frac{3}{11}$",ru:"$\\frac{3}{11}$",en:"$\\frac{3}{11}$"},{az:"$\\frac{6}{11}$",ru:"$\\frac{6}{11}$",en:"$\\frac{6}{11}$"},{az:"$\\frac{2}{3}$",ru:"$\\frac{2}{3}$",en:"$\\frac{2}{3}$"},{az:"$\\frac{1}{3}$",ru:"$\\frac{1}{3}$",en:"$\\frac{1}{3}$"}],explanation:{az:"Həlli: 1) Ümumi kütlə: $2+3+6=11$ kg. 2) Nisbət: $\\frac{2}{11}$.",ru:"Решение: 1) Общая масса: $2+3+6=11$ кг. 2) Отношение: $\\frac{2}{11}$.",en:"Solution: 1) Total mass: $2+3+6=11$ kg. 2) Ratio: $\\frac{2}{11}$."}},
{id:42,type:'mcq',correct:0,question:{az:"Bağı gübrələmək üçün bağban 2 kg azot, 3 kg fosfat və 6 kg şonqı qarışdırır. Fosfatın kütləsinin ümumi qarışığın kütləsinə nisbətini tapın.",ru:"Садовник смешивает 2 кг азота, 3 кг фосфата и 6 кг навоза. Найдите отношение массы фосфата к массе всей смеси.",en:"A gardener mixes 2 kg of nitrogen, 3 kg of phosphate and 6 kg of manure. Find the ratio of phosphate to the total mixture."},options:[{az:"$\\frac{3}{11}$",ru:"$\\frac{3}{11}$",en:"$\\frac{3}{11}$"},{az:"$\\frac{2}{11}$",ru:"$\\frac{2}{11}$",en:"$\\frac{2}{11}$"},{az:"$\\frac{6}{11}$",ru:"$\\frac{6}{11}$",en:"$\\frac{6}{11}$"},{az:"$\\frac{2}{9}$",ru:"$\\frac{2}{9}$",en:"$\\frac{2}{9}$"},{az:"$\\frac{1}{3}$",ru:"$\\frac{1}{3}$",en:"$\\frac{1}{3}$"}],explanation:{az:"Həlli: 1) Ümumi kütlə: $2+3+6=11$ kg. 2) Nisbət: $\\frac{3}{11}$.",ru:"Решение: 1) Общая масса: $2+3+6=11$ кг. 2) Отношение: $\\frac{3}{11}$.",en:"Solution: 1) Total: $2+3+6=11$ kg. 2) Ratio: $\\frac{3}{11}$."}},
{id:43,type:'mcq',correct:4,question:{az:"6 ədəd eyni metal pulun kütləsi 15 qram olarsa, 14 belə pulun kütləsi neçə qram olar?",ru:"Если масса 6 одинаковых металлических монет 15 г, какова масса 14 таких монет?",en:"If 6 identical metal coins weigh 15 grams, how much do 14 such coins weigh?"},options:[{az:"30",ru:"30",en:"30"},{az:"28",ru:"28",en:"28"},{az:"49",ru:"49",en:"49"},{az:"45",ru:"45",en:"45"},{az:"35",ru:"35",en:"35"}],explanation:{az:"Həlli: 1) Bir pulun kütləsi: $15:6=2{,}5$ q. 2) 14 pul: $2{,}5\\cdot14=35$ q.",ru:"Решение: 1) Масса одной монеты: $15:6=2{,}5$ г. 2) 14 монет: $2{,}5\\cdot14=35$ г.",en:"Solution: 1) One coin: $15:6=2{,}5$ g. 2) 14 coins: $2{,}5\\cdot14=35$ g."}},
{id:44,type:'mcq',correct:3,question:{az:"Velosipedçi 15 km məsafəni 2,5 saata gedir. O, həmin sürətlə 1 dəqiqəyə nə qədər yol gedər?",ru:"Велосипедист проезжает 15 км за 2,5 часа. Какой путь он проедет за 1 минуту с той же скоростью?",en:"A cyclist covers 15 km in 2,5 hours. At the same speed, how far does he travel in 1 minute?"},options:[{az:"90 m",ru:"90 м",en:"90 m"},{az:"150 m",ru:"150 м",en:"150 m"},{az:"80 m",ru:"80 м",en:"80 m"},{az:"100 m",ru:"100 м",en:"100 m"},{az:"60 m",ru:"60 м",en:"60 m"}],explanation:{az:"Həlli: 1) Sürət: $15:2{,}5=6$ km/saat. 2) $6$ km/saat $=\\frac{6000\\text{ m}}{60\\text{ dəq}}=100$ m/dəq.",ru:"Решение: 1) Скорость: $15:2{,}5=6$ км/ч. 2) $6$ км/ч $=\\frac{6000\\text{ м}}{60\\text{ мин}}=100$ м/мин.",en:"Solution: 1) Speed: $15:2{,}5=6$ km/h. 2) $6$ km/h $=\\frac{6000\\text{ m}}{60\\text{ min}}=100$ m/min."}},
{id:45,type:'mcq',correct:3,question:{az:"Velosipedçi 9 km məsafəni 1,5 saata gedir. O, həmin sürətlə 2 dəqiqəyə nə qədər yol gedər?",ru:"Велосипедист проезжает 9 км за 1,5 часа. Какой путь он проедет за 2 минуты с той же скоростью?",en:"A cyclist covers 9 km in 1,5 hours. At the same speed, how far does he travel in 2 minutes?"},options:[{az:"150 m",ru:"150 м",en:"150 m"},{az:"90 m",ru:"90 м",en:"90 m"},{az:"10 m",ru:"10 м",en:"10 m"},{az:"200 m",ru:"200 м",en:"200 m"},{az:"600 m",ru:"600 м",en:"600 m"}],explanation:{az:"Həlli: 1) Sürət: $9:1{,}5=6$ km/saat $=100$ m/dəq. 2) 2 dəqiqədə: $100\\cdot2=200$ m.",ru:"Решение: 1) Скорость: $9:1{,}5=6$ км/ч $=100$ м/мин. 2) За 2 минуты: $100\\cdot2=200$ м.",en:"Solution: 1) Speed: $9:1{,}5=6$ km/h $=100$ m/min. 2) In 2 min: $100\\cdot2=200$ m."}},
{id:46,type:'mcq',correct:2,question:{az:"8 saatda 480 km yol gedən kater həmin sürətlə 6 saatda nə qədər yol gedər?",ru:"Катер, прошедший 480 км за 8 часов, сколько пройдёт за 6 часов с той же скоростью?",en:"A boat travels 480 km in 8 hours. At the same speed, how far does it go in 6 hours?"},options:[{az:"180 km",ru:"180 км",en:"180 km"},{az:"420 km",ru:"420 км",en:"420 km"},{az:"360 km",ru:"360 км",en:"360 km"},{az:"320 km",ru:"320 км",en:"320 km"},{az:"240 km",ru:"240 км",en:"240 km"}],explanation:{az:"Həlli: 1) Sürət: $480:8=60$ km/saat. 2) 6 saatda: $60\\cdot6=360$ km.",ru:"Решение: 1) Скорость: $480:8=60$ км/ч. 2) За 6 часов: $60\\cdot6=360$ км.",en:"Solution: 1) Speed: $480:8=60$ km/h. 2) In 6 hours: $60\\cdot6=360$ km."}},
{id:47,type:'mcq',correct:3,question:{az:"Motosikletçi 48 km/saat sürətlə 8 saat yol getdi. O, həmin məsafəni 6 saata hansı sürətlə qət edər?",ru:"Мотоциклист ехал 8 часов со скоростью 48 км/ч. С какой скоростью он проедет это расстояние за 6 часов?",en:"A motorcyclist rode for 8 hours at 48 km/h. At what speed would he cover the same distance in 6 hours?"},options:[{az:"55 km/saat",ru:"55 км/ч",en:"55 km/h"},{az:"36 km/saat",ru:"36 км/ч",en:"36 km/h"},{az:"42 km/saat",ru:"42 км/ч",en:"42 km/h"},{az:"64 km/saat",ru:"64 км/ч",en:"64 km/h"},{az:"48 km/saat",ru:"48 км/ч",en:"48 km/h"}],explanation:{az:"Həlli: 1) Məsafə: $48\\cdot8=384$ km. 2) Sürət: $384:6=64$ km/saat.",ru:"Решение: 1) Расстояние: $48\\cdot8=384$ км. 2) Скорость: $384:6=64$ км/ч.",en:"Solution: 1) Distance: $48\\cdot8=384$ km. 2) Speed: $384:6=64$ km/h."}},
{id:48,type:'mcq',correct:3,question:{az:"20 ədədi 80-in neçə faizidir?",ru:"Сколько процентов от 80 составляет число 20?",en:"What percent of 80 is 20?"},options:[{az:"40%",ru:"40%",en:"40%"},{az:"20%",ru:"20%",en:"20%"},{az:"50%",ru:"50%",en:"50%"},{az:"25%",ru:"25%",en:"25%"},{az:"75%",ru:"75%",en:"75%"}],explanation:{az:"Həlli: $\\frac{20}{80}\\cdot100\\%=25\\%$.",ru:"Решение: $\\frac{20}{80}\\cdot100\\%=25\\%$.",en:"Solution: $\\frac{20}{80}\\cdot100\\%=25\\%$."}},
{id:49,type:'mcq',correct:4,question:{az:"20 ədədi 40 ədədinin neçə faizidir?",ru:"Сколько процентов от 40 составляет число 20?",en:"What percent of 40 is 20?"},options:[{az:"30%",ru:"30%",en:"30%"},{az:"20%",ru:"20%",en:"20%"},{az:"40%",ru:"40%",en:"40%"},{az:"25%",ru:"25%",en:"25%"},{az:"50%",ru:"50%",en:"50%"}],explanation:{az:"Həlli: $\\frac{20}{40}\\cdot100\\%=50\\%$.",ru:"Решение: $\\frac{20}{40}\\cdot100\\%=50\\%$.",en:"Solution: $\\frac{20}{40}\\cdot100\\%=50\\%$."}},
{id:50,type:'mcq',correct:0,question:{az:"55 ədədinin $20\\%$-ni tapın.",ru:"Найдите $20\\%$ от числа 55.",en:"Find $20\\%$ of 55."},options:[{az:"11",ru:"11",en:"11"},{az:"20",ru:"20",en:"20"},{az:"27,5",ru:"27,5",en:"27,5"},{az:"15",ru:"15",en:"15"},{az:"1,19",ru:"1,19",en:"1,19"}],explanation:{az:"Həlli: $55\\cdot0{,}2=11$.",ru:"Решение: $55\\cdot0{,}2=11$.",en:"Solution: $55\\cdot0{,}2=11$."}},
{id:51,type:'mcq',correct:2,question:{az:"Velosipedçi 1200 m məsafəni 2 dəqiqəyə qət edir. O, həmin sürətlə 40 dəqiqədə nə qədər yol gedər?",ru:"Велосипедист проезжает 1200 м за 2 минуты. Сколько он проедет за 40 минут с той же скоростью?",en:"A cyclist covers 1200 m in 2 minutes. How far does he go in 40 minutes at the same speed?"},options:[{az:"12000 m",ru:"12000 м",en:"12000 m"},{az:"36000 m",ru:"36000 м",en:"36000 m"},{az:"24000 m",ru:"24000 м",en:"24000 m"},{az:"10000 m",ru:"10000 м",en:"10000 m"},{az:"30000 m",ru:"30000 м",en:"30000 m"}],explanation:{az:"Həlli: 1) Sürət: $1200:2=600$ m/dəq. 2) $600\\cdot40=24000$ m.",ru:"Решение: 1) Скорость: $1200:2=600$ м/мин. 2) $600\\cdot40=24000$ м.",en:"Solution: 1) Speed: $1200:2=600$ m/min. 2) $600\\cdot40=24000$ m."}},
{id:52,type:'mcq',correct:0,question:{az:"$25\\%$-i 20 olan ədədi tapın.",ru:"Найдите число, $25\\%$ которого равны 20.",en:"Find the number whose $25\\%$ is 20."},options:[{az:"80",ru:"80",en:"80"},{az:"75",ru:"75",en:"75"},{az:"60",ru:"60",en:"60"},{az:"50",ru:"50",en:"50"},{az:"40",ru:"40",en:"40"}],explanation:{az:"Həlli: $20:0{,}25=80$.",ru:"Решение: $20:0{,}25=80$.",en:"Solution: $20:0{,}25=80$."}},
{id:53,type:'mcq',correct:4,question:{az:"$40\\%$-i 30 olan ədədi tapın.",ru:"Найдите число, $40\\%$ которого равны 30.",en:"Find the number whose $40\\%$ is 30."},options:[{az:"60",ru:"60",en:"60"},{az:"50",ru:"50",en:"50"},{az:"45",ru:"45",en:"45"},{az:"80",ru:"80",en:"80"},{az:"75",ru:"75",en:"75"}],explanation:{az:"Həlli: $30:0{,}4=75$.",ru:"Решение: $30:0{,}4=75$.",en:"Solution: $30:0{,}4=75$."}},
{id:54,type:'mcq',correct:4,question:{az:"$\\frac{m}{p\\cdot k}$ kəsrində ($m,p,k\\in\\mathbb{N}$) $m$-i 3 dəfə artırıb, $p$-ni 3 dəfə azaldıb, $k$-nı isə dəyişmədikdə kəsrin qiyməti necə dəyişər?",ru:"В дроби $\\frac{m}{p\\cdot k}$ ($m,p,k\\in\\mathbb{N}$) $m$ увеличили в 3 раза, $p$ уменьшили в 3 раза, $k$ не изменили. Как изменится значение дроби?",en:"In $\\frac{m}{p\\cdot k}$ ($m,p,k\\in\\mathbb{N}$), $m$ is multiplied by 3, $p$ divided by 3, $k$ unchanged. How does the fraction change?"},options:[{az:"3 dəfə azalar",ru:"Уменьшится в 3 раза",en:"Decreases 3 times"},{az:"Dəyişməz",ru:"Не изменится",en:"Unchanged"},{az:"9 dəfə azalar",ru:"Уменьшится в 9 раз",en:"Decreases 9 times"},{az:"3 dəfə artar",ru:"Увеличится в 3 раза",en:"Increases 3 times"},{az:"9 dəfə artar",ru:"Увеличится в 9 раз",en:"Increases 9 times"}],explanation:{az:"Həlli: 1) Yeni kəsr: $\\frac{3m}{\\frac{p}{3}\\cdot k}=\\frac{9m}{pk}$. 2) Kəsr 9 dəfə artar.",ru:"Решение: 1) Новая дробь: $\\frac{3m}{\\frac{p}{3}\\cdot k}=\\frac{9m}{pk}$. 2) Дробь увеличится в 9 раз.",en:"Solution: 1) New fraction: $\\frac{3m}{\\frac{p}{3}\\cdot k}=\\frac{9m}{pk}$. 2) It increases 9 times."}},
{id:55,type:'mcq',correct:0,question:{az:"Yolun $\\frac{2}{5}$ hissəsi gedildikdən sonra bütün yolun neçə faizi gedilməmiş qaldı?",ru:"После того как прошли $\\frac{2}{5}$ пути, сколько процентов всего пути осталось непройденным?",en:"After $\\frac{2}{5}$ of the road is covered, what percent of the road remains?"},options:[{az:"60%",ru:"60%",en:"60%"},{az:"80%",ru:"80%",en:"80%"},{az:"30%",ru:"30%",en:"30%"},{az:"40%",ru:"40%",en:"40%"},{az:"98%",ru:"98%",en:"98%"}],explanation:{az:"Həlli: 1) Qalan hissə: $1-\\frac{2}{5}=\\frac{3}{5}$. 2) $\\frac{3}{5}\\cdot100\\%=60\\%$.",ru:"Решение: 1) Осталось: $1-\\frac{2}{5}=\\frac{3}{5}$. 2) $\\frac{3}{5}\\cdot100\\%=60\\%$.",en:"Solution: 1) Remaining: $1-\\frac{2}{5}=\\frac{3}{5}$. 2) $\\frac{3}{5}\\cdot100\\%=60\\%$."}},
{id:56,type:'mcq',correct:1,question:{az:"Yolun $\\frac{3}{5}$ hissəsi gedildikdən sonra bütün yolun neçə faizi gedilməmiş qaldı?",ru:"После того как прошли $\\frac{3}{5}$ пути, сколько процентов пути осталось непройденным?",en:"After $\\frac{3}{5}$ of the road is covered, what percent remains uncovered?"},options:[{az:"30%",ru:"30%",en:"30%"},{az:"40%",ru:"40%",en:"40%"},{az:"60%",ru:"60%",en:"60%"},{az:"70%",ru:"70%",en:"70%"},{az:"97%",ru:"97%",en:"97%"}],explanation:{az:"Həlli: 1) Qalan hissə: $1-\\frac{3}{5}=\\frac{2}{5}$. 2) $\\frac{2}{5}\\cdot100\\%=40\\%$.",ru:"Решение: 1) Осталось: $1-\\frac{3}{5}=\\frac{2}{5}$. 2) $\\frac{2}{5}\\cdot100\\%=40\\%$.",en:"Solution: 1) Remaining: $1-\\frac{3}{5}=\\frac{2}{5}$. 2) $\\frac{2}{5}\\cdot100\\%=40\\%$."}},
{id:57,type:'mcq',correct:1,question:{az:"Yolun $80\\%$-ni getdikdən sonra hansı hissəsi gedilməmiş qaldı?",ru:"Какая часть пути осталась непройденной после того, как прошли $80\\%$?",en:"After covering $80\\%$ of the road, what fraction remains?"},options:[{az:"$\\frac{1}{10}$",ru:"$\\frac{1}{10}$",en:"$\\frac{1}{10}$"},{az:"$\\frac{1}{5}$",ru:"$\\frac{1}{5}$",en:"$\\frac{1}{5}$"},{az:"$\\frac{2}{5}$",ru:"$\\frac{2}{5}$",en:"$\\frac{2}{5}$"},{az:"$\\frac{3}{10}$",ru:"$\\frac{3}{10}$",en:"$\\frac{3}{10}$"},{az:"$\\frac{1}{4}$",ru:"$\\frac{1}{4}$",en:"$\\frac{1}{4}$"}],explanation:{az:"Həlli: 1) Qalan: $100\\%-80\\%=20\\%$. 2) $20\\%=\\frac{20}{100}=\\frac{1}{5}$.",ru:"Решение: 1) Осталось: $100\\%-80\\%=20\\%$. 2) $20\\%=\\frac{20}{100}=\\frac{1}{5}$.",en:"Solution: 1) Remaining: $100\\%-80\\%=20\\%$. 2) $20\\%=\\frac{1}{5}$."}},
{id:58,type:'mcq',correct:2,question:{az:"Yolun $10\\%$-i gedildikdən sonra hansı hissəsi gedilməmiş qaldı?",ru:"Какая часть пути осталась непройденной после того, как прошли $10\\%$?",en:"After covering $10\\%$ of the road, what fraction remains?"},options:[{az:"$\\frac{1}{10}$",ru:"$\\frac{1}{10}$",en:"$\\frac{1}{10}$"},{az:"$\\frac{3}{5}$",ru:"$\\frac{3}{5}$",en:"$\\frac{3}{5}$"},{az:"$\\frac{9}{10}$",ru:"$\\frac{9}{10}$",en:"$\\frac{9}{10}$"},{az:"$\\frac{3}{10}$",ru:"$\\frac{3}{10}$",en:"$\\frac{3}{10}$"},{az:"$\\frac{1}{2}$",ru:"$\\frac{1}{2}$",en:"$\\frac{1}{2}$"}],explanation:{az:"Həlli: 1) Qalan: $100\\%-10\\%=90\\%$. 2) $90\\%=\\frac{90}{100}=\\frac{9}{10}$.",ru:"Решение: 1) Осталось: $100\\%-10\\%=90\\%$. 2) $90\\%=\\frac{9}{10}$.",en:"Solution: 1) Remaining: $100\\%-10\\%=90\\%$. 2) $90\\%=\\frac{9}{10}$."}},
{id:59,type:'mcq',correct:4,question:{az:"Şagirdin həll etdiyi 15 tapşırıq onun bütün tapşırığının $20\\%$-ni təşkil edir. Şagird ümumilikdə neçə tapşırıq həll etməli idi?",ru:"15 решённых заданий учеником составляют $20\\%$ всех заданий. Сколько всего заданий он должен был решить?",en:"A student's 15 solved tasks make $20\\%$ of all tasks. How many tasks in total should be solved?"},options:[{az:"50",ru:"50",en:"50"},{az:"80",ru:"80",en:"80"},{az:"65",ru:"65",en:"65"},{az:"90",ru:"90",en:"90"},{az:"75",ru:"75",en:"75"}],explanation:{az:"Həlli: $15:0{,}2=75$ tapşırıq.",ru:"Решение: $15:0{,}2=75$ заданий.",en:"Solution: $15:0{,}2=75$ tasks."}},
{id:60,type:'mcq',correct:2,question:{az:"Şagird kitabın 130 səhifəsini oxudu. Bu, kitabın bütün səhifələrinin $25\\%$-ni təşkil edərsə, kitabda neçə səhifə var?",ru:"Ученик прочитал 130 страниц, что составляет $25\\%$ всей книги. Сколько страниц в книге?",en:"A student read 130 pages, which is $25\\%$ of the book. How many pages are in the book?"},options:[{az:"500",ru:"500",en:"500"},{az:"420",ru:"420",en:"420"},{az:"520",ru:"520",en:"520"},{az:"560",ru:"560",en:"560"},{az:"540",ru:"540",en:"540"}],explanation:{az:"Həlli: $130:0{,}25=520$ səhifə.",ru:"Решение: $130:0{,}25=520$ страниц.",en:"Solution: $130:0{,}25=520$ pages."}},
{id:61,type:'mcq',correct:0,question:{az:"Şagirdin həll etdiyi 50 tapşırıq onun bütün tapşırığının $10\\%$-ni təşkil edir. Şagird ümumilikdə neçə tapşırıq həll etməli idi?",ru:"50 решённых заданий составляют $10\\%$ всех заданий. Сколько всего заданий должен был решить ученик?",en:"A student's 50 solved tasks are $10\\%$ of all tasks. How many tasks total?"},options:[{az:"500",ru:"500",en:"500"},{az:"650",ru:"650",en:"650"},{az:"600",ru:"600",en:"600"},{az:"550",ru:"550",en:"550"},{az:"750",ru:"750",en:"750"}],explanation:{az:"Həlli: $50:0{,}1=500$ tapşırıq.",ru:"Решение: $50:0{,}1=500$ заданий.",en:"Solution: $50:0{,}1=500$ tasks."}},
{id:62,type:'mcq',correct:2,question:{az:"Usta və şagirdi birlikdə 2200 detal hazırladı. Usta bütün detalların $75\\%$-ni hazırladı. Usta neçə detal hazırladı?",ru:"Мастер и ученик вместе сделали 2200 деталей. Мастер сделал $75\\%$ всех деталей. Сколько деталей сделал мастер?",en:"A master and apprentice made 2200 parts together. The master made $75\\%$ of all parts. How many did the master make?"},options:[{az:"1700",ru:"1700",en:"1700"},{az:"1850",ru:"1850",en:"1850"},{az:"1650",ru:"1650",en:"1650"},{az:"1600",ru:"1600",en:"1600"},{az:"1550",ru:"1550",en:"1550"}],explanation:{az:"Həlli: $2200\\cdot0{,}75=1650$ detal.",ru:"Решение: $2200\\cdot0{,}75=1650$ деталей.",en:"Solution: $2200\\cdot0{,}75=1650$ parts."}},
{id:63,type:'mcq',correct:2,question:{az:"Məktəbə gətirilən 800 kitabın $65\\%$-i ədəbiyyat, qalanları riyaziyyat kitabıdır. Məktəbə neçə riyaziyyat kitabı gətirilmişdir?",ru:"Из 800 книг $65\\%$ — литература, остальные — математика. Сколько книг по математике привезено?",en:"Of 800 books, $65\\%$ are literature, the rest mathematics. How many math books were brought?"},options:[{az:"1400",ru:"1400",en:"1400"},{az:"560",ru:"560",en:"560"},{az:"280",ru:"280",en:"280"},{az:"650",ru:"650",en:"650"},{az:"320",ru:"320",en:"320"}],explanation:{az:"Həlli: 1) Riyaziyyat: $100\\%-65\\%=35\\%$. 2) $800\\cdot0{,}35=280$ kitab.",ru:"Решение: 1) Математика: $100\\%-65\\%=35\\%$. 2) $800\\cdot0{,}35=280$ книг.",en:"Solution: 1) Math: $100\\%-65\\%=35\\%$. 2) $800\\cdot0{,}35=280$ books."}},
{id:64,type:'mcq',correct:0,question:{az:"Məktəbə gətirilən 450 kitabın $24\\%$-i fizika, qalanları riyaziyyat kitabıdır. Məktəbə neçə riyaziyyat kitabı gətirilmişdir?",ru:"Из 450 книг $24\\%$ — физика, остальные — математика. Сколько книг по математике привезено?",en:"Of 450 books, $24\\%$ are physics, the rest mathematics. How many math books were brought?"},options:[{az:"342",ru:"342",en:"342"},{az:"148",ru:"148",en:"148"},{az:"302",ru:"302",en:"302"},{az:"108",ru:"108",en:"108"},{az:"216",ru:"216",en:"216"}],explanation:{az:"Həlli: 1) Riyaziyyat: $100\\%-24\\%=76\\%$. 2) $450\\cdot0{,}76=342$ kitab.",ru:"Решение: 1) Математика: $100\\%-24\\%=76\\%$. 2) $450\\cdot0{,}76=342$ книги.",en:"Solution: 1) Math: $100\\%-24\\%=76\\%$. 2) $450\\cdot0{,}76=342$ books."}},
{id:65,type:'mcq',correct:2,question:{az:"$\\frac{17}{20}$ adi kəsrini faizlə ifadə edin.",ru:"Выразите обыкновенную дробь $\\frac{17}{20}$ в процентах.",en:"Express the fraction $\\frac{17}{20}$ as a percent."},options:[{az:"17%",ru:"17%",en:"17%"},{az:"0,85%",ru:"0,85%",en:"0,85%"},{az:"85%",ru:"85%",en:"85%"},{az:"8,5%",ru:"8,5%",en:"8,5%"},{az:"850%",ru:"850%",en:"850%"}],explanation:{az:"Həlli: $\\frac{17}{20}\\cdot100\\%=17\\cdot5\\%=85\\%$.",ru:"Решение: $\\frac{17}{20}\\cdot100\\%=17\\cdot5\\%=85\\%$.",en:"Solution: $\\frac{17}{20}\\cdot100\\%=85\\%$."}},
{id:66,type:'mcq',correct:3,question:{az:"24 saat işlədiyinə görə fəhlə 80 manat aldı. O, eyni məhsuldarlıqla 6 saat işləyərsə, nə qədər pul qazanar?",ru:"За 24 часа работы рабочий получил 80 манатов. Сколько он заработает за 6 часов при той же производительности?",en:"A worker earned 80 manats for 24 hours. How much will he earn for 6 hours at the same rate?"},options:[{az:"10 manat",ru:"10 манатов",en:"10 manats"},{az:"40 manat",ru:"40 манатов",en:"40 manats"},{az:"60 manat",ru:"60 манатов",en:"60 manats"},{az:"20 manat",ru:"20 манатов",en:"20 manats"},{az:"5 manat",ru:"5 манатов",en:"5 manats"}],explanation:{az:"Həlli: 1) Saatlıq: $80:24=\\frac{10}{3}$ manat. 2) 6 saat: $\\frac{10}{3}\\cdot6=20$ manat.",ru:"Решение: 1) В час: $80:24=\\frac{10}{3}$ маната. 2) За 6 часов: $\\frac{10}{3}\\cdot6=20$ манатов.",en:"Solution: 1) Per hour: $80:24=\\frac{10}{3}$. 2) In 6 hours: $\\frac{10}{3}\\cdot6=20$ manats."}},
{id:67,type:'mcq',correct:0,question:{az:"$40\\text{ m}^2$ döşəməni rəngləmək üçün 6 kq boya işlənilirsə, $20\\text{ m}^2$ döşəməni rəngləmək üçün nə qədər boya işlənilər?",ru:"Если на покраску $40\\text{ м}^2$ пола расходуется 6 кг краски, сколько краски понадобится для $20\\text{ м}^2$?",en:"If 6 kg of paint covers $40\\text{ m}^2$ of floor, how much paint is needed for $20\\text{ m}^2$?"},options:[{az:"3 kq",ru:"3 кг",en:"3 kg"},{az:"12 kq",ru:"12 кг",en:"12 kg"},{az:"8 kq",ru:"8 кг",en:"8 kg"},{az:"2 kq",ru:"2 кг",en:"2 kg"},{az:"4 kq",ru:"4 кг",en:"4 kg"}],explanation:{az:"Həlli: 1) Sahə 2 dəfə azdır ($20=40:2$). 2) Boya da 2 dəfə az: $6:2=3$ kq.",ru:"Решение: 1) Площадь в 2 раза меньше ($20=40:2$). 2) Краски тоже в 2 раза меньше: $6:2=3$ кг.",en:"Solution: 1) Area is halved ($20=40:2$). 2) Paint is halved too: $6:2=3$ kg."}},
{id:68,type:'mcq',correct:0,question:{az:"$16:x=8:32$ tənasübündən $x$-i tapın.",ru:"Найдите $x$ из пропорции $16:x=8:32$.",en:"Find $x$ from the proportion $16:x=8:32$."},options:[{az:"64",ru:"64",en:"64"},{az:"36",ru:"36",en:"36"},{az:"16",ru:"16",en:"16"},{az:"18",ru:"18",en:"18"},{az:"72",ru:"72",en:"72"}],explanation:{az:"Həlli: 1) $8x=16\\cdot32=512$. 2) $x=512:8=64$.",ru:"Решение: 1) $8x=16\\cdot32=512$. 2) $x=512:8=64$.",en:"Solution: 1) $8x=16\\cdot32=512$. 2) $x=512:8=64$."}},
{id:69,type:'mcq',correct:3,question:{az:"$175\\%$-i onluq kəsr şəklində göstərin.",ru:"Запишите $175\\%$ в виде десятичной дроби.",en:"Write $175\\%$ as a decimal."},options:[{az:"0,075",ru:"0,075",en:"0,075"},{az:"17,5",ru:"17,5",en:"17,5"},{az:"0,175",ru:"0,175",en:"0,175"},{az:"1,75",ru:"1,75",en:"1,75"},{az:"0,75",ru:"0,75",en:"0,75"}],explanation:{az:"Həlli: $175:100=1{,}75$.",ru:"Решение: $175:100=1{,}75$.",en:"Solution: $175:100=1{,}75$."}},
{id:70,type:'mcq',correct:3,question:{az:"$0{,}275$ onluq kəsrini faizlə göstərin.",ru:"Выразите десятичную дробь $0{,}275$ в процентах.",en:"Express the decimal $0{,}275$ as a percent."},options:[{az:"0,0275%",ru:"0,0275%",en:"0,0275%"},{az:"2,75%",ru:"2,75%",en:"2,75%"},{az:"275%",ru:"275%",en:"275%"},{az:"27,5%",ru:"27,5%",en:"27,5%"},{az:"0,275%",ru:"0,275%",en:"0,275%"}],explanation:{az:"Həlli: $0{,}275\\cdot100\\%=27{,}5\\%$.",ru:"Решение: $0{,}275\\cdot100\\%=27{,}5\\%$.",en:"Solution: $0{,}275\\cdot100\\%=27{,}5\\%$."}},
{id:71,type:'mcq',correct:2,question:{az:"Piyada yolun $25\\%$-ni getdikdən sonra yolun hansı hissəsi gedilməmiş qaldı?",ru:"Какая часть пути осталась непройденной после того, как пешеход прошёл $25\\%$?",en:"After a pedestrian covers $25\\%$ of the road, what fraction remains?"},options:[{az:"$\\frac{7}{8}$",ru:"$\\frac{7}{8}$",en:"$\\frac{7}{8}$"},{az:"$\\frac{3}{8}$",ru:"$\\frac{3}{8}$",en:"$\\frac{3}{8}$"},{az:"$\\frac{3}{4}$",ru:"$\\frac{3}{4}$",en:"$\\frac{3}{4}$"},{az:"$\\frac{1}{4}$",ru:"$\\frac{1}{4}$",en:"$\\frac{1}{4}$"},{az:"$\\frac{5}{8}$",ru:"$\\frac{5}{8}$",en:"$\\frac{5}{8}$"}],explanation:{az:"Həlli: 1) Qalan: $100\\%-25\\%=75\\%$. 2) $75\\%=\\frac{75}{100}=\\frac{3}{4}$.",ru:"Решение: 1) Осталось: $100\\%-25\\%=75\\%$. 2) $75\\%=\\frac{3}{4}$.",en:"Solution: 1) Remaining: $100\\%-25\\%=75\\%$. 2) $75\\%=\\frac{3}{4}$."}},
{id:72,type:'mcq',correct:3,question:{az:"2,8 kq konfet üçün 19 manat 60 qəpik pul verilmişdirsə, həmin növ 3 kq konfetə nə qədər pul verilər?",ru:"За 2,8 кг конфет заплатили 19 манатов 60 гяпиков. Сколько будут стоить 3 кг таких конфет?",en:"2,8 kg of candy costs 19 manats 60 qepiks. How much do 3 kg cost?"},options:[{az:"22 manat 60 qəpik",ru:"22 маната 60 гяпиков",en:"22 manats 60 qepiks"},{az:"25 manat 30 qəpik",ru:"25 манатов 30 гяпиков",en:"25 manats 30 qepiks"},{az:"24 manat",ru:"24 маната",en:"24 manats"},{az:"21 manat",ru:"21 манат",en:"21 manats"},{az:"19 manat 90 qəpik",ru:"19 манатов 90 гяпиков",en:"19 manats 90 qepiks"}],explanation:{az:"Həlli: 1) 1 kq qiyməti: $19{,}60:2{,}8=7$ manat. 2) 3 kq: $7\\cdot3=21$ manat.",ru:"Решение: 1) Цена за 1 кг: $19{,}60:2{,}8=7$ манатов. 2) 3 кг: $7\\cdot3=21$ манат.",en:"Solution: 1) Price per kg: $19{,}60:2{,}8=7$ manats. 2) 3 kg: $7\\cdot3=21$ manats."}},
{id:73,type:'mcq',correct:0,question:{az:"Velosipedçi uzunluğu 25 km olan yolun $40\\%$-ni getdi. O, bu yolun sonuna çatmaq üçün daha neçə kilometr getməlidir?",ru:"Велосипедист проехал $40\\%$ дороги длиной 25 км. Сколько км ему осталось проехать до конца?",en:"A cyclist covered $40\\%$ of a 25 km road. How many km remain?"},options:[{az:"15 km",ru:"15 км",en:"15 km"},{az:"12 km",ru:"12 км",en:"12 km"},{az:"21 km",ru:"21 км",en:"21 km"},{az:"20 km",ru:"20 км",en:"20 km"},{az:"10 km",ru:"10 км",en:"10 km"}],explanation:{az:"Həlli: 1) Gedilmiş: $25\\cdot0{,}4=10$ km. 2) Qalan: $25-10=15$ km.",ru:"Решение: 1) Проехал: $25\\cdot0{,}4=10$ км. 2) Осталось: $25-10=15$ км.",en:"Solution: 1) Covered: $25\\cdot0{,}4=10$ km. 2) Remaining: $25-10=15$ km."}},
{id:74,type:'mcq',correct:2,question:{az:"Göbələk qurudulduqda kütləsinin $85\\%$-ni itirir. 24 kq qurudulmuş göbələk almaq üçün nə qədər təzə göbələk gətirmək lazımdır?",ru:"Гриб при сушке теряет $85\\%$ массы. Сколько сырых грибов нужно, чтобы получить 24 кг сушёных?",en:"A mushroom loses $85\\%$ of its mass when dried. How much fresh mushroom is needed for 24 kg dried?"},options:[{az:"96 kq",ru:"96 кг",en:"96 kg"},{az:"120 kq",ru:"120 кг",en:"120 kg"},{az:"160 kq",ru:"160 кг",en:"160 kg"},{az:"240 kq",ru:"240 кг",en:"240 kg"},{az:"204 kq",ru:"204 кг",en:"204 kg"}],explanation:{az:"Həlli: 1) Qurudulmuş göbələk təzənin $100\\%-85\\%=15\\%$-dir. 2) $24:0{,}15=160$ kq.",ru:"Решение: 1) Сушёный гриб — это $100\\%-85\\%=15\\%$ сырого. 2) $24:0{,}15=160$ кг.",en:"Solution: 1) Dried mushroom is $100\\%-85\\%=15\\%$ of fresh. 2) $24:0{,}15=160$ kg."}},
{id:75,type:'mcq',correct:0,question:{az:"İclasda 300 nəfər iştirak edir. Qərarın qəbul edilməsinə 225 nəfər razılıq verdi. Qərarın qəbul edilməsinə bütün iştirakçıların neçə faizi razılıq verdi?",ru:"На собрании 300 участников. За решение проголосовали 225. Сколько процентов участников дали согласие?",en:"300 people attend a meeting; 225 approved the decision. What percent approved?"},options:[{az:"75%",ru:"75%",en:"75%"},{az:"65%",ru:"65%",en:"65%"},{az:"70%",ru:"70%",en:"70%"},{az:"80%",ru:"80%",en:"80%"},{az:"25%",ru:"25%",en:"25%"}],explanation:{az:"Həlli: $\\frac{225}{300}\\cdot100\\%=75\\%$.",ru:"Решение: $\\frac{225}{300}\\cdot100\\%=75\\%$.",en:"Solution: $\\frac{225}{300}\\cdot100\\%=75\\%$."}},
{id:76,type:'mcq',correct:2,question:{az:"Balın tərkibində $12\\%$ su var. 5 kq balın tərkibində nə qədər su var?",ru:"В мёде $12\\%$ воды. Сколько воды в 5 кг мёда?",en:"Honey contains $12\\%$ water. How much water is in 5 kg of honey?"},options:[{az:"0,8 kq",ru:"0,8 кг",en:"0,8 kg"},{az:"1,4 kq",ru:"1,4 кг",en:"1,4 kg"},{az:"0,6 kq",ru:"0,6 кг",en:"0,6 kg"},{az:"1,2 kq",ru:"1,2 кг",en:"1,2 kg"},{az:"1,5 kq",ru:"1,5 кг",en:"1,5 kg"}],explanation:{az:"Həlli: $5\\cdot0{,}12=0{,}6$ kq.",ru:"Решение: $5\\cdot0{,}12=0{,}6$ кг.",en:"Solution: $5\\cdot0{,}12=0{,}6$ kg."}},
{id:77,type:'mcq',correct:3,image:'Faiz_nisbet_tenasub_Image0077.png',question:{az:"Diaqramda okeanların tutduğu sahələr göstərilmişdir (mln km²): Sakit — 180, Atlantik — 90, Hind — 75, Şimal Buzlu — 15. Atlantik okeanın sahəsi Sakit okeanın sahəsinin neçə faizidir?",ru:"На диаграмме показаны площади океанов (млн км²): Тихий — 180, Атлантический — 90, Индийский — 75, Северный Ледовитый — 15. Сколько процентов от площади Тихого океана составляет площадь Атлантического?",en:"The diagram shows ocean areas (mln km²): Pacific 180, Atlantic 90, Indian 75, Arctic 15. What percent of the Pacific's area is the Atlantic's?"},options:[{az:"55%",ru:"55%",en:"55%"},{az:"40%",ru:"40%",en:"40%"},{az:"60%",ru:"60%",en:"60%"},{az:"50%",ru:"50%",en:"50%"},{az:"45%",ru:"45%",en:"45%"}],explanation:{az:"Həlli: $\\frac{90}{180}\\cdot100\\%=50\\%$.",ru:"Решение: $\\frac{90}{180}\\cdot100\\%=50\\%$.",en:"Solution: $\\frac{90}{180}\\cdot100\\%=50\\%$."}},
{id:78,type:'mcq',correct:2,image:'Faiz_nisbet_tenasub_Image0078.png',question:{az:"Diaqramda okeanların tutduğu sahələr göstərilmişdir (mln km²): Sakit — 180, Atlantik — 90, Hind — 75, Şimal Buzlu — 15. Şimal Buzlu okeanın sahəsi Hind okeanının sahəsinin neçə faizidir?",ru:"Площади океанов (млн км²): Тихий — 180, Атлантический — 90, Индийский — 75, Северный Ледовитый — 15. Сколько процентов от площади Индийского океана составляет площадь Северного Ледовитого?",en:"Ocean areas (mln km²): Pacific 180, Atlantic 90, Indian 75, Arctic 15. What percent of the Indian Ocean's area is the Arctic's?"},options:[{az:"25%",ru:"25%",en:"25%"},{az:"30%",ru:"30%",en:"30%"},{az:"20%",ru:"20%",en:"20%"},{az:"45%",ru:"45%",en:"45%"},{az:"50%",ru:"50%",en:"50%"}],explanation:{az:"Həlli: $\\frac{15}{75}\\cdot100\\%=20\\%$.",ru:"Решение: $\\frac{15}{75}\\cdot100\\%=20\\%$.",en:"Solution: $\\frac{15}{75}\\cdot100\\%=20\\%$."}},
{id:79,type:'mcq',correct:4,question:{az:"$0,(4):x=5:0{,}9$ tənasübündən $x$-i tapın.",ru:"Найдите $x$ из пропорции $0,(4):x=5:0{,}9$.",en:"Find $x$ from the proportion $0,(4):x=5:0{,}9$."},options:[{az:"6",ru:"6",en:"6"},{az:"0,4",ru:"0,4",en:"0,4"},{az:"0,06",ru:"0,06",en:"0,06"},{az:"0,8",ru:"0,8",en:"0,8"},{az:"0,08",ru:"0,08",en:"0,08"}],explanation:{az:"Həlli: 1) $0,(4)=\\frac{4}{9}$. 2) $5x=\\frac{4}{9}\\cdot0{,}9=0{,}4$. 3) $x=0{,}4:5=0{,}08$.",ru:"Решение: 1) $0,(4)=\\frac{4}{9}$. 2) $5x=\\frac{4}{9}\\cdot0{,}9=0{,}4$. 3) $x=0{,}4:5=0{,}08$.",en:"Solution: 1) $0,(4)=\\frac{4}{9}$. 2) $5x=\\frac{4}{9}\\cdot0{,}9=0{,}4$. 3) $x=0{,}4:5=0{,}08$."}},
{id:80,type:'mcq',correct:0,question:{az:"$x:0,(3)=0{,}63:0{,}7$ tənasübündən $x$-i tapın.",ru:"Найдите $x$ из пропорции $x:0,(3)=0{,}63:0{,}7$.",en:"Find $x$ from the proportion $x:0,(3)=0{,}63:0{,}7$."},options:[{az:"0,3",ru:"0,3",en:"0,3"},{az:"0,5",ru:"0,5",en:"0,5"},{az:"0,05",ru:"0,05",en:"0,05"},{az:"0,03",ru:"0,03",en:"0,03"},{az:"5",ru:"5",en:"5"}],explanation:{az:"Həlli: 1) $0,(3)=\\frac{1}{3}$; $\\frac{0{,}63}{0{,}7}=0{,}9$. 2) $x=\\frac{1}{3}\\cdot0{,}9=0{,}3$.",ru:"Решение: 1) $0,(3)=\\frac{1}{3}$; $\\frac{0{,}63}{0{,}7}=0{,}9$. 2) $x=\\frac{1}{3}\\cdot0{,}9=0{,}3$.",en:"Solution: 1) $0,(3)=\\frac{1}{3}$; $\\frac{0{,}63}{0{,}7}=0{,}9$. 2) $x=\\frac{1}{3}\\cdot0{,}9=0{,}3$."}},
{id:81,type:'mcq',correct:0,question:{az:"$(3x):(5y)=9:10$ olarsa, $x:y$ nisbətini hesablayın.",ru:"Если $(3x):(5y)=9:10$, найдите отношение $x:y$.",en:"If $(3x):(5y)=9:10$, find the ratio $x:y$."},options:[{az:"$\\frac{3}{2}$",ru:"$\\frac{3}{2}$",en:"$\\frac{3}{2}$"},{az:"2",ru:"2",en:"2"},{az:"0,5",ru:"0,5",en:"0,5"},{az:"1,2",ru:"1,2",en:"1,2"},{az:"$\\frac{2}{3}$",ru:"$\\frac{2}{3}$",en:"$\\frac{2}{3}$"}],explanation:{az:"Həlli: 1) $\\frac{3x}{5y}=\\frac{9}{10}\\Rightarrow 30x=45y$. 2) $\\frac{x}{y}=\\frac{45}{30}=\\frac{3}{2}$.",ru:"Решение: 1) $\\frac{3x}{5y}=\\frac{9}{10}\\Rightarrow 30x=45y$. 2) $\\frac{x}{y}=\\frac{45}{30}=\\frac{3}{2}$.",en:"Solution: 1) $\\frac{3x}{5y}=\\frac{9}{10}\\Rightarrow 30x=45y$. 2) $\\frac{x}{y}=\\frac{3}{2}$."}},
{id:82,type:'mcq',correct:0,question:{az:"$(4x):(3y)=16:3$ olarsa, $x:y$ nisbətini hesablayın.",ru:"Если $(4x):(3y)=16:3$, найдите отношение $x:y$.",en:"If $(4x):(3y)=16:3$, find the ratio $x:y$."},options:[{az:"4",ru:"4",en:"4"},{az:"3",ru:"3",en:"3"},{az:"2",ru:"2",en:"2"},{az:"1,5",ru:"1,5",en:"1,5"},{az:"2,5",ru:"2,5",en:"2,5"}],explanation:{az:"Həlli: 1) $\\frac{4x}{3y}=\\frac{16}{3}\\Rightarrow 12x=48y$. 2) $\\frac{x}{y}=4$.",ru:"Решение: 1) $\\frac{4x}{3y}=\\frac{16}{3}\\Rightarrow 12x=48y$. 2) $\\frac{x}{y}=4$.",en:"Solution: 1) $\\frac{4x}{3y}=\\frac{16}{3}\\Rightarrow 12x=48y$. 2) $\\frac{x}{y}=4$."}},
{id:83,type:'mcq',correct:1,question:{az:"Kitabın qiyməti $20\\%$ ucuzlaşdıqdan sonra 16 manat olubsa, kitab əvvəlcə neçəyə idi?",ru:"Если после удешевления на $20\\%$ книга стоит 16 манатов, какова была первоначальная цена?",en:"After a $20\\%$ discount a book costs 16 manats. What was the original price?"},options:[{az:"24 manat",ru:"24 маната",en:"24 manats"},{az:"20 manat",ru:"20 манатов",en:"20 manats"},{az:"18 manat",ru:"18 манатов",en:"18 manats"},{az:"30 manat",ru:"30 манатов",en:"30 manats"},{az:"26 manat",ru:"26 манатов",en:"26 manats"}],explanation:{az:"Həlli: 1) Yeni qiymət əvvəlkinin $80\\%$-dir. 2) $16:0{,}8=20$ manat.",ru:"Решение: 1) Новая цена — $80\\%$ прежней. 2) $16:0{,}8=20$ манатов.",en:"Solution: 1) New price is $80\\%$ of the original. 2) $16:0{,}8=20$ manats."}},
{id:84,type:'mcq',correct:1,question:{az:"Çantanın qiyməti $25\\%$ bahalaşdıqdan sonra 40 manat olubsa, çanta əvvəlcə neçəyə idi?",ru:"Если после подорожания на $25\\%$ сумка стоит 40 манатов, какова была первоначальная цена?",en:"After a $25\\%$ price increase a bag costs 40 manats. What was the original price?"},options:[{az:"36 manat",ru:"36 манатов",en:"36 manats"},{az:"32 manat",ru:"32 маната",en:"32 manats"},{az:"24 manat",ru:"24 маната",en:"24 manats"},{az:"30 manat",ru:"30 манатов",en:"30 manats"},{az:"18 manat",ru:"18 манатов",en:"18 manats"}],explanation:{az:"Həlli: 1) Yeni qiymət əvvəlkinin $125\\%$-dir. 2) $40:1{,}25=32$ manat.",ru:"Решение: 1) Новая цена — $125\\%$ прежней. 2) $40:1{,}25=32$ маната.",en:"Solution: 1) New price is $125\\%$ of the original. 2) $40:1{,}25=32$ manats."}},
{id:85,type:'mcq',correct:3,question:{az:"Malın qiymətini $50\\%$ artırdılar, sonra yeni qiyməti $50\\%$ artırdılar. Malın ilkin qiyməti neçə dəyişdi?",ru:"Цену товара повысили на $50\\%$, затем новую цену ещё на $50\\%$. Как изменилась первоначальная цена?",en:"A price was raised by $50\\%$, then the new price raised by $50\\%$ again. How did the original price change?"},options:[{az:"75% artdı",ru:"Увеличилась на 75%",en:"Increased by 75%"},{az:"150% artdı",ru:"Увеличилась на 150%",en:"Increased by 150%"},{az:"100% artdı",ru:"Увеличилась на 100%",en:"Increased by 100%"},{az:"125% artdı",ru:"Увеличилась на 125%",en:"Increased by 125%"},{az:"175% artdı",ru:"Увеличилась на 175%",en:"Increased by 175%"}],explanation:{az:"Həlli: 1) $1{,}5\\cdot1{,}5=2{,}25$ dəfə. 2) Artım: $2{,}25-1=1{,}25$, yəni $125\\%$.",ru:"Решение: 1) $1{,}5\\cdot1{,}5=2{,}25$ раза. 2) Рост: $2{,}25-1=1{,}25$, т.е. $125\\%$.",en:"Solution: 1) $1{,}5\\cdot1{,}5=2{,}25$ times. 2) Increase: $1{,}25=125\\%$."}},
{id:86,type:'mcq',correct:0,question:{az:"İki müsbət ədəddən biri $10\\%$, digəri $30\\%$ artırılarsa, onların hasili necə dəyişər?",ru:"Если одно из двух положительных чисел увеличить на $10\\%$, а другое на $30\\%$, как изменится их произведение?",en:"If one of two positive numbers increases by $10\\%$ and the other by $30\\%$, how does their product change?"},options:[{az:"43% artar",ru:"Увеличится на 43%",en:"Increases by 43%"},{az:"45% artar",ru:"Увеличится на 45%",en:"Increases by 45%"},{az:"35% artar",ru:"Увеличится на 35%",en:"Increases by 35%"},{az:"49% artar",ru:"Увеличится на 49%",en:"Increases by 49%"},{az:"37% artar",ru:"Увеличится на 37%",en:"Increases by 37%"}],explanation:{az:"Həlli: 1) $1{,}1\\cdot1{,}3=1{,}43$. 2) Hasil $43\\%$ artar.",ru:"Решение: 1) $1{,}1\\cdot1{,}3=1{,}43$. 2) Произведение увеличится на $43\\%$.",en:"Solution: 1) $1{,}1\\cdot1{,}3=1{,}43$. 2) The product increases by $43\\%$."}},
{id:87,type:'mcq',correct:1,question:{az:"İki müsbət ədəddən biri $10\\%$, digəri $40\\%$ azalarsa, onların hasili necə dəyişər?",ru:"Если одно из двух положительных чисел уменьшить на $10\\%$, а другое на $40\\%$, как изменится их произведение?",en:"If one of two positive numbers decreases by $10\\%$ and the other by $40\\%$, how does their product change?"},options:[{az:"40% azalar",ru:"Уменьшится на 40%",en:"Decreases by 40%"},{az:"46% azalar",ru:"Уменьшится на 46%",en:"Decreases by 46%"},{az:"50% azalar",ru:"Уменьшится на 50%",en:"Decreases by 50%"},{az:"54% azalar",ru:"Уменьшится на 54%",en:"Decreases by 54%"},{az:"60% azalar",ru:"Уменьшится на 60%",en:"Decreases by 60%"}],explanation:{az:"Həlli: 1) $0{,}9\\cdot0{,}6=0{,}54$. 2) Azalma: $1-0{,}54=0{,}46$, yəni $46\\%$.",ru:"Решение: 1) $0{,}9\\cdot0{,}6=0{,}54$. 2) Уменьшение: $1-0{,}54=46\\%$.",en:"Solution: 1) $0{,}9\\cdot0{,}6=0{,}54$. 2) Decrease: $1-0{,}54=46\\%$."}},
{id:88,type:'mcq',correct:2,question:{az:"$\\frac{x}{x+a}=\\frac{b}{c}$ tənasübündən $x$-i tapın ($b\\ne c$, $c\\ne0$).",ru:"Найдите $x$ из пропорции $\\frac{x}{x+a}=\\frac{b}{c}$ ($b\\ne c$, $c\\ne0$).",en:"Find $x$ from $\\frac{x}{x+a}=\\frac{b}{c}$ ($b\\ne c$, $c\\ne0$)."},options:[{az:"$\\frac{ab}{b-c}$",ru:"$\\frac{ab}{b-c}$",en:"$\\frac{ab}{b-c}$"},{az:"$\\frac{a(c-b)}{b}$",ru:"$\\frac{a(c-b)}{b}$",en:"$\\frac{a(c-b)}{b}$"},{az:"$\\frac{ab}{c-b}$",ru:"$\\frac{ab}{c-b}$",en:"$\\frac{ab}{c-b}$"},{az:"$\\frac{bc}{a-b}$",ru:"$\\frac{bc}{a-b}$",en:"$\\frac{bc}{a-b}$"},{az:"$\\frac{a(b-c)}{b}$",ru:"$\\frac{a(b-c)}{b}$",en:"$\\frac{a(b-c)}{b}$"}],explanation:{az:"Həlli: 1) $cx=b(x+a)\\Rightarrow cx=bx+ab$. 2) $x(c-b)=ab\\Rightarrow x=\\frac{ab}{c-b}$.",ru:"Решение: 1) $cx=b(x+a)\\Rightarrow cx=bx+ab$. 2) $x(c-b)=ab\\Rightarrow x=\\frac{ab}{c-b}$.",en:"Solution: 1) $cx=b(x+a)\\Rightarrow cx=bx+ab$. 2) $x(c-b)=ab\\Rightarrow x=\\frac{ab}{c-b}$."}},
{id:89,type:'mcq',correct:1,question:{az:"Məktəb olimpiadasında 200 oğlan və 300 qız iştirak edir. Qızlar bütün iştirakçıların neçə faizini təşkil edir?",ru:"В школьной олимпиаде участвуют 200 мальчиков и 300 девочек. Сколько процентов всех участников составляют девочки?",en:"200 boys and 300 girls take part in a school olympiad. What percent are girls?"},options:[{az:"65%",ru:"65%",en:"65%"},{az:"60%",ru:"60%",en:"60%"},{az:"30%",ru:"30%",en:"30%"},{az:"35%",ru:"35%",en:"35%"},{az:"40%",ru:"40%",en:"40%"}],explanation:{az:"Həlli: 1) Cəmi: $200+300=500$. 2) $\\frac{300}{500}\\cdot100\\%=60\\%$.",ru:"Решение: 1) Всего: $200+300=500$. 2) $\\frac{300}{500}\\cdot100\\%=60\\%$.",en:"Solution: 1) Total: $500$. 2) $\\frac{300}{500}\\cdot100\\%=60\\%$."}},
{id:90,type:'mcq',correct:0,question:{az:"Portağalla dolu səbətin kütləsi 16,8 kq, boş səbətin kütləsi isə 800 q-dır. Boş səbətin kütləsinin portağalın kütləsinə olan faiz nisbətini tapın.",ru:"Масса корзины с апельсинами 16,8 кг, пустой корзины — 800 г. Найдите процентное отношение массы пустой корзины к массе апельсинов.",en:"A basket with oranges weighs 16,8 kg; the empty basket weighs 800 g. Find the percent ratio of the empty basket's mass to the oranges' mass."},options:[{az:"5",ru:"5",en:"5"},{az:"0,05",ru:"0,05",en:"0,05"},{az:"0,5",ru:"0,5",en:"0,5"},{az:"50",ru:"50",en:"50"},{az:"25",ru:"25",en:"25"}],explanation:{az:"Həlli: 1) Portağal: $16{,}8-0{,}8=16$ kq. 2) $\\frac{0{,}8}{16}\\cdot100\\%=5\\%$.",ru:"Решение: 1) Апельсины: $16{,}8-0{,}8=16$ кг. 2) $\\frac{0{,}8}{16}\\cdot100\\%=5\\%$.",en:"Solution: 1) Oranges: $16{,}8-0{,}8=16$ kg. 2) $\\frac{0{,}8}{16}\\cdot100\\%=5\\%$."}},
{id:91,type:'mcq',correct:1,question:{az:"Alma ilə dolu səbətin kütləsi 31,2 kq, boş səbətin kütləsi 1200 q-dır. Boş səbətin kütləsinin almanın kütləsinə olan faiz nisbətini tapın.",ru:"Масса корзины с яблоками 31,2 кг, пустой корзины — 1200 г. Найдите процентное отношение массы пустой корзины к массе яблок.",en:"A basket with apples weighs 31,2 kg; the empty basket weighs 1200 g. Find the percent ratio of basket mass to apples' mass."},options:[{az:"0,04",ru:"0,04",en:"0,04"},{az:"4",ru:"4",en:"4"},{az:"3",ru:"3",en:"3"},{az:"0,4",ru:"0,4",en:"0,4"},{az:"0,3",ru:"0,3",en:"0,3"}],explanation:{az:"Həlli: 1) Alma: $31{,}2-1{,}2=30$ kq. 2) $\\frac{1{,}2}{30}\\cdot100\\%=4\\%$.",ru:"Решение: 1) Яблоки: $31{,}2-1{,}2=30$ кг. 2) $\\frac{1{,}2}{30}\\cdot100\\%=4\\%$.",en:"Solution: 1) Apples: $31{,}2-1{,}2=30$ kg. 2) $\\frac{1{,}2}{30}\\cdot100\\%=4\\%$."}},
{id:92,type:'mcq',correct:2,question:{az:"200 ədədi $1:3:6$ nisbətində üç hissəyə ayrılmışdır. Alınmış ədədlərdən ən böyük ilə ən kiçiyinin fərqini tapın.",ru:"Число 200 разделено на три части в отношении $1:3:6$. Найдите разность наибольшей и наименьшей частей.",en:"200 is divided into three parts in the ratio $1:3:6$. Find the difference between the largest and smallest parts."},options:[{az:"40",ru:"40",en:"40"},{az:"60",ru:"60",en:"60"},{az:"100",ru:"100",en:"100"},{az:"110",ru:"110",en:"110"},{az:"50",ru:"50",en:"50"}],explanation:{az:"Həlli: 1) Vahid: $200:(1+3+6)=20$. 2) Hissələr: 20, 60, 120. 3) Fərq: $120-20=100$.",ru:"Решение: 1) Часть: $200:(1+3+6)=20$. 2) Части: 20, 60, 120. 3) Разность: $120-20=100$.",en:"Solution: 1) Unit: $200:10=20$. 2) Parts: 20, 60, 120. 3) Difference: $120-20=100$."}},
{id:93,type:'mcq',correct:2,question:{az:"Çəndəki suyun $40\\%$-i buxarlandıqdan sonra çəndə 120 l su qaldı. Qalan suyun miqdarını neçə faiz artırmaq lazımdır ki, çəndə əvvəlki qədər su olsun?",ru:"После испарения $40\\%$ воды в баке осталось 120 л. На сколько процентов нужно увеличить оставшуюся воду, чтобы восстановить первоначальный объём?",en:"After $40\\%$ of the water evaporated, 120 L remained. By what percent must the remaining water be increased to restore the original amount?"},options:[{az:"$66\\frac{1}{2}\\%$",ru:"$66\\frac{1}{2}\\%$",en:"$66\\frac{1}{2}\\%$"},{az:"$67\\frac{1}{3}\\%$",ru:"$67\\frac{1}{3}\\%$",en:"$67\\frac{1}{3}\\%$"},{az:"$66\\frac{2}{3}\\%$",ru:"$66\\frac{2}{3}\\%$",en:"$66\\frac{2}{3}\\%$"},{az:"$67\\frac{2}{3}\\%$",ru:"$67\\frac{2}{3}\\%$",en:"$67\\frac{2}{3}\\%$"},{az:"$66\\frac{1}{3}\\%$",ru:"$66\\frac{1}{3}\\%$",en:"$66\\frac{1}{3}\\%$"}],explanation:{az:"Həlli: 1) Əvvəlki: $120:0{,}6=200$ l. 2) Əlavə edilməli: $200-120=80$ l. 3) $\\frac{80}{120}\\cdot100\\%=66\\frac{2}{3}\\%$.",ru:"Решение: 1) Первоначально: $120:0{,}6=200$ л. 2) Нужно добавить: $80$ л. 3) $\\frac{80}{120}\\cdot100\\%=66\\frac{2}{3}\\%$.",en:"Solution: 1) Original: $120:0{,}6=200$ L. 2) To add: $80$ L. 3) $\\frac{80}{120}\\cdot100\\%=66\\frac{2}{3}\\%$."}},
{id:94,type:'mcq',correct:0,question:{az:"150 ədədi $2:5:8$ nisbətində üç hissəyə ayrılmışdır. Onun ən böyük hissəsinin 3 mislini tapın.",ru:"Число 150 разделено на три части в отношении $2:5:8$. Найдите утроенную наибольшую часть.",en:"150 is divided into parts in the ratio $2:5:8$. Find three times the largest part."},options:[{az:"240",ru:"240",en:"240"},{az:"210",ru:"210",en:"210"},{az:"180",ru:"180",en:"180"},{az:"300",ru:"300",en:"300"},{az:"200",ru:"200",en:"200"}],explanation:{az:"Həlli: 1) Vahid: $150:15=10$. 2) Ən böyük hissə: $8\\cdot10=80$. 3) $80\\cdot3=240$.",ru:"Решение: 1) Единица: $150:15=10$. 2) Наибольшая часть: $8\\cdot10=80$. 3) $80\\cdot3=240$.",en:"Solution: 1) Unit: $150:15=10$. 2) Largest: $80$. 3) $80\\cdot3=240$."}},
{id:95,type:'mcq',correct:1,question:{az:"140 ədədi $2:5:7$ nisbətində üç hissəyə ayrılmışdır. Onun ən kiçik hissəsinin 4 mislini tapın.",ru:"Число 140 разделено на три части в отношении $2:5:7$. Найдите учетверённую наименьшую часть.",en:"140 is divided into parts in the ratio $2:5:7$. Find four times the smallest part."},options:[{az:"120",ru:"120",en:"120"},{az:"80",ru:"80",en:"80"},{az:"100",ru:"100",en:"100"},{az:"60",ru:"60",en:"60"},{az:"40",ru:"40",en:"40"}],explanation:{az:"Həlli: 1) Vahid: $140:14=10$. 2) Ən kiçik hissə: $2\\cdot10=20$. 3) $20\\cdot4=80$.",ru:"Решение: 1) Единица: $140:14=10$. 2) Наименьшая часть: $20$. 3) $20\\cdot4=80$.",en:"Solution: 1) Unit: $140:14=10$. 2) Smallest: $20$. 3) $20\\cdot4=80$."}},
{id:96,type:'mcq',correct:1,question:{az:"$3{,}6:x=4:9$ tənasübünün məchul həddini tapın.",ru:"Найдите неизвестный член пропорции $3{,}6:x=4:9$.",en:"Find the unknown term of the proportion $3{,}6:x=4:9$."},options:[{az:"1,8",ru:"1,8",en:"1,8"},{az:"8,1",ru:"8,1",en:"8,1"},{az:"3,24",ru:"3,24",en:"3,24"},{az:"2,8",ru:"2,8",en:"2,8"},{az:"0,12",ru:"0,12",en:"0,12"}],explanation:{az:"Həlli: 1) $4x=3{,}6\\cdot9=32{,}4$. 2) $x=32{,}4:4=8{,}1$.",ru:"Решение: 1) $4x=3{,}6\\cdot9=32{,}4$. 2) $x=32{,}4:4=8{,}1$.",en:"Solution: 1) $4x=3{,}6\\cdot9=32{,}4$. 2) $x=32{,}4:4=8{,}1$."}},
{id:97,type:'mcq',correct:0,question:{az:"Malın qiymətini əvvəlcə $20\\%$ artırdılar, sonra yeni qiyməti $20\\%$ endirdilər. Malın ilkin qiyməti ilə müqayisədə qiymət neçə faiz aşağı düşmüşdür?",ru:"Цену товара сначала повысили на $20\\%$, затем новую цену снизили на $20\\%$. На сколько процентов цена стала ниже первоначальной?",en:"A price was first increased by $20\\%$, then decreased by $20\\%$. By what percent is it lower than the original?"},options:[{az:"4",ru:"4",en:"4"},{az:"8",ru:"8",en:"8"},{az:"5",ru:"5",en:"5"},{az:"9",ru:"9",en:"9"},{az:"6",ru:"6",en:"6"}],explanation:{az:"Həlli: 1) $1{,}2\\cdot0{,}8=0{,}96$. 2) Azalma: $1-0{,}96=0{,}04=4\\%$.",ru:"Решение: 1) $1{,}2\\cdot0{,}8=0{,}96$. 2) Снижение: $1-0{,}96=4\\%$.",en:"Solution: 1) $1{,}2\\cdot0{,}8=0{,}96$. 2) Decrease: $1-0{,}96=4\\%$."}},
{id:98,type:'mcq',correct:4,question:{az:"$80\\%$-li spirt almaq üçün 30 litr $90\\%$-li spirt məhluluna nə qədər su əlavə etmək lazımdır?",ru:"Сколько воды нужно добавить к 30 л $90\\%$-го раствора спирта, чтобы получить $80\\%$-й?",en:"How much water must be added to 30 L of a $90\\%$ alcohol solution to get an $80\\%$ solution?"},options:[{az:"3 l",ru:"3 л",en:"3 L"},{az:"4 l",ru:"4 л",en:"4 L"},{az:"2,5 l",ru:"2,5 л",en:"2,5 L"},{az:"3,57 l",ru:"3,57 л",en:"3,57 L"},{az:"3,75 l",ru:"3,75 л",en:"3,75 L"}],explanation:{az:"Həlli: 1) Saf spirt: $30\\cdot0{,}9=27$ l. 2) Yeni məhlul: $27:0{,}8=33{,}75$ l. 3) Su: $33{,}75-30=3{,}75$ l.",ru:"Решение: 1) Чистый спирт: $30\\cdot0{,}9=27$ л. 2) Новый раствор: $27:0{,}8=33{,}75$ л. 3) Вода: $33{,}75-30=3{,}75$ л.",en:"Solution: 1) Pure alcohol: $27$ L. 2) New solution: $27:0{,}8=33{,}75$ L. 3) Water: $3{,}75$ L."}},
{id:99,type:'mcq',correct:1,question:{az:"Kvadratın perimetrini $10\\%$ artırdıqda, sahəsi neçə faiz artar?",ru:"Если периметр квадрата увеличить на $10\\%$, на сколько процентов увеличится его площадь?",en:"If a square's perimeter is increased by $10\\%$, by what percent does its area increase?"},options:[{az:"20",ru:"20",en:"20"},{az:"21",ru:"21",en:"21"},{az:"22",ru:"22",en:"22"},{az:"10",ru:"10",en:"10"},{az:"15",ru:"15",en:"15"}],explanation:{az:"Həlli: 1) Perimetr (və tərəf) $1{,}1$ dəfə artar. 2) Sahə $1{,}1^2=1{,}21$ dəfə artar, yəni $21\\%$.",ru:"Решение: 1) Периметр (и сторона) увеличатся в $1{,}1$ раза. 2) Площадь: $1{,}1^2=1{,}21$, т.е. рост $21\\%$.",en:"Solution: 1) Perimeter and side become $1{,}1$ times larger. 2) Area: $1{,}1^2=1{,}21$, i.e. $+21\\%$."}},
{id:100,type:'mcq',correct:4,question:{az:"Bir il müddətində kəndin əhalisi $3\\%$ artaraq 824 nəfər olmuşdur. İlin əvvəlində kəndin əhalisi neçə nəfər idi?",ru:"За год население деревни выросло на $3\\%$ и стало 824 человека. Каково было население в начале года?",en:"A village's population grew by $3\\%$ in a year to 824. What was it at the start of the year?"},options:[{az:"805",ru:"805",en:"805"},{az:"810",ru:"810",en:"810"},{az:"790",ru:"790",en:"790"},{az:"780",ru:"780",en:"780"},{az:"800",ru:"800",en:"800"}],explanation:{az:"Həlli: $824:1{,}03=800$ nəfər.",ru:"Решение: $824:1{,}03=800$ человек.",en:"Solution: $824:1{,}03=800$ people."}},
{id:101,type:'mcq',correct:2,question:{az:"Məhsuldarlıq 25 s-dən artırılıb 35 s oldu. Məhsuldarlıq neçə faiz artdı?",ru:"Производительность выросла с 25 до 35. На сколько процентов она выросла?",en:"Productivity increased from 25 to 35. By what percent?"},options:[{az:"25%",ru:"25%",en:"25%"},{az:"10%",ru:"10%",en:"10%"},{az:"40%",ru:"40%",en:"40%"},{az:"60%",ru:"60%",en:"60%"},{az:"65%",ru:"65%",en:"65%"}],explanation:{az:"Həlli: 1) Artım: $35-25=10$. 2) $\\frac{10}{25}\\cdot100\\%=40\\%$.",ru:"Решение: 1) Прирост: $35-25=10$. 2) $\\frac{10}{25}\\cdot100\\%=40\\%$.",en:"Solution: 1) Increase: $10$. 2) $\\frac{10}{25}\\cdot100\\%=40\\%$."}},
{id:102,type:'mcq',correct:3,question:{az:"Turistlər yolun $40\\%$-ni düzənliklə, $26\\%$-ni dağlıq yerlə, qalan 102 km yolu isə meşə ilə getdilər. Turistlər dağlıq yerlə neçə kilometr yol getdilər?",ru:"Туристы прошли $40\\%$ пути по равнине, $26\\%$ по горам, а оставшиеся 102 км по лесу. Сколько км они прошли по горам?",en:"Tourists walked $40\\%$ of a road on plains, $26\\%$ in mountains, the remaining 102 km through forest. How many km were in the mountains?"},options:[{az:"50",ru:"50",en:"50"},{az:"38",ru:"38",en:"38"},{az:"42",ru:"42",en:"42"},{az:"78",ru:"78",en:"78"},{az:"80",ru:"80",en:"80"}],explanation:{az:"Həlli: 1) Meşə hissəsi: $100\\%-40\\%-26\\%=34\\%$. 2) Bütün yol: $102:0{,}34=300$ km. 3) Dağlıq: $300\\cdot0{,}26=78$ km.",ru:"Решение: 1) Лес: $100\\%-40\\%-26\\%=34\\%$. 2) Весь путь: $102:0{,}34=300$ км. 3) Горы: $300\\cdot0{,}26=78$ км.",en:"Solution: 1) Forest: $34\\%$. 2) Total: $102:0{,}34=300$ km. 3) Mountains: $300\\cdot0{,}26=78$ km."}},
{id:103,type:'mcq',correct:2,question:{az:"$\\frac{0{,}3x+0{,}9y}{x+y}=0{,}5$ və $x+y=6$ olarsa, $y$-i tapın.",ru:"Если $\\frac{0{,}3x+0{,}9y}{x+y}=0{,}5$ и $x+y=6$, найдите $y$.",en:"If $\\frac{0{,}3x+0{,}9y}{x+y}=0{,}5$ and $x+y=6$, find $y$."},options:[{az:"1",ru:"1",en:"1"},{az:"-1",ru:"-1",en:"-1"},{az:"2",ru:"2",en:"2"},{az:"-2",ru:"-2",en:"-2"},{az:"-4",ru:"-4",en:"-4"}],explanation:{az:"Həlli: 1) $0{,}3x+0{,}9y=0{,}5(x+y)\\Rightarrow 0{,}2x=0{,}4y\\Rightarrow x=2y$. 2) $2y+y=6\\Rightarrow y=2$.",ru:"Решение: 1) $0{,}3x+0{,}9y=0{,}5(x+y)\\Rightarrow x=2y$. 2) $2y+y=6\\Rightarrow y=2$.",en:"Solution: 1) $0{,}3x+0{,}9y=0{,}5(x+y)\\Rightarrow x=2y$. 2) $2y+y=6\\Rightarrow y=2$."}},
{id:104,type:'mcq',correct:2,question:{az:"$\\frac{0{,}1x+0{,}3y}{x+y}=0{,}22$ və $x+y=5$ olarsa, $y$-i tapın.",ru:"Если $\\frac{0{,}1x+0{,}3y}{x+y}=0{,}22$ и $x+y=5$, найдите $y$.",en:"If $\\frac{0{,}1x+0{,}3y}{x+y}=0{,}22$ and $x+y=5$, find $y$."},options:[{az:"2",ru:"2",en:"2"},{az:"-2",ru:"-2",en:"-2"},{az:"3",ru:"3",en:"3"},{az:"2,5",ru:"2,5",en:"2,5"},{az:"-2,5",ru:"-2,5",en:"-2,5"}],explanation:{az:"Həlli: 1) $0{,}1x+0{,}3y=0{,}22(x+y)\\Rightarrow 0{,}12x=0{,}08y\\Rightarrow y=1{,}5x$. 2) $x+1{,}5x=5\\Rightarrow x=2$, $y=3$.",ru:"Решение: 1) $0{,}1x+0{,}3y=0{,}22(x+y)\\Rightarrow y=1{,}5x$. 2) $x+1{,}5x=5\\Rightarrow x=2$, $y=3$.",en:"Solution: 1) $0{,}1x+0{,}3y=0{,}22(x+y)\\Rightarrow y=1{,}5x$. 2) $2{,}5x=5\\Rightarrow y=3$."}},
{id:105,type:'mcq',correct:2,question:{az:"Hər $1\\text{ m}^2$ sahəyə eyni qədər boya işlətməklə sahəsi $12\\text{ m}^2$ olan döşəməni rəngləmək üçün 5 kq boya işlətdilər. Sahəsi $18\\text{ m}^2$ olan döşəməni rəngləmək üçün neçə kq boya lazımdır?",ru:"На покраску $12\\text{ м}^2$ пола израсходовали 5 кг краски (расход на $1\\text{ м}^2$ одинаков). Сколько кг краски нужно для $18\\text{ м}^2$?",en:"Painting $12\\text{ m}^2$ of floor took 5 kg of paint (same rate per $1\\text{ m}^2$). How much paint is needed for $18\\text{ m}^2$?"},options:[{az:"6",ru:"6",en:"6"},{az:"9",ru:"9",en:"9"},{az:"7,5",ru:"7,5",en:"7,5"},{az:"10",ru:"10",en:"10"},{az:"8",ru:"8",en:"8"}],explanation:{az:"Həlli: 1) $1\\text{ m}^2$ üçün: $\\frac{5}{12}$ kq. 2) $18\\text{ m}^2$ üçün: $\\frac{5}{12}\\cdot18=7{,}5$ kq.",ru:"Решение: 1) На $1\\text{ м}^2$: $\\frac{5}{12}$ кг. 2) Для $18\\text{ м}^2$: $\\frac{5}{12}\\cdot18=7{,}5$ кг.",en:"Solution: 1) Per $\\text{m}^2$: $\\frac{5}{12}$ kg. 2) For $18\\text{ m}^2$: $\\frac{5}{12}\\cdot18=7{,}5$ kg."}},

{id:110,type:'mcq',correct:1,image:'Faiz_nisbet_tenasub_Image0110.png',question:{az:"3 gün ərzində 270 ədəd televizor satılıb. Diaqrama əsasən II gün neçə ədəd televizor satılmışdır? (I gün — $30\\%$, II gün — $40\\%$, III gün — $30\\%$)",ru:"За 3 дня продано 270 телевизоров. По диаграмме, сколько телевизоров продано во II день? (I день — $30\\%$, II день — $40\\%$, III день — $30\\%$)",en:"270 TVs were sold over 3 days. According to the diagram, how many were sold on day II? (Day I — $30\\%$, day II — $40\\%$, day III — $30\\%$)"},options:[{az:"81",ru:"81",en:"81"},{az:"108",ru:"108",en:"108"},{az:"135",ru:"135",en:"135"},{az:"90",ru:"90",en:"90"},{az:"72",ru:"72",en:"72"}],explanation:{az:"Həlli: 1) II gün $270$-in $40\\%$-i. 2) $270\\cdot0{,}4=108$ ədəd.",ru:"Решение: 1) II день — $40\\%$ от 270. 2) $270\\cdot0{,}4=108$ штук.",en:"Solution: 1) Day II is $40\\%$ of 270. 2) $270\\cdot0{,}4=108$ TVs."}},
