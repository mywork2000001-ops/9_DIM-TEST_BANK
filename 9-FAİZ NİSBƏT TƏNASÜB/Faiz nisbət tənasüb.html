{id:112,type:'mcq',correct:1,question:{az:"Ədədi $20\\%$ azaltdılar. Alınan ədədi neçə faiz artırmaq lazımdır ki, əvvəlki ədəd alınsın?",ru:"Число уменьшили на $20\\%$. На сколько процентов нужно увеличить полученное число, чтобы вернуть прежнее?",en:"A number was decreased by $20\\%$. By what percent must the result be increased to get the original?"},options:[{az:"20%",ru:"20%",en:"20%"},{az:"25%",ru:"25%",en:"25%"},{az:"80%",ru:"80%",en:"80%"},{az:"12,5%",ru:"12,5%",en:"12,5%"},{az:"30%",ru:"30%",en:"30%"}],explanation:{az:"Həlli: 1) Yeni ədəd əvvəlkinin $0{,}8$-idir. 2) Artım əmsalı: $1:0{,}8=1{,}25$, yəni $25\\%$ artırmaq lazımdır.",ru:"Решение: 1) Новое число — $0{,}8$ прежнего. 2) $1:0{,}8=1{,}25$, т.е. нужно увеличить на $25\\%$.",en:"Solution: 1) New number is $0{,}8$ of the original. 2) $1:0{,}8=1{,}25$, so increase by $25\\%$."}},
{id:113,type:'mcq',correct:0,question:{az:"Malın qiyməti $60\\%$ artırılmışdır. Alınan qiyməti neçə faiz azaltmaq lazımdır ki, malın əvvəlki qiyməti alınsın?",ru:"Цену товара повысили на $60\\%$. На сколько процентов нужно снизить новую цену, чтобы вернуть прежнюю?",en:"A price was increased by $60\\%$. By what percent must it be decreased to restore the original?"},options:[{az:"37,5%",ru:"37,5%",en:"37,5%"},{az:"60%",ru:"60%",en:"60%"},{az:"40%",ru:"40%",en:"40%"},{az:"45%",ru:"45%",en:"45%"},{az:"30%",ru:"30%",en:"30%"}],explanation:{az:"Həlli: 1) Yeni qiymət əvvəlkinin $1{,}6$-sıdır. 2) $\\frac{1{,}6-1}{1{,}6}=0{,}375=37{,}5\\%$.",ru:"Решение: 1) Новая цена — $1{,}6$ прежней. 2) $\\frac{0{,}6}{1{,}6}=37{,}5\\%$.",en:"Solution: 1) New price is $1{,}6$ times the original. 2) $\\frac{0{,}6}{1{,}6}=37{,}5\\%$."}},
{id:114,type:'mcq',correct:2,question:{az:"Fəhlələr yolun 130 km-ni asfaltladıqdan sonra bütün yolun $35\\%$-i asfaltlanmamış qaldı. Neçə km yol asfaltlanmamış qaldı?",ru:"После того как рабочие заасфальтировали 130 км, непроасфальтированными осталось $35\\%$ всей дороги. Сколько км осталось?",en:"After workers asphalted 130 km, $35\\%$ of the road remained unasphalted. How many km remained?"},options:[{az:"65",ru:"65",en:"65"},{az:"75",ru:"75",en:"75"},{az:"70",ru:"70",en:"70"},{az:"80",ru:"80",en:"80"},{az:"60",ru:"60",en:"60"}],explanation:{az:"Həlli: 1) Asfaltlanmış hissə: $100\\%-35\\%=65\\%$. 2) Bütün yol: $130:0{,}65=200$ km. 3) Qalan: $200-130=70$ km.",ru:"Решение: 1) Заасфальтировано: $100\\%-35\\%=65\\%$. 2) Вся дорога: $130:0{,}65=200$ км. 3) Осталось: $70$ км.",en:"Solution: 1) Asphalted: $65\\%$. 2) Total: $130:0{,}65=200$ km. 3) Remaining: $70$ km."}},
{id:115,type:'mcq',correct:4,question:{az:"Mağazadakı almanın 34 kq-ı satıldıqdan sonra əvvəlki miqdarın $15\\%$-i qədər alma qaldı. Mağazada neçə kq alma qalıb?",ru:"После продажи 34 кг яблок осталось $15\\%$ прежнего количества. Сколько кг яблок осталось?",en:"After 34 kg of apples were sold, $15\\%$ of the original amount remained. How many kg remained?"},options:[{az:"4",ru:"4",en:"4"},{az:"8",ru:"8",en:"8"},{az:"5",ru:"5",en:"5"},{az:"9",ru:"9",en:"9"},{az:"6",ru:"6",en:"6"}],explanation:{az:"Həlli: 1) Satılan hissə: $100\\%-15\\%=85\\%$. 2) Əvvəlki miqdar: $34:0{,}85=40$ kq. 3) Qalan: $40-34=6$ kq.",ru:"Решение: 1) Продано: $100\\%-15\\%=85\\%$. 2) Первоначально: $34:0{,}85=40$ кг. 3) Осталось: $40-34=6$ кг.",en:"Solution: 1) Sold: $85\\%$. 2) Original: $34:0{,}85=40$ kg. 3) Left: $6$ kg."}},
{id:116,type:'mcq',correct:0,question:{az:"Düzbucaqlı şəklində yerin uzunluğu 15 m, eni isə uzunluğunun $60\\%$-ni təşkil edir. Həmin yerin sahəsini hesablayın.",ru:"Длина прямоугольного участка 15 м, а ширина составляет $60\\%$ длины. Найдите площадь участка.",en:"A rectangular plot is 15 m long; its width is $60\\%$ of the length. Find its area."},options:[{az:"$135\\text{ m}^2$",ru:"$135\\text{ м}^2$",en:"$135\\text{ m}^2$"},{az:"$120\\text{ m}^2$",ru:"$120\\text{ м}^2$",en:"$120\\text{ m}^2$"},{az:"$150\\text{ m}^2$",ru:"$150\\text{ м}^2$",en:"$150\\text{ m}^2$"},{az:"$90\\text{ m}^2$",ru:"$90\\text{ м}^2$",en:"$90\\text{ m}^2$"},{az:"$108\\text{ m}^2$",ru:"$108\\text{ м}^2$",en:"$108\\text{ m}^2$"}],explanation:{az:"Həlli: 1) En: $15\\cdot0{,}6=9$ m. 2) Sahə: $15\\cdot9=135\\text{ m}^2$.",ru:"Решение: 1) Ширина: $15\\cdot0{,}6=9$ м. 2) Площадь: $15\\cdot9=135\\text{ м}^2$.",en:"Solution: 1) Width: $15\\cdot0{,}6=9$ m. 2) Area: $15\\cdot9=135\\text{ m}^2$."}},
{id:117,type:'mcq',correct:2,question:{az:"Eyni məhsuldarlıqla işləyən 3 fəhlə müəyyən işi 9 saata yerinə yetirir. Həmin işi 9 fəhlə neçə saata yerinə yetirər?",ru:"3 рабочих с одинаковой производительностью выполняют работу за 9 часов. За сколько часов её выполнят 9 рабочих?",en:"3 workers of equal productivity finish a job in 9 hours. How long would 9 workers take?"},options:[{az:"6",ru:"6",en:"6"},{az:"1",ru:"1",en:"1"},{az:"3",ru:"3",en:"3"},{az:"9",ru:"9",en:"9"},{az:"27",ru:"27",en:"27"}],explanation:{az:"Həlli: 1) İş: $3\\cdot9=27$ fəhlə-saat. 2) $27:9=3$ saat.",ru:"Решение: 1) Работа: $3\\cdot9=27$ человеко-часов. 2) $27:9=3$ часа.",en:"Solution: 1) Job = $3\\cdot9=27$ worker-hours. 2) $27:9=3$ hours."}},
{id:118,type:'mcq',correct:1,question:{az:"Eyni məhsuldarlıqla işləyən 5 fəhlə müəyyən işi 18 günə yerinə yetirir. Həmin işi 15 fəhlə neçə günə yerinə yetirər?",ru:"5 рабочих выполняют работу за 18 дней. За сколько дней её выполнят 15 рабочих?",en:"5 workers finish a job in 18 days. How long would 15 workers take?"},options:[{az:"54",ru:"54",en:"54"},{az:"6",ru:"6",en:"6"},{az:"12",ru:"12",en:"12"},{az:"9",ru:"9",en:"9"},{az:"3",ru:"3",en:"3"}],explanation:{az:"Həlli: 1) İş: $5\\cdot18=90$ fəhlə-gün. 2) $90:15=6$ gün.",ru:"Решение: 1) Работа: $5\\cdot18=90$ человеко-дней. 2) $90:15=6$ дней.",en:"Solution: 1) Job = $5\\cdot18=90$ worker-days. 2) $90:15=6$ days."}},
{id:119,type:'mcq',correct:0,question:{az:"Müsbət $a$ ədədi $b$-nin $40\\%$-i olarsa, $a:b$ nisbətini tapın.",ru:"Если положительное число $a$ составляет $40\\%$ от $b$, найдите отношение $a:b$.",en:"If positive $a$ is $40\\%$ of $b$, find the ratio $a:b$."},options:[{az:"$2:5$",ru:"$2:5$",en:"$2:5$"},{az:"$5:2$",ru:"$5:2$",en:"$5:2$"},{az:"$4:5$",ru:"$4:5$",en:"$4:5$"},{az:"$2:3$",ru:"$2:3$",en:"$2:3$"},{az:"$3:5$",ru:"$3:5$",en:"$3:5$"}],explanation:{az:"Həlli: $a=0{,}4b=\\frac{2}{5}b\\Rightarrow a:b=2:5$.",ru:"Решение: $a=0{,}4b=\\frac{2}{5}b\\Rightarrow a:b=2:5$.",en:"Solution: $a=0{,}4b=\\frac{2}{5}b\\Rightarrow a:b=2:5$."}},
{id:120,type:'mcq',correct:3,question:{az:"Müsbət $a$ ədədi $b$-nin $20\\%$-ni təşkil edir. $a:b$ nisbətini tapın.",ru:"Если положительное число $a$ составляет $20\\%$ от $b$, найдите отношение $a:b$.",en:"If positive $a$ is $20\\%$ of $b$, find $a:b$."},options:[{az:"$5:1$",ru:"$5:1$",en:"$5:1$"},{az:"$1:4$",ru:"$1:4$",en:"$1:4$"},{az:"$2:5$",ru:"$2:5$",en:"$2:5$"},{az:"$1:5$",ru:"$1:5$",en:"$1:5$"},{az:"$1:20$",ru:"$1:20$",en:"$1:20$"}],explanation:{az:"Həlli: $a=0{,}2b=\\frac{1}{5}b\\Rightarrow a:b=1:5$.",ru:"Решение: $a=0{,}2b=\\frac{1}{5}b\\Rightarrow a:b=1:5$.",en:"Solution: $a=0{,}2b=\\frac{1}{5}b\\Rightarrow a:b=1:5$."}},
{id:121,type:'mcq',correct:3,question:{az:"Müəyyən yükü daşımaq üçün yükdaşıma qabiliyyəti 6 t olan 18 yük avtomobili lazımdır. Bu yükü daşımaq üçün yükdaşıma qabiliyyəti 9 t olan neçə avtomobil lazımdır?",ru:"Для перевозки груза нужно 18 грузовиков грузоподъёмностью 6 т. Сколько грузовиков грузоподъёмностью 9 т понадобится?",en:"18 trucks of 6 t capacity are needed for a load. How many 9 t trucks are needed?"},options:[{az:"24",ru:"24",en:"24"},{az:"16",ru:"16",en:"16"},{az:"9",ru:"9",en:"9"},{az:"12",ru:"12",en:"12"},{az:"15",ru:"15",en:"15"}],explanation:{az:"Həlli: 1) Yük: $18\\cdot6=108$ t. 2) $108:9=12$ avtomobil.",ru:"Решение: 1) Груз: $18\\cdot6=108$ т. 2) $108:9=12$ машин.",en:"Solution: 1) Load: $18\\cdot6=108$ t. 2) $108:9=12$ trucks."}},
{id:122,type:'mcq',correct:0,question:{az:"Müəyyən yükü daşımaq üçün hər biri 4 t yük daşıyan 18 avtomobil lazımdır. Bu yükü daşımaq üçün hər biri 3 t yük daşıyan neçə avtomobil lazımdır?",ru:"Для перевозки груза нужно 18 машин по 4 т. Сколько машин по 3 т понадобится?",en:"18 trucks carrying 4 t each are needed. How many 3 t trucks are needed?"},options:[{az:"24",ru:"24",en:"24"},{az:"27",ru:"27",en:"27"},{az:"30",ru:"30",en:"30"},{az:"12",ru:"12",en:"12"},{az:"36",ru:"36",en:"36"}],explanation:{az:"Həlli: 1) Yük: $18\\cdot4=72$ t. 2) $72:3=24$ avtomobil.",ru:"Решение: 1) Груз: $18\\cdot4=72$ т. 2) $72:3=24$ машины.",en:"Solution: 1) Load: $72$ t. 2) $72:3=24$ trucks."}},
{id:123,type:'mcq',correct:0,question:{az:"Bir il ərzində alma ağacının boyu $5\\%$ artaraq 1,68 m oldu. İlin əvvəlində alma ağacının boyu neçə metr idi?",ru:"За год высота яблони выросла на $5\\%$ и стала 1,68 м. Какова была высота в начале года?",en:"An apple tree grew $5\\%$ in a year to 1,68 m. What was its height at the start?"},options:[{az:"1,6 m",ru:"1,6 м",en:"1,6 m"},{az:"1,5 m",ru:"1,5 м",en:"1,5 m"},{az:"1,44 m",ru:"1,44 м",en:"1,44 m"},{az:"1,2 m",ru:"1,2 м",en:"1,2 m"},{az:"1,4 m",ru:"1,4 м",en:"1,4 m"}],explanation:{az:"Həlli: $1{,}68:1{,}05=1{,}6$ m.",ru:"Решение: $1{,}68:1{,}05=1{,}6$ м.",en:"Solution: $1{,}68:1{,}05=1{,}6$ m."}},
{id:124,type:'mcq',correct:2,question:{az:"Bir il ərzində şam ağacının boyu $25\\%$ artaraq 1,5 m oldu. Bu müddətin əvvəlində şam ağacının boyu neçə metr idi?",ru:"За год высота сосны выросла на $25\\%$ и стала 1,5 м. Какова была высота в начале?",en:"A pine grew $25\\%$ in a year to 1,5 m. What was its height initially?"},options:[{az:"1,25 m",ru:"1,25 м",en:"1,25 m"},{az:"1,5 m",ru:"1,5 м",en:"1,5 m"},{az:"1,2 m",ru:"1,2 м",en:"1,2 m"},{az:"1 m",ru:"1 м",en:"1 m"},{az:"0,75 m",ru:"0,75 м",en:"0,75 m"}],explanation:{az:"Həlli: $1{,}5:1{,}25=1{,}2$ m.",ru:"Решение: $1{,}5:1{,}25=1{,}2$ м.",en:"Solution: $1{,}5:1{,}25=1{,}2$ m."}},
{id:125,type:'mcq',correct:0,question:{az:"Yaşları 9, 12 və 15 olan üç qardaş 108 manat pulu yaşlarına mütənasib olaraq böldülər. Kiçik qardaşa neçə manat pul düşdü?",ru:"Три брата в возрасте 9, 12 и 15 лет разделили 108 манат пропорционально возрасту. Сколько досталось младшему?",en:"Three brothers aged 9, 12, 15 shared 108 manats proportionally to age. How much did the youngest get?"},options:[{az:"27",ru:"27",en:"27"},{az:"36",ru:"36",en:"36"},{az:"45",ru:"45",en:"45"},{az:"24",ru:"24",en:"24"},{az:"54",ru:"54",en:"54"}],explanation:{az:"Həlli: 1) Yaşlar cəmi: $9+12+15=36$. 2) Kiçik: $108\\cdot\\frac{9}{36}=27$ manat.",ru:"Решение: 1) Сумма возрастов: $36$. 2) Младший: $108\\cdot\\frac{9}{36}=27$ манатов.",en:"Solution: 1) Age total: $36$. 2) Youngest: $108\\cdot\\frac{9}{36}=27$ manats."}},
{id:126,type:'mcq',correct:2,question:{az:"Yaşları 8, 11 və 14 olan üç qardaş 66 manat pulu yaşlarına mütənasib olaraq böldülər. Böyük qardaşa neçə manat pul düşdü?",ru:"Три брата в возрасте 8, 11 и 14 лет разделили 66 манат пропорционально возрасту. Сколько досталось старшему?",en:"Three brothers aged 8, 11, 14 shared 66 manats proportionally to age. How much did the eldest get?"},options:[{az:"22",ru:"22",en:"22"},{az:"16",ru:"16",en:"16"},{az:"28",ru:"28",en:"28"},{az:"24",ru:"24",en:"24"},{az:"14",ru:"14",en:"14"}],explanation:{az:"Həlli: 1) Yaşlar cəmi: $8+11+14=33$. 2) Böyük: $66\\cdot\\frac{14}{33}=28$ manat.",ru:"Решение: 1) Сумма возрастов: $33$. 2) Старший: $66\\cdot\\frac{14}{33}=28$ манатов.",en:"Solution: 1) Age total: $33$. 2) Eldest: $66\\cdot\\frac{14}{33}=28$ manats."}},
{id:127,type:'mcq',correct:0,question:{az:"Ədəd 50 dəfə azalanda neçə faiz azalır?",ru:"На сколько процентов уменьшается число, если его уменьшить в 50 раз?",en:"By what percent does a number decrease if it is divided by 50?"},options:[{az:"98%",ru:"98%",en:"98%"},{az:"95%",ru:"95%",en:"95%"},{az:"50%",ru:"50%",en:"50%"},{az:"99%",ru:"99%",en:"99%"},{az:"96%",ru:"96%",en:"96%"}],explanation:{az:"Həlli: 1) Yeni qiymət əvvəlkinin $\\frac{1}{50}=2\\%$-idir. 2) Azalma: $100\\%-2\\%=98\\%$.",ru:"Решение: 1) Новое значение — $\\frac{1}{50}=2\\%$ прежнего. 2) Уменьшение: $100\\%-2\\%=98\\%$.",en:"Solution: 1) New value is $\\frac{1}{50}=2\\%$ of the original. 2) Decrease: $98\\%$."}},
{id:128,type:'mcq',correct:4,question:{az:"Ədəd $80\\%$ azalanda neçə dəfə azalır?",ru:"Во сколько раз уменьшается число, если его уменьшить на $80\\%$?",en:"By what factor does a number decrease if it is reduced by $80\\%$?"},options:[{az:"4",ru:"4",en:"4"},{az:"20",ru:"20",en:"20"},{az:"10",ru:"10",en:"10"},{az:"2",ru:"2",en:"2"},{az:"5",ru:"5",en:"5"}],explanation:{az:"Həlli: 1) Qalan hissə: $100\\%-80\\%=20\\%=\\frac{1}{5}$. 2) Ədəd 5 dəfə azalar.",ru:"Решение: 1) Осталось: $20\\%=\\frac{1}{5}$. 2) Число уменьшится в 5 раз.",en:"Solution: 1) Remaining: $20\\%=\\frac{1}{5}$. 2) It decreases 5 times."}},
{id:129,type:'mcq',correct:0,question:{az:"Nəzrin $z$ puluna 7 dəftər və 3 karandaş, və ya 5 dəftər və 7 karandaş ala bilər. Dəftərin qiyməti karandaşın qiymətindən neçə dəfə çoxdur?",ru:"На $z$ денег Назрин может купить 7 тетрадей и 3 карандаша, или 5 тетрадей и 7 карандашей. Во сколько раз тетрадь дороже карандаша?",en:"With $z$ money, Nazrin can buy 7 notebooks and 3 pencils, or 5 notebooks and 7 pencils. How many times more expensive is a notebook than a pencil?"},options:[{az:"2",ru:"2",en:"2"},{az:"3",ru:"3",en:"3"},{az:"1,5",ru:"1,5",en:"1,5"},{az:"4",ru:"4",en:"4"},{az:"2,5",ru:"2,5",en:"2,5"}],explanation:{az:"Həlli: 1) $7d+3k=5d+7p\\Rightarrow 2d=4k$. 2) $d=2k$, yəni 2 dəfə çox.",ru:"Решение: 1) $7t+3k=5t+7k\\Rightarrow 2t=4k$. 2) Тетрадь в 2 раза дороже.",en:"Solution: 1) $7n+3p=5n+7p\\Rightarrow 2n=4p$. 2) A notebook costs 2 times more."}},
{id:130,type:'mcq',correct:3,question:{az:"Fəhlə işin əvvəlcə $70\\%$-ni, sonra qalan işin $20\\%$-ni gördü. İşin neçə faizi görülməmiş qaldı?",ru:"Рабочий сначала выполнил $70\\%$ работы, затем $20\\%$ оставшейся. Сколько процентов работы осталось?",en:"A worker first did $70\\%$ of a job, then $20\\%$ of the remainder. What percent of the job is left?"},options:[{az:"30%",ru:"30%",en:"30%"},{az:"6%",ru:"6%",en:"6%"},{az:"26%",ru:"26%",en:"26%"},{az:"24%",ru:"24%",en:"24%"},{az:"46%",ru:"46%",en:"46%"}],explanation:{az:"Həlli: 1) Qalan: $100\\%-70\\%=30\\%$. 2) İkinci mərhələ: $30\\%\\cdot0{,}2=6\\%$. 3) Görülməmiş: $30\\%-6\\%=24\\%$.",ru:"Решение: 1) Осталось: $30\\%$. 2) Второй этап: $30\\%\\cdot0{,}2=6\\%$. 3) Не сделано: $30\\%-6\\%=24\\%$.",en:"Solution: 1) Remainder: $30\\%$. 2) Second stage: $6\\%$. 3) Left: $30\\%-6\\%=24\\%$."}},
{id:131,type:'mcq',correct:0,question:{az:"Müsbət ədədin 0,8 hissəsi onun 0,5 hissəsindən neçə faiz çoxdur?",ru:"На сколько процентов 0,8 числа больше, чем 0,5 этого числа?",en:"By what percent is 0,8 of a positive number greater than 0,5 of it?"},options:[{az:"60%",ru:"60%",en:"60%"},{az:"30%",ru:"30%",en:"30%"},{az:"37,5%",ru:"37,5%",en:"37,5%"},{az:"80%",ru:"80%",en:"80%"},{az:"50%",ru:"50%",en:"50%"}],explanation:{az:"Həlli: $\\frac{0{,}8-0{,}5}{0{,}5}\\cdot100\\%=\\frac{0{,}3}{0{,}5}\\cdot100\\%=60\\%$.",ru:"Решение: $\\frac{0{,}8-0{,}5}{0{,}5}\\cdot100\\%=60\\%$.",en:"Solution: $\\frac{0{,}8-0{,}5}{0{,}5}\\cdot100\\%=60\\%$."}},
{id:132,type:'mcq',correct:2,question:{az:"Müsbət ədədin $\\frac{2}{5}$ hissəsi onun $\\frac{1}{5}$ hissəsindən neçə faiz çoxdur?",ru:"На сколько процентов $\\frac{2}{5}$ числа больше, чем $\\frac{1}{5}$ этого числа?",en:"By what percent is $\\frac{2}{5}$ of a positive number greater than $\\frac{1}{5}$ of it?"},options:[{az:"50%",ru:"50%",en:"50%"},{az:"200%",ru:"200%",en:"200%"},{az:"100%",ru:"100%",en:"100%"},{az:"25%",ru:"25%",en:"25%"},{az:"40%",ru:"40%",en:"40%"}],explanation:{az:"Həlli: $\\frac{\\frac{2}{5}-\\frac{1}{5}}{\\frac{1}{5}}\\cdot100\\%=\\frac{\\frac{1}{5}}{\\frac{1}{5}}\\cdot100\\%=100\\%$.",ru:"Решение: $\\frac{\\frac{2}{5}-\\frac{1}{5}}{\\frac{1}{5}}\\cdot100\\%=100\\%$.",en:"Solution: $\\frac{\\frac{2}{5}-\\frac{1}{5}}{\\frac{1}{5}}\\cdot100\\%=100\\%$."}},
{id:133,type:'mcq',correct:0,question:{az:"Malın qiymətini əvvəlcə $30\\%$ artırdılar, sonra yeni qiyməti $40\\%$ azaltdılar. Malın ilkin qiyməti neçə faiz azaldı?",ru:"Цену товара сначала повысили на $30\\%$, затем новую цену снизили на $40\\%$. На сколько процентов уменьшилась первоначальная цена?",en:"A price was raised $30\\%$, then the new price cut $40\\%$. By what percent is it below the original?"},options:[{az:"22%",ru:"22%",en:"22%"},{az:"10%",ru:"10%",en:"10%"},{az:"12%",ru:"12%",en:"12%"},{az:"30%",ru:"30%",en:"30%"},{az:"78%",ru:"78%",en:"78%"}],explanation:{az:"Həlli: 1) $1{,}3\\cdot0{,}6=0{,}78$. 2) Azalma: $1-0{,}78=0{,}22=22\\%$.",ru:"Решение: 1) $1{,}3\\cdot0{,}6=0{,}78$. 2) Уменьшение: $22\\%$.",en:"Solution: 1) $1{,}3\\cdot0{,}6=0{,}78$. 2) Decrease: $22\\%$."}},
{id:134,type:'mcq',correct:0,question:{az:"Divar saatının kəfkiri 7 dəqiqə ərzində 357 dəfə rəqs edirsə, yarım saat müddətində neçə dəfə rəqs edər?",ru:"Маятник настенных часов за 7 минут делает 357 колебаний. Сколько колебаний он сделает за полчаса?",en:"A wall clock's pendulum swings 357 times in 7 minutes. How many times does it swing in half an hour?"},options:[{az:"1530",ru:"1530",en:"1530"},{az:"1428",ru:"1428",en:"1428"},{az:"1620",ru:"1620",en:"1620"},{az:"1500",ru:"1500",en:"1500"},{az:"1480",ru:"1480",en:"1480"}],explanation:{az:"Həlli: 1) 1 dəqiqədə: $357:7=51$. 2) 30 dəqiqədə: $51\\cdot30=1530$.",ru:"Решение: 1) В минуту: $357:7=51$. 2) За 30 минут: $51\\cdot30=1530$.",en:"Solution: 1) Per minute: $51$. 2) In 30 minutes: $51\\cdot30=1530$."}},
{id:135,type:'mcq',correct:0,question:{az:"Divar saatının kəfkiri 5 dəqiqə ərzində 270 dəfə rəqs edirsə, yarım saat müddətində neçə dəfə rəqs edər?",ru:"Маятник часов за 5 минут делает 270 колебаний. Сколько колебаний он сделает за полчаса?",en:"A clock's pendulum swings 270 times in 5 minutes. How many times in half an hour?"},options:[{az:"1620",ru:"1620",en:"1620"},{az:"1350",ru:"1350",en:"1350"},{az:"1800",ru:"1800",en:"1800"},{az:"1530",ru:"1530",en:"1530"},{az:"1450",ru:"1450",en:"1450"}],explanation:{az:"Həlli: 1) 1 dəqiqədə: $270:5=54$. 2) 30 dəqiqədə: $54\\cdot30=1620$.",ru:"Решение: 1) В минуту: $270:5=54$. 2) За 30 минут: $54\\cdot30=1620$.",en:"Solution: 1) Per minute: $54$. 2) In 30 minutes: $54\\cdot30=1620$."}},
{id:136,type:'mcq',correct:0,question:{az:"$x:y:z=3:2:1$ və $5x-2y+z=16$ olarsa, $y$-i tapın.",ru:"Если $x:y:z=3:2:1$ и $5x-2y+z=16$, найдите $y$.",en:"If $x:y:z=3:2:1$ and $5x-2y+z=16$, find $y$."},options:[{az:"$\\frac{8}{3}$",ru:"$\\frac{8}{3}$",en:"$\\frac{8}{3}$"},{az:"2",ru:"2",en:"2"},{az:"$\\frac{4}{3}$",ru:"$\\frac{4}{3}$",en:"$\\frac{4}{3}$"},{az:"3",ru:"3",en:"3"},{az:"$\\frac{16}{3}$",ru:"$\\frac{16}{3}$",en:"$\\frac{16}{3}$"}],explanation:{az:"Həlli: 1) $x=3k$, $y=2k$, $z=k$. 2) $15k-4k+k=12k=16\\Rightarrow k=\\frac{4}{3}$. 3) $y=2k=\\frac{8}{3}$.",ru:"Решение: 1) $x=3k$, $y=2k$, $z=k$. 2) $12k=16\\Rightarrow k=\\frac{4}{3}$. 3) $y=\\frac{8}{3}$.",en:"Solution: 1) $x=3k$, $y=2k$, $z=k$. 2) $12k=16\\Rightarrow k=\\frac{4}{3}$. 3) $y=\\frac{8}{3}$."}},
{id:137,type:'mcq',correct:1,question:{az:"Kənd təsərrüfatı bitkilərinin əkilməsi üçün nəzərdə tutulmuş 42 ha əkin sahəsi dənli və texniki bitkilər üçün uyğun olaraq $3:4$ nisbətində iki hissəyə ayrılmışdır. Dənli bitkilər üçün neçə ha əkin sahəsi ayrılmışdır?",ru:"42 га посевной площади разделены между зерновыми и техническими культурами в отношении $3:4$. Сколько га выделено зерновым?",en:"42 ha of farmland are divided between grain and technical crops in the ratio $3:4$. How many ha are for grain?"},options:[{az:"24",ru:"24",en:"24"},{az:"18",ru:"18",en:"18"},{az:"21",ru:"21",en:"21"},{az:"16",ru:"16",en:"16"},{az:"20",ru:"20",en:"20"}],explanation:{az:"Həlli: 1) Vahid: $42:(3+4)=6$ ha. 2) Dənli: $3\\cdot6=18$ ha.",ru:"Решение: 1) Единица: $42:7=6$ га. 2) Зерновые: $3\\cdot6=18$ га.",en:"Solution: 1) Unit: $42:7=6$ ha. 2) Grain: $3\\cdot6=18$ ha."}},
{id:138,type:'mcq',correct:0,question:{az:"İdman malları mağazası aksiya keçirir: \"Bir idman kostyumu 400 manatdır. İki kostyum aldıqda ikinci kostyuma $60\\%$ endirim edilir\". İki kostyum aldıqda neçə manat ödənilməlidir?",ru:"Акция магазина: «Спортивный костюм — 400 манатов. При покупке двух костюмов на второй — скидка $60\\%$». Сколько стоит покупка двух костюмов?",en:"A sports store offer: \"A tracksuit is 400 manats; buying two, the second gets a $60\\%$ discount\". How much for two suits?"},options:[{az:"560",ru:"560",en:"560"},{az:"640",ru:"640",en:"640"},{az:"400",ru:"400",en:"400"},{az:"600",ru:"600",en:"600"},{az:"520",ru:"520",en:"520"}],explanation:{az:"Həlli: 1) İkinci kostyum: $400\\cdot0{,}4=160$ manat. 2) Cəmi: $400+160=560$ manat.",ru:"Решение: 1) Второй костюм: $400\\cdot0{,}4=160$ манатов. 2) Итого: $400+160=560$ манатов.",en:"Solution: 1) Second suit: $400\\cdot0{,}4=160$. 2) Total: $400+160=560$ manats."}},
{id:139,type:'mcq',correct:0,question:{az:"İdman malları mağazası aksiya keçirir: \"Bir idman kostyumu 600 manatdır. İki kostyum alana ikinci kostyum üçün $80\\%$ endirim edilir\". İki kostyum aldıqda neçə manat ödənilməlidir?",ru:"Акция: «Спортивный костюм — 600 манатов. При покупке двух на второй — скидка $80\\%$». Сколько стоит покупка двух костюмов?",en:"A store offer: \"A tracksuit is 600 manats; buy two and get $80\\%$ off the second\". How much for two suits?"},options:[{az:"720",ru:"720",en:"720"},{az:"780",ru:"780",en:"780"},{az:"660",ru:"660",en:"660"},{az:"840",ru:"840",en:"840"},{az:"960",ru:"960",en:"960"}],explanation:{az:"Həlli: 1) İkinci kostyum: $600\\cdot0{,}2=120$ manat. 2) Cəmi: $600+120=720$ manat.",ru:"Решение: 1) Второй костюм: $600\\cdot0{,}2=120$ манатов. 2) Итого: $720$ манатов.",en:"Solution: 1) Second suit: $600\\cdot0{,}2=120$. 2) Total: $720$ manats."}},
{id:140,type:'mcq',correct:0,image:'Faiz_nisbet_tenasub_Image0140.png',question:{az:"Diaqramda 2 ay ərzində satılan məhsulların sayı göstərilmişdir. Yanvar: skaner — 40, printer — 60; Fevral: maus — 80, noutbuk — 120. Yanvar ayında satılmış skaner və printerlərin cəmi fevral ayında satılmış maus və noutbukların cəminin neçə faizini təşkil edir?",ru:"На диаграмме продажи за 2 месяца. Январь: сканеры — 40, принтеры — 60; Февраль: мыши — 80, ноутбуки — 120. Сколько процентов от суммы мышей и ноутбуков февраля составляет сумма сканеров и принтеров января?",en:"The diagram shows 2-month sales. January: scanners 40, printers 60; February: mice 80, laptops 120. What percent of February's mice+laptops is January's scanners+printers?"},options:[{az:"50%",ru:"50%",en:"50%"},{az:"40%",ru:"40%",en:"40%"},{az:"60%",ru:"60%",en:"60%"},{az:"45%",ru:"45%",en:"45%"},{az:"55%",ru:"55%",en:"55%"}],explanation:{az:"Həlli: 1) Yanvar cəmi: $40+60=100$. 2) Fevral cəmi: $80+120=200$. 3) $\\frac{100}{200}\\cdot100\\%=50\\%$.",ru:"Решение: 1) Январь: $40+60=100$. 2) Февраль: $80+120=200$. 3) $\\frac{100}{200}\\cdot100\\%=50\\%$.",en:"Solution: 1) January: $100$. 2) February: $200$. 3) $\\frac{100}{200}\\cdot100\\%=50\\%$."}},
{id:141,type:'mcq',correct:0,question:{az:"$a$ ədədinin $81\\%$-nin üzərinə 56,2 əlavə etdikdə 1100 ədədinin $11\\%$-i alınır. $a$ ədədini tapın.",ru:"Если к $81\\%$ числа $a$ прибавить 56,2, получится $11\\%$ от 1100. Найдите $a$.",en:"Adding 56,2 to $81\\%$ of $a$ gives $11\\%$ of 1100. Find $a$."},options:[{az:"80",ru:"80",en:"80"},{az:"60",ru:"60",en:"60"},{az:"70",ru:"70",en:"70"},{az:"90",ru:"90",en:"90"},{az:"100",ru:"100",en:"100"}],explanation:{az:"Həlli: 1) $1100\\cdot0{,}11=121$. 2) $0{,}81a+56{,}2=121\\Rightarrow 0{,}81a=64{,}8\\Rightarrow a=80$.",ru:"Решение: 1) $1100\\cdot0{,}11=121$. 2) $0{,}81a=121-56{,}2=64{,}8\\Rightarrow a=80$.",en:"Solution: 1) $1100\\cdot0{,}11=121$. 2) $0{,}81a=64{,}8\\Rightarrow a=80$."}},
{id:142,type:'mcq',correct:0,question:{az:"$y$ ədədinin $98\\%$-dən 44,44 çıxdıqda 53,56 alınır. $y$ ədədini tapın.",ru:"Если из $98\\%$ числа $y$ вычесть 44,44, получится 53,56. Найдите $y$.",en:"Subtracting 44,44 from $98\\%$ of $y$ gives 53,56. Find $y$."},options:[{az:"100",ru:"100",en:"100"},{az:"110",ru:"110",en:"110"},{az:"90",ru:"90",en:"90"},{az:"120",ru:"120",en:"120"},{az:"80",ru:"80",en:"80"}],explanation:{az:"Həlli: 1) $0{,}98y-44{,}44=53{,}56$. 2) $0{,}98y=98\\Rightarrow y=100$.",ru:"Решение: 1) $0{,}98y-44{,}44=53{,}56$. 2) $0{,}98y=98\\Rightarrow y=100$.",en:"Solution: 1) $0{,}98y=53{,}56+44{,}44=98$. 2) $y=100$."}},
{id:143,type:'mcq',correct:0,image:'Faiz_nisbet_tenasub_Image0143.png',question:{az:"Dairəvi diaqramda il ərzində fəsillər üzrə xərcələnən pullar göstərilmişdir: yay — $34\\%$, qış — $33\\%$, yaz və payızda isə hərəyə 330 manat. Qışda neçə manat pul xərcələnmişdir?",ru:"Круговая диаграмма расходов по сезонам: лето — $34\\%$, зима — $33\\%$, весной и осенью по 330 манатов. Сколько израсходовано зимой?",en:"A pie chart of yearly spending by season: summer $34\\%$, winter $33\\%$, spring and autumn 330 manats each. How much was spent in winter?"},options:[{az:"660",ru:"660",en:"660"},{az:"680",ru:"680",en:"680"},{az:"330",ru:"330",en:"330"},{az:"700",ru:"700",en:"700"},{az:"620",ru:"620",en:"620"}],explanation:{az:"Həlli: 1) Yaz + payız: $330+330=660$ manat, bu $100\\%-34\\%-33\\%=33\\%$-dir. 2) Ümumi: $660:0{,}33=2000$ manat. 3) Qış: $2000\\cdot0{,}33=660$ manat.",ru:"Решение: 1) Весна + осень = 660 манатов, это $100\\%-34\\%-33\\%=33\\%$. 2) Всего: $660:0{,}33=2000$. 3) Зима: $2000\\cdot0{,}33=660$ манатов.",en:"Solution: 1) Spring+autumn = 660 manats = $33\\%$. 2) Total: $660:0{,}33=2000$. 3) Winter: $2000\\cdot0{,}33=660$ manats."}},
{id:144,type:'mcq',correct:0,image:'Faiz_nisbet_tenasub_Image0144.png',question:{az:"Dairəvi diaqramda il ərzində fəsillər üzrə xərcələnən pullar göstərilmişdir: qış — $28\\%$, yaz, yay və payızda isə hərəyə 270 manat. Qışda neçə manat pul xərcələnmişdir?",ru:"Круговая диаграмма расходов: зима — $28\\%$, весна, лето и осень по 270 манатов. Сколько израсходовано зимой?",en:"A pie chart of spending: winter $28\\%$, each of spring, summer, autumn 270 manats. How much was spent in winter?"},options:[{az:"315",ru:"315",en:"315"},{az:"280",ru:"280",en:"280"},{az:"300",ru:"300",en:"300"},{az:"350",ru:"350",en:"350"},{az:"325",ru:"325",en:"325"}],explanation:{az:"Həlli: 1) Digər üç fəsil: $270\\cdot3=810$ manat, bu $100\\%-28\\%=72\\%$-dir. 2) Ümumi: $810:0{,}72=1125$ manat. 3) Qış: $1125\\cdot0{,}28=315$ manat.",ru:"Решение: 1) Три сезона: $810$ манатов = $72\\%$. 2) Всего: $810:0{,}72=1125$. 3) Зима: $1125\\cdot0{,}28=315$ манатов.",en:"Solution: 1) Three seasons: $810$ manats = $72\\%$. 2) Total: $1125$. 3) Winter: $1125\\cdot0{,}28=315$ manats."}},
{id:145,type:'mcq',correct:0,question:{az:"Əvvəlcə pulun $20\\%$-ni, sonra isə qalan hissəsinin $30\\%$-ni istifadə etdilər. Pulun neçə faizi qaldı?",ru:"Сначала истратили $20\\%$ денег, затем $30\\%$ остатка. Сколько процентов денег осталось?",en:"First $20\\%$ of the money was spent, then $30\\%$ of the remainder. What percent is left?"},options:[{az:"56%",ru:"56%",en:"56%"},{az:"50%",ru:"50%",en:"50%"},{az:"44%",ru:"44%",en:"44%"},{az:"64%",ru:"64%",en:"64%"},{az:"58%",ru:"58%",en:"58%"}],explanation:{az:"Həlli: 1) Birinci xərcləmədən sonra qalır $80\\%$. 2) İkincidən sonra: $0{,}8\\cdot0{,}7=0{,}56=56\\%$.",ru:"Решение: 1) После первой траты осталось $80\\%$. 2) После второй: $0{,}8\\cdot0{,}7=56\\%$.",en:"Solution: 1) After the first spend, $80\\%$ remains. 2) After the second: $0{,}8\\cdot0{,}7=56\\%$."}},
{id:146,type:'mcq',correct:4,question:{az:"Dolu çəndə olan benzinin əvvəlcə $40\\%$-ni, sonra isə çənin $\\frac{1}{4}$ hissəsini işlətdilər və onda 14 t benzin qaldı. Çən neçə ton benzin tutur?",ru:"Из полного бака сначала израсходовали $40\\%$ бензина, затем $\\frac{1}{4}$ бака; осталось 14 т. Сколько тонн вмещает бак?",en:"From a full tank, first $40\\%$ of the petrol was used, then $\\frac{1}{4}$ of the tank; 14 t remained. What is the tank's capacity?"},options:[{az:"35",ru:"35",en:"35"},{az:"42",ru:"42",en:"42"},{az:"28",ru:"28",en:"28"},{az:"50",ru:"50",en:"50"},{az:"40",ru:"40",en:"40"}],explanation:{az:"Həlli: 1) İşlədilmiş: $40\\%+25\\%=65\\%$. 2) Qalan $14$ t $=35\\%$. 3) Çən: $14:0{,}35=40$ t.",ru:"Решение: 1) Израсходовано: $40\\%+25\\%=65\\%$. 2) Осталось $35\\%=14$ т. 3) Бак: $14:0{,}35=40$ т.",en:"Solution: 1) Used: $40\\%+25\\%=65\\%$. 2) Remaining $35\\%=14$ t. 3) Tank: $14:0{,}35=40$ t."}},
{id:147,type:'mcq',correct:3,question:{az:"$75\\%$-i ilə $25\\%$-nin fərqi 50 olan ədədin $10\\%$-ni tapın.",ru:"Найдите $10\\%$ числа, разность $75\\%$ и $25\\%$ которого равна 50.",en:"The difference between $75\\%$ and $25\\%$ of a number is 50. Find $10\\%$ of the number."},options:[{az:"5",ru:"5",en:"5"},{az:"20",ru:"20",en:"20"},{az:"15",ru:"15",en:"15"},{az:"10",ru:"10",en:"10"},{az:"25",ru:"25",en:"25"}],explanation:{az:"Həlli: 1) $75\\%-25\\%=50\\%$, deməli ədədin $50\\%$-i 50-dir; ədəd $=100$. 2) $100\\cdot0{,}1=10$.",ru:"Решение: 1) $75\\%-25\\%=50\\%$, значит число равно 100. 2) $10\\%=10$.",en:"Solution: 1) $75\\%-25\\%=50\\%$, so the number is 100. 2) $10\\%=10$."}},
{id:148,type:'mcq',correct:0,question:{az:"Gün ərzində bankdan əvvəlcə məbləğin $40\\%$-i, sonra qalan məbləğin $40\\%$-i götürüldüsə, bankda ilkin məbləğin neçə faizi qalar?",ru:"Если за день из банка сначала взяли $40\\%$ суммы, затем $40\\%$ остатка, сколько процентов первоначальной суммы останется?",en:"If $40\\%$ of a sum, then $40\\%$ of the remainder is withdrawn in a day, what percent of the original sum remains?"},options:[{az:"36%",ru:"36%",en:"36%"},{az:"24%",ru:"24%",en:"24%"},{az:"44%",ru:"44%",en:"44%"},{az:"64%",ru:"64%",en:"64%"},{az:"16%",ru:"16%",en:"16%"}],explanation:{az:"Həlli: 1) Qalır $0{,}6$ hissə. 2) İkinci götürmədən sonra: $0{,}6\\cdot0{,}6=0{,}36=36\\%$.",ru:"Решение: 1) Остаётся $0{,}6$. 2) После второго снятия: $0{,}6\\cdot0{,}6=36\\%$.",en:"Solution: 1) $0{,}6$ remains. 2) After second withdrawal: $0{,}6\\cdot0{,}6=36\\%$."}},
{id:149,type:'mcq',correct:4,question:{az:"Gün ərzində bankdan əvvəlcə məbləğin $60\\%$-i, sonra qalan məbləğin $40\\%$-i götürüldüsə, bankda ilkin məbləğin neçə faizi qalar?",ru:"Если за день из банка взяли сначала $60\\%$ суммы, затем $40\\%$ остатка, сколько процентов останется?",en:"If $60\\%$ of a sum, then $40\\%$ of the remainder is withdrawn, what percent remains?"},options:[{az:"36%",ru:"36%",en:"36%"},{az:"16%",ru:"16%",en:"16%"},{az:"40%",ru:"40%",en:"40%"},{az:"20%",ru:"20%",en:"20%"},{az:"24%",ru:"24%",en:"24%"}],explanation:{az:"Həlli: 1) Birincidən sonra qalır $40\\%$. 2) $0{,}4\\cdot0{,}6=0{,}24=24\\%$.",ru:"Решение: 1) После первого снятия осталось $40\\%$. 2) $0{,}4\\cdot0{,}6=24\\%$.",en:"Solution: 1) $40\\%$ remains after the first. 2) $0{,}4\\cdot0{,}6=24\\%$."}},
{id:150,type:'mcq',correct:0,question:{az:"$10\\%$-i $\\frac{4{,}8\\cdot3{,}6\\cdot0{,}81}{0{,}06\\cdot1{,}2\\cdot0{,}3}$ olan ədədi tapın.",ru:"Найдите число, $10\\%$ которого равны $\\frac{4{,}8\\cdot3{,}6\\cdot0{,}81}{0{,}06\\cdot1{,}2\\cdot0{,}3}$.",en:"Find the number whose $10\\%$ equals $\\frac{4{,}8\\cdot3{,}6\\cdot0{,}81}{0{,}06\\cdot1{,}2\\cdot0{,}3}$."},options:[{az:"6480",ru:"6480",en:"6480"},{az:"648",ru:"648",en:"648"},{az:"64,8",ru:"64,8",en:"64,8"},{az:"64800",ru:"64800",en:"64800"},{az:"3240",ru:"3240",en:"3240"}],explanation:{az:"Həlli: 1) $\\frac{4{,}8}{0{,}06}\\cdot\\frac{3{,}6}{1{,}2}\\cdot\\frac{0{,}81}{0{,}3}=80\\cdot3\\cdot2{,}7=648$. 2) Ədəd: $648:0{,}1=6480$.",ru:"Решение: 1) Дробь $=80\\cdot3\\cdot2{,}7=648$. 2) Число: $648:0{,}1=6480$.",en:"Solution: 1) The fraction $=80\\cdot3\\cdot2{,}7=648$. 2) Number: $648:0{,}1=6480$."}},
{id:151,type:'mcq',correct:0,question:{az:"24 manat dəyəri olan küknar $25\\%$ endirimlə satılır. Alıcı iki belə küknar aldıqda xəzinədarı 50 manat verərsə, qaytarılan qalıq neçə manat olar?",ru:"Ёлка ценой 24 маната продаётся со скидкой $25\\%$. Если покупатель за две ёлки даст 50 манатов, какова сдача?",en:"A fir tree worth 24 manats is sold at a $25\\%$ discount. If a buyer pays 50 manats for two trees, what change is returned?"},options:[{az:"14",ru:"14",en:"14"},{az:"12",ru:"12",en:"12"},{az:"16",ru:"16",en:"16"},{az:"10",ru:"10",en:"10"},{az:"18",ru:"18",en:"18"}],explanation:{az:"Həlli: 1) Endirimli qiymət: $24\\cdot0{,}75=18$ manat. 2) İki küknar: $36$ manat. 3) Qalıq: $50-36=14$ manat.",ru:"Решение: 1) Цена со скидкой: $24\\cdot0{,}75=18$ манатов. 2) Две ёлки: 36. 3) Сдача: $50-36=14$ манатов.",en:"Solution: 1) Discounted price: $18$. 2) Two trees: 36. 3) Change: $50-36=14$ manats."}},
{id:152,type:'mcq',correct:0,question:{az:"40 manat dəyəri olan çaydan $15\\%$ endirimlə satılır. Alıcı iki belə çaydan aldıqda xəzinədarı 100 manat verərsə, qaytarılan qalıq neçə manat olar?",ru:"Чайник ценой 40 манатов продаётся со скидкой $15\\%$. Если за два чайника дать 100 манатов, какова сдача?",en:"A kettle worth 40 manats is sold at a $15\\%$ discount. If a buyer pays 100 manats for two, what change is returned?"},options:[{az:"32",ru:"32",en:"32"},{az:"30",ru:"30",en:"30"},{az:"28",ru:"28",en:"28"},{az:"36",ru:"36",en:"36"},{az:"40",ru:"40",en:"40"}],explanation:{az:"Həlli: 1) Endirimli qiymət: $40\\cdot0{,}85=34$ manat. 2) İki çaydan: $68$ manat. 3) Qalıq: $100-68=32$ manat.",ru:"Решение: 1) Цена со скидкой: $40\\cdot0{,}85=34$. 2) Два чайника: 68. 3) Сдача: $100-68=32$ маната.",en:"Solution: 1) Discounted price: $34$. 2) Two kettles: 68. 3) Change: $32$ manats."}},
{id:153,type:'mcq',correct:0,question:{az:"$12\\%$-i ilə $13\\%$-nin cəmi 100 olan ədədin $50\\%$-ni tapın.",ru:"Найдите $50\\%$ числа, сумма $12\\%$ и $13\\%$ которого равна 100.",en:"The sum of $12\\%$ and $13\\%$ of a number is 100. Find $50\\%$ of the number."},options:[{az:"200",ru:"200",en:"200"},{az:"100",ru:"100",en:"100"},{az:"400",ru:"400",en:"400"},{az:"250",ru:"250",en:"250"},{az:"150",ru:"150",en:"150"}],explanation:{az:"Həlli: 1) $12\\%+13\\%=25\\%$, deməli ədədin $25\\%$-i 100-dür; ədəd $=400$. 2) $400\\cdot0{,}5=200$.",ru:"Решение: 1) $12\\%+13\\%=25\\%=100$, число $=400$. 2) $50\\%=200$.",en:"Solution: 1) $25\\%=100$, number $=400$. 2) $50\\%=200$."}},
{id:154,type:'mcq',correct:0,question:{az:"Bir neçə kitab Arif və Günay arasında sayları müvafiq olaraq 2 və 3 ilə düz mütənasib olmaqla bölüşdürüldü. Günaya Arifdən 10 kitab çox düşərsə, ümumi neçə kitab bölüşdürüldü?",ru:"Несколько книг разделили между Арифом и Гюнай пропорционально 2 и 3. Гюнай получила на 10 книг больше. Сколько всего книг?",en:"Some books were shared between Arif and Gunay in the ratio 2:3. If Gunay got 10 more books than Arif, how many books in total?"},options:[{az:"50",ru:"50",en:"50"},{az:"40",ru:"40",en:"40"},{az:"60",ru:"60",en:"60"},{az:"45",ru:"45",en:"45"},{az:"30",ru:"30",en:"30"}],explanation:{az:"Həlli: 1) $3k-2k=10\\Rightarrow k=10$. 2) Ümumi: $5k=50$ kitab.",ru:"Решение: 1) $3k-2k=10\\Rightarrow k=10$. 2) Всего: $5k=50$ книг.",en:"Solution: 1) $3k-2k=10\\Rightarrow k=10$. 2) Total: $5k=50$ books."}},
{id:155,type:'mcq',correct:0,question:{az:"$a:b=c:d$ düzgün tənasübündə $a+b+c=40$ və $a$ ədədi $c$-nin $\\frac{2}{5}$-nə, $b$ ədədi $c$-nin $\\frac{3}{5}$-nə bərabərdir. $d$-ni tapın.",ru:"В пропорции $a:b=c:d$ дано $a+b+c=40$, $a=\\frac{2}{5}c$, $b=\\frac{3}{5}c$. Найдите $d$.",en:"In the proportion $a:b=c:d$, $a+b+c=40$, $a=\\frac{2}{5}c$, $b=\\frac{3}{5}c$. Find $d$."},options:[{az:"30",ru:"30",en:"30"},{az:"24",ru:"24",en:"24"},{az:"36",ru:"36",en:"36"},{az:"20",ru:"20",en:"20"},{az:"40",ru:"40",en:"40"}],explanation:{az:"Həlli: 1) $\\frac{2}{5}c+\\frac{3}{5}c+c=2c=40\\Rightarrow c=20$. 2) $a=8$, $b=12$. 3) $d=\\frac{bc}{a}=\\frac{12\\cdot20}{8}=30$.",ru:"Решение: 1) $2c=40\\Rightarrow c=20$, $a=8$, $b=12$. 2) $d=\\frac{12\\cdot20}{8}=30$.",en:"Solution: 1) $2c=40\\Rightarrow c=20$, $a=8$, $b=12$. 2) $d=\\frac{bc}{a}=30$."}},
{id:156,type:'mcq',correct:0,image:'Faiz_nisbet_tenasub_Image0156.png',question:{az:"Diaqramda A, B və C məktəblərindən ekskursiyada iştirak etmiş şagirdlərin sayı verilmişdir (oğlanlar/qızlar): A — 60/40, B — 30/30, C — 20/60. $m$, $n$ və $k$ uyğun olaraq A, B və C məktəblərindən ekskursiyada iştirak etmiş oğlanların sayının həmin məktəbdən bütün şagirdlərin sayına faizlə ifadəsidir. $m+n+k$ ifadəsinin qiymətini tapın.",ru:"На диаграмме число участников экскурсии от школ A, B, C (мальчики/девочки): A — 60/40, B — 30/30, C — 20/60. $m$, $n$, $k$ — проценты мальчиков в каждой школе. Найдите $m+n+k$.",en:"The diagram shows excursion participants from schools A, B, C (boys/girls): A — 60/40, B — 30/30, C — 20/60. $m$, $n$, $k$ are the percentages of boys in each school. Find $m+n+k$."},options:[{az:"135",ru:"135",en:"135"},{az:"120",ru:"120",en:"120"},{az:"140",ru:"140",en:"140"},{az:"150",ru:"150",en:"150"},{az:"125",ru:"125",en:"125"}],explanation:{az:"Həlli: 1) $m=\\frac{60}{100}\\cdot100\\%=60$. 2) $n=\\frac{30}{60}\\cdot100\\%=50$. 3) $k=\\frac{20}{80}\\cdot100\\%=25$. 4) $60+50+25=135$.",ru:"Решение: 1) $m=60$. 2) $n=50$. 3) $k=25$. 4) $m+n+k=135$.",en:"Solution: 1) $m=60$. 2) $n=50$. 3) $k=25$. 4) Sum $=135$."}},
{id:157,type:'mcq',correct:0,question:{az:"Cədvəldə təzə və qurudulmuş meyvələrin kütlələri verilib: Xurma — təzə 50 kq, quru $x$ kq, itki $20\\%$; Ərik — təzə $y$ kq, quru 35 kq, itki $30\\%$; Alma — təzə 80 kq, quru 60 kq, itki $P\\%$. $x$, $y$ və $P$-ni hesablayın.",ru:"В таблице массы свежих и сушёных фруктов: Хурма — свежая 50 кг, сушёная $x$ кг, потеря $20\\%$; Абрикос — свежий $y$ кг, сушёный 35 кг, потеря $30\\%$; Яблоко — свежее 80 кг, сушёное 60 кг, потеря $P\\%$. Найдите $x$, $y$, $P$.",en:"Table of fresh/dried fruit masses: Persimmon — fresh 50 kg, dried $x$ kg, loss $20\\%$; Apricot — fresh $y$ kg, dried 35 kg, loss $30\\%$; Apple — fresh 80 kg, dried 60 kg, loss $P\\%$. Find $x$, $y$, $P$."},options:[{az:"$x=40$, $y=50$, $P=25$",ru:"$x=40$, $y=50$, $P=25$",en:"$x=40$, $y=50$, $P=25$"},{az:"$x=30$, $y=50$, $P=20$",ru:"$x=30$, $y=50$, $P=20$",en:"$x=30$, $y=50$, $P=20$"},{az:"$x=40$, $y=45$, $P=25$",ru:"$x=40$, $y=45$, $P=25$",en:"$x=40$, $y=45$, $P=25$"},{az:"$x=45$, $y=50$, $P=30$",ru:"$x=45$, $y=50$, $P=30$",en:"$x=45$, $y=50$, $P=30$"},{az:"$x=40$, $y=55$, $P=20$",ru:"$x=40$, $y=55$, $P=20$",en:"$x=40$, $y=55$, $P=20$"}],explanation:{az:"Həlli: 1) Xurma: $x=50\\cdot0{,}8=40$ kq. 2) Ərik: $y\\cdot0{,}7=35\\Rightarrow y=50$ kq. 3) Alma: itki $\\frac{80-60}{80}\\cdot100\\%=25\\%$, $P=25$.",ru:"Решение: 1) Хурма: $x=50\\cdot0{,}8=40$ кг. 2) Абрикос: $y=35:0{,}7=50$ кг. 3) Яблоко: $P=\\frac{20}{80}\\cdot100\\%=25$.",en:"Solution: 1) Persimmon: $x=50\\cdot0{,}8=40$. 2) Apricot: $y=35:0{,}7=50$. 3) Apple: $P=\\frac{20}{80}\\cdot100\\%=25$."}},
{id:158,type:'mcq',correct:0,question:{az:"Cədvəldə təzə və qurudulmuş meyvələrin kütlələri verilib: Üzüm — təzə 60 kq, quru $x$ kq, itki $25\\%$; Əncir — təzə $y$ kq, quru 45 kq, itki $10\\%$; Armud — təzə 70 kq, quru 42 kq, itki $P\\%$. $x$, $y$ və $P$-ni hesablayın.",ru:"В таблице: Виноград — свежий 60 кг, сушёный $x$ кг, потеря $25\\%$; Инжир — свежий $y$ кг, сушёный 45 кг, потеря $10\\%$; Груша — свежая 70 кг, сушёная 42 кг, потеря $P\\%$. Найдите $x$, $y$, $P$.",en:"Table: Grape — fresh 60 kg, dried $x$ kg, loss $25\\%$; Fig — fresh $y$ kg, dried 45 kg, loss $10\\%$; Pear — fresh 70 kg, dried 42 kg, loss $P\\%$. Find $x$, $y$, $P$."},options:[{az:"$x=45$, $y=50$, $P=40$",ru:"$x=45$, $y=50$, $P=40$",en:"$x=45$, $y=50$, $P=40$"},{az:"$x=40$, $y=50$, $P=45$",ru:"$x=40$, $y=50$, $P=45$",en:"$x=40$, $y=50$, $P=45$"},{az:"$x=45$, $y=45$, $P=40$",ru:"$x=45$, $y=45$, $P=40$",en:"$x=45$, $y=45$, $P=40$"},{az:"$x=50$, $y=45$, $P=30$",ru:"$x=50$, $y=45$, $P=30$",en:"$x=50$, $y=45$, $P=30$"},{az:"$x=45$, $y=55$, $P=45$",ru:"$x=45$, $y=55$, $P=45$",en:"$x=45$, $y=55$, $P=45$"}],explanation:{az:"Həlli: 1) Üzüm: $x=60\\cdot0{,}75=45$ kq. 2) Əncir: $y\\cdot0{,}9=45\\Rightarrow y=50$ kq. 3) Armud: $P=\\frac{70-42}{70}\\cdot100\\%=40$.",ru:"Решение: 1) Виноград: $x=60\\cdot0{,}75=45$. 2) Инжир: $y=45:0{,}9=50$. 3) Груша: $P=\\frac{28}{70}\\cdot100\\%=40$.",en:"Solution: 1) Grape: $x=60\\cdot0{,}75=45$. 2) Fig: $y=45:0{,}9=50$. 3) Pear: $P=\\frac{28}{70}\\cdot100\\%=40$."}},
{id:159,type:'mcq',correct:0,image:'Faiz_nisbet_tenasub_Image0159.png',question:{az:"Diaqramda 3 qabdakı məhlulun tərkibi (q) göstərilmişdir: I qab — şəkər 20, su 30; II qab — şəkər 30, su 20; III qab — şəkər 40, su 10. Bu məhlulları qarışdırdıqda alınan məhlulda şəkərin faizini tapın.",ru:"На диаграмме состав растворов в трёх сосудах (г): I — сахар 20, вода 30; II — сахар 30, вода 20; III — сахар 40, вода 10. Найдите процент сахара в смеси.",en:"The diagram shows 3 vessels' solutions (g): I — sugar 20, water 30; II — sugar 30, water 20; III — sugar 40, water 10. Find the percent of sugar in the mixture."},options:[{az:"60%",ru:"60%",en:"60%"},{az:"50%",ru:"50%",en:"50%"},{az:"40%",ru:"40%",en:"40%"},{az:"$66\\frac{2}{3}\\%$",ru:"$66\\frac{2}{3}\\%$",en:"$66\\frac{2}{3}\\%$"},{az:"55%",ru:"55%",en:"55%"}],explanation:{az:"Həlli: 1) Şəkər: $20+30+40=90$ q. 2) Ümumi kütlə: $90+30+20+10=150$ q. 3) $\\frac{90}{150}\\cdot100\\%=60\\%$.",ru:"Решение: 1) Сахар: $90$ г. 2) Всего: $150$ г. 3) $\\frac{90}{150}\\cdot100\\%=60\\%$.",en:"Solution: 1) Sugar: $90$ g. 2) Total: $150$ g. 3) $60\\%$."}},
{id:160,type:'mcq',correct:0,image:'Faiz_nisbet_tenasub_Image0160.png',question:{az:"Qrafikdə 60 tonluq su hovuzunun iki boru vasitəsilə doldurulması göstərilmişdir: ilk 4 saatda hovuz birinci boru ilə (20 tona qədər), sonrakı 6 saatda ikinci boru ilə (60 tona qədər) doldurulmuşdur. Yalnız ikinci boru ilə bu boş hovuz neçə saata dolar?",ru:"На графике наполнение 60-тонного бассейна двумя трубами: за первые 4 часа первая труба (до 20 т), за следующие 6 часов вторая труба (до 60 т). За сколько часов наполнит бассейн только вторая труба?",en:"The graph shows a 60 t pool filled by two pipes: in the first 4 hours pipe 1 fills it to 20 t, in the next 6 hours pipe 2 fills to 60 t. How long would pipe 2 alone take to fill the empty pool?"},options:[{az:"9",ru:"9",en:"9"},{az:"10",ru:"10",en:"10"},{az:"12",ru:"12",en:"12"},{az:"8",ru:"8",en:"8"},{az:"6",ru:"6",en:"6"}],explanation:{az:"Həlli: 1) İkinci boru 6 saatda $60-20=40$ t doldurur. 2) Sürət: $\\frac{40}{6}=\\frac{20}{3}$ t/saat. 3) $60:\\frac{20}{3}=9$ saat.",ru:"Решение: 1) Вторая труба за 6 часов наливает $40$ т. 2) Скорость: $\\frac{40}{6}=\\frac{20}{3}$ т/ч. 3) $60:\\frac{20}{3}=9$ часов.",en:"Solution: 1) Pipe 2 fills $40$ t in 6 hours: rate $\\frac{20}{3}$ t/h. 2) $60:\\frac{20}{3}=9$ hours."}},
{id:161,type:'mcq',correct:0,question:{az:"Cədvəldə musiqi və idman dərnəklərində olan 6–11 yaş intervalındakı şagirdlərin sayı göstərilmişdir: Musiqi — 6–8 yaş: 37, 9–11 yaş: 93; İdman — 6–8 yaş: $x$, 9–11 yaş: 215. 6–8 yaş intervalında idmanla məşğul olanların sayı 6–11 yaş intervalındakı bütün dərnək iştirakçılarının sayının $25\\%$-ni təşkil edərsə, 6–11 yaş intervalındakı bütün dərnək iştirakçılarının sayını tapın.",ru:"В таблице число учеников 6–11 лет в музыкальном и спортивном кружках: Музыка — 6–8: 37, 9–11: 93; Спорт — 6–8: $x$, 9–11: 215. Если число спортсменов 6–8 лет составляет $25\\%$ всех участников, найдите общее число участников.",en:"The table shows club members aged 6–11: Music — 6–8: 37, 9–11: 93; Sport — 6–8: $x$, 9–11: 215. If sport members aged 6–8 are $25\\%$ of all club members, find the total number of members."},options:[{az:"460",ru:"460",en:"460"},{az:"400",ru:"400",en:"400"},{az:"420",ru:"420",en:"420"},{az:"480",ru:"480",en:"480"},{az:"500",ru:"500",en:"500"}],explanation:{az:"Həlli: 1) $x=0{,}25(37+93+x+215)=0{,}25(345+x)$. 2) $0{,}75x=86{,}25\\Rightarrow x=115$. 3) Ümumi: $345+115=460$.",ru:"Решение: 1) $x=0{,}25(345+x)$. 2) $x=115$. 3) Всего: $345+115=460$.",en:"Solution: 1) $x=0{,}25(345+x)\\Rightarrow x=115$. 2) Total: $345+115=460$."}},
{id:162,type:'mcq',correct:0,question:{az:"Tərkibi A, B, C və D maddələrindən ibarət məhlul verilmişdir. B maddəsinin kütləsi 40 q, C maddəsinin kütləsi 70 q olub məhlulun $28\\%$-ni, D maddəsi isə $20\\%$-ni təşkil edir. Məhluldakı A maddəsinin kütləsini hesablayın.",ru:"Раствор состоит из веществ A, B, C, D. Масса B — 40 г, масса C — 70 г ($28\\%$ раствора), D составляет $20\\%$. Найдите массу A.",en:"A solution contains A, B, C, D. Mass of B is 40 g; C is 70 g and makes $28\\%$ of the solution; D makes $20\\%$. Find the mass of A."},options:[{az:"90",ru:"90",en:"90"},{az:"80",ru:"80",en:"80"},{az:"100",ru:"100",en:"100"},{az:"70",ru:"70",en:"70"},{az:"110",ru:"110",en:"110"}],explanation:{az:"Həlli: 1) Məhlulun kütləsi: $70:0{,}28=250$ q. 2) B: $\\frac{40}{250}\\cdot100\\%=16\\%$. 3) A-nın faizi: $100-16-28-20=36\\%$. 4) $250\\cdot0{,}36=90$ q.",ru:"Решение: 1) Масса раствора: $70:0{,}28=250$ г. 2) B: $16\\%$. 3) A: $100-16-28-20=36\\%$. 4) $250\\cdot0{,}36=90$ г.",en:"Solution: 1) Total: $70:0{,}28=250$ g. 2) B is $16\\%$. 3) A: $36\\%$. 4) $250\\cdot0{,}36=90$ g."}},
{id:163,type:'mcq',correct:0,question:{az:"Mətbəə iki gündə alınan kağızın $60\\%$-ni işlətmişdir. İkinci gün birinci günə nisbətən 4 dəfə çox kağız işləndi. 10 t kağız alındığı məlumdursa, mətbəə birinci gün neçə ton kağız işlətmişdir?",ru:"Типография за два дня израсходовала $60\\%$ бумаги. Во второй день — в 4 раза больше, чем в первый. Всего куплено 10 т. Сколько тонн израсходовано в первый день?",en:"A printing house used $60\\%$ of the paper bought over 2 days. Day 2 used 4 times more than day 1. If 10 t were bought, how many tons were used on day 1?"},options:[{az:"1,2",ru:"1,2",en:"1,2"},{az:"1,5",ru:"1,5",en:"1,5"},{az:"2",ru:"2",en:"2"},{az:"1",ru:"1",en:"1"},{az:"2,4",ru:"2,4",en:"2,4"}],explanation:{az:"Həlli: 1) İşlədilən: $10\\cdot0{,}6=6$ t. 2) $x+4x=6\\Rightarrow 5x=6\\Rightarrow x=1{,}2$ t.",ru:"Решение: 1) Израсходовано: $6$ т. 2) $x+4x=6\\Rightarrow x=1{,}2$ т.",en:"Solution: 1) Used: $6$ t. 2) $x+4x=6\\Rightarrow x=1{,}2$ t."}},
{id:164,type:'mcq',correct:0,question:{az:"Məktəbin şagirdlərinin $80\\%$-i iki gün ərzində tibbi müayinədən keçdi. İkinci gün birinci günə nisbətən 2 dəfə çox şagird tibbi müayinədən keçdi. Məktəbdə 360 şagirdin təhsil aldığı məlumdursa, birinci gün neçə şagird tibbi müayinədən keçmişdir?",ru:"$80\\%$ учеников школы прошли медосмотр за два дня. Во второй день — в 2 раза больше, чем в первый. В школе 360 учеников. Сколько прошло медосмотр в первый день?",en:"$80\\%$ of a school's students had medical check-ups over 2 days. Day 2 had twice as many as day 1. With 360 students, how many were checked on day 1?"},options:[{az:"96",ru:"96",en:"96"},{az:"120",ru:"120",en:"120"},{az:"144",ru:"144",en:"144"},{az:"72",ru:"72",en:"72"},{az:"108",ru:"108",en:"108"}],explanation:{az:"Həlli: 1) Müayinədən keçən: $360\\cdot0{,}8=288$. 2) $x+2x=288\\Rightarrow 3x=288\\Rightarrow x=96$.",ru:"Решение: 1) Прошли: $360\\cdot0{,}8=288$. 2) $x+2x=288\\Rightarrow x=96$.",en:"Solution: 1) Checked: $288$. 2) $x+2x=288\\Rightarrow x=96$."}},
{id:165,type:'mcq',correct:0,question:{az:"Kütlələri $a$, $b$ və $c$ olan maddələr $a:b:c=3:5:9$ nisbətində qarışdırılmışdır. Alınan qarışığın ümumi kütləsi 680 q olarsa, bu qarışıqda $c$ maddəsinin kütləsini tapın.",ru:"Вещества с массами $a$, $b$, $c$ смешаны в отношении $a:b:c=3:5:9$. Общая масса смеси 680 г. Найдите массу $c$.",en:"Substances with masses $a$, $b$, $c$ are mixed in the ratio $a:b:c=3:5:9$. The mixture weighs 680 g. Find the mass of $c$."},options:[{az:"360",ru:"360",en:"360"},{az:"200",ru:"200",en:"200"},{az:"120",ru:"120",en:"120"},{az:"300",ru:"300",en:"300"},{az:"240",ru:"240",en:"240"}],explanation:{az:"Həlli: 1) Vahid: $680:(3+5+9)=680:17=40$ q. 2) $c=9\\cdot40=360$ q.",ru:"Решение: 1) Единица: $680:17=40$ г. 2) $c=9\\cdot40=360$ г.",en:"Solution: 1) Unit: $680:17=40$ g. 2) $c=9\\cdot40=360$ g."}},
{id:166,type:'mcq',correct:0,question:{az:"Üç müxtəlif binanın hər birinin birinci mərtəbəsinin hündürlüyü 4 m, digər mərtəbələrinin hündürlüyü isə 3 m-ə bərabərdir. Bu binaların hündürlüklərinin nisbəti $8:11:14$ şəklindədir və hündürlüklərinin cəmi 66 m-dir. Hündürlüyü ən böyük olan bina neçə mərtəbəlidir?",ru:"Высота первого этажа каждого из трёх зданий 4 м, остальных этажей — 3 м. Высоты относятся как $8:11:14$, сумма высот 66 м. Сколько этажей у самого высокого здания?",en:"Each of three buildings has a 4 m first floor and 3 m other floors. Their heights are in ratio $8:11:14$ and sum to 66 m. How many floors does the tallest building have?"},options:[{az:"9",ru:"9",en:"9"},{az:"8",ru:"8",en:"8"},{az:"10",ru:"10",en:"10"},{az:"7",ru:"7",en:"7"},{az:"11",ru:"11",en:"11"}],explanation:{az:"Həlli: 1) $8k+11k+14k=33k=66\\Rightarrow k=2$. 2) Hündürlüklər: 16, 22, 28 m. 3) Ən böyük: $28=4+3\\cdot8\\Rightarrow 8+1=9$ mərtəbə.",ru:"Решение: 1) $33k=66\\Rightarrow k=2$. 2) Высоты: 16, 22, 28 м. 3) $28=4+3\\cdot8\\Rightarrow 9$ этажей.",en:"Solution: 1) $k=2$; heights 16, 22, 28 m. 2) Tallest: $28=4+3\\cdot8$, so $9$ floors."}},
{id:167,type:'mcq',correct:0,question:{az:"Yeni elektrik xəttinin $\\frac{1}{3}$-ni və əlavə 12 km çəkdikdən sonra xəttin hamısını çəkib qurtarmaq üçün hələ $40\\%$ elektrik xətti çəkmək qalırdı. Elektrik xəttinin uzunluğu nə qədərdir?",ru:"После прокладки $\\frac{1}{3}$ линии и ещё 12 км оставалось проложить $40\\%$ всей линии. Какова длина линии?",en:"After laying $\\frac{1}{3}$ of a power line plus 12 km, $40\\%$ of the line still remained. What is the line's length?"},options:[{az:"45 km",ru:"45 км",en:"45 km"},{az:"36 km",ru:"36 км",en:"36 km"},{az:"40 km",ru:"40 км",en:"40 km"},{az:"30 km",ru:"30 км",en:"30 km"},{az:"60 km",ru:"60 км",en:"60 km"}],explanation:{az:"Həlli: 1) Çəkilmiş: $\\frac{1}{3}L+12=0{,}6L$. 2) $12=(0{,}6-\\frac{1}{3})L=\\frac{4}{15}L$. 3) $L=12:\\frac{4}{15}=45$ km.",ru:"Решение: 1) $\\frac{1}{3}L+12=0{,}6L$. 2) $12=\\frac{4}{15}L$. 3) $L=45$ км.",en:"Solution: 1) $\\frac{1}{3}L+12=0{,}6L$. 2) $L=12:\\frac{4}{15}=45$ km."}},
{id:168,type:'mcq',correct:0,question:{az:"Sürücü yolun $\\frac{1}{4}$-ni və əlavə olaraq 180 km getdikdən sonra lazım olan məntəqəyə çatmaq üçün yolun $30\\%$-i qalırdı. Yolun uzunluğu nə qədərdir?",ru:"После того как водитель проехал $\\frac{1}{4}$ пути и ещё 180 км, до пункта назначения оставалось $30\\%$ пути. Какова длина пути?",en:"After a driver covered $\\frac{1}{4}$ of a road plus 180 km, $30\\%$ of the road remained. What is the road's length?"},options:[{az:"400 km",ru:"400 км",en:"400 km"},{az:"360 km",ru:"360 км",en:"360 km"},{az:"300 km",ru:"300 км",en:"300 km"},{az:"450 km",ru:"450 км",en:"450 km"},{az:"500 km",ru:"500 км",en:"500 km"}],explanation:{az:"Həlli: 1) Gedilmiş: $\\frac{L}{4}+180=0{,}7L$. 2) $180=(0{,}7-0{,}25)L=0{,}45L$. 3) $L=180:0{,}45=400$ km.",ru:"Решение: 1) $\\frac{L}{4}+180=0{,}7L$. 2) $L=180:0{,}45=400$ км.",en:"Solution: 1) $\\frac{L}{4}+180=0{,}7L$. 2) $L=400$ km."}},
{id:169,type:'mcq',correct:0,question:{az:"Bir ədədin $15\\%$-i o biri ədədin $45\\%$-nə bərabərdir. Bu ədədlərin cəmi 120 olduqda ədədlərin fərqinin modulunu tapın.",ru:"$15\\%$ одного числа равны $45\\%$ другого. Сумма чисел 120. Найдите модуль их разности.",en:"$15\\%$ of one number equals $45\\%$ of the other. Their sum is 120. Find the absolute difference."},options:[{az:"60",ru:"60",en:"60"},{az:"40",ru:"40",en:"40"},{az:"80",ru:"80",en:"80"},{az:"30",ru:"30",en:"30"},{az:"90",ru:"90",en:"90"}],explanation:{az:"Həlli: 1) $0{,}15a=0{,}45b\\Rightarrow a=3b$. 2) $3b+b=120\\Rightarrow b=30$, $a=90$. 3) Fərq: $90-30=60$.",ru:"Решение: 1) $a=3b$. 2) $4b=120\\Rightarrow b=30$, $a=90$. 3) Разность: $60$.",en:"Solution: 1) $a=3b$. 2) $4b=120\\Rightarrow b=30$, $a=90$. 3) Difference: $60$."}},
{id:170,type:'mcq',correct:0,question:{az:"Cəmi 120 olan iki ədəddən birinin $40\\%$-i digərinin $60\\%$-nə bərabərdir. Bu ədədlərin hasilini tapın.",ru:"Сумма двух чисел 120; $40\\%$ одного равны $60\\%$ другого. Найдите их произведение.",en:"The sum of two numbers is 120; $40\\%$ of one equals $60\\%$ of the other. Find their product."},options:[{az:"3456",ru:"3456",en:"3456"},{az:"3600",ru:"3600",en:"3600"},{az:"2400",ru:"2400",en:"2400"},{az:"3200",ru:"3200",en:"3200"},{az:"3400",ru:"3400",en:"3400"}],explanation:{az:"Həlli: 1) $0{,}4a=0{,}6b\\Rightarrow a=1{,}5b$. 2) $2{,}5b=120\\Rightarrow b=48$, $a=72$. 3) Hasil: $72\\cdot48=3456$.",ru:"Решение: 1) $a=1{,}5b$. 2) $b=48$, $a=72$. 3) Произведение: $3456$.",en:"Solution: 1) $a=1{,}5b$. 2) $b=48$, $a=72$. 3) Product: $3456$."}},
{id:171,type:'mcq',correct:0,question:{az:"Fərqi 40 olan iki ədəddən kiçiyinin $60\\%$-i böyüyünün $40\\%$-nə bərabər olarsa, bu ədədlərin hasilini tapın.",ru:"Разность двух чисел 40; $60\\%$ меньшего равны $40\\%$ большего. Найдите их произведение.",en:"The difference of two numbers is 40; $60\\%$ of the smaller equals $40\\%$ of the larger. Find their product."},options:[{az:"9600",ru:"9600",en:"9600"},{az:"4800",ru:"4800",en:"4800"},{az:"8400",ru:"8400",en:"8400"},{az:"9000",ru:"9000",en:"9000"},{az:"10800",ru:"10800",en:"10800"}],explanation:{az:"Həlli: 1) $0{,}6k=0{,}4b\\Rightarrow b=1{,}5k$. 2) $1{,}5k-k=40\\Rightarrow k=80$, $b=120$. 3) Hasil: $80\\cdot120=9600$.",ru:"Решение: 1) $b=1{,}5k$. 2) $0{,}5k=40\\Rightarrow k=80$, $b=120$. 3) Произведение: $9600$.",en:"Solution: 1) $b=1{,}5k$. 2) $k=80$, $b=120$. 3) Product: $9600$."}},
{id:172,type:'mcq',correct:0,question:{az:"Rəssam iki gündə alınan boyanın $80\\%$-ni işlətmişdir. O, ikinci gün birinci günə nisbətən 3 dəfə çox boya işlətmişdir. 40 l boya alındığı məlumdursa, rəssam birinci gün neçə litr boya işlətmişdir?",ru:"Маляр за два дня израсходовал $80\\%$ краски. Во второй день — в 3 раза больше, чем в первый. Всего куплено 40 л. Сколько литров израсходовано в первый день?",en:"A painter used $80\\%$ of the paint bought over 2 days. Day 2 used 3 times more than day 1. With 40 L bought, how many liters were used on day 1?"},options:[{az:"8",ru:"8",en:"8"},{az:"6",ru:"6",en:"6"},{az:"10",ru:"10",en:"10"},{az:"12",ru:"12",en:"12"},{az:"4",ru:"4",en:"4"}],explanation:{az:"Həlli: 1) İşlədilən: $40\\cdot0{,}8=32$ l. 2) $x+3x=32\\Rightarrow x=8$ l.",ru:"Решение: 1) Израсходовано: $32$ л. 2) $x+3x=32\\Rightarrow x=8$ л.",en:"Solution: 1) Used: $32$ L. 2) $x+3x=32\\Rightarrow x=8$ L."}},
{id:173,type:'mcq',correct:0,question:{az:"Məktəbdə iki gün ərzində keçirilən iməcilikdə şagirdlərin $80\\%$-i iştirak etmişdir. İkinci gün iməcilikdə iştirak edən şagirdlərin sayı birinci günə nisbətən 2 dəfə çox olmuşdur. Məktəbdə 480 şagirdin təhsil aldığı məlum olarsa, birinci gün iməcilikdə neçə şagird iştirak etmişdir?",ru:"В субботнике за два дня участвовали $80\\%$ учеников. Во второй день — в 2 раза больше, чем в первый. В школе 480 учеников. Сколько участвовало в первый день?",en:"$80\\%$ of students joined a school clean-up over 2 days. Day 2 had twice as many participants as day 1. With 480 students, how many joined on day 1?"},options:[{az:"128",ru:"128",en:"128"},{az:"96",ru:"96",en:"96"},{az:"192",ru:"192",en:"192"},{az:"160",ru:"160",en:"160"},{az:"144",ru:"144",en:"144"}],explanation:{az:"Həlli: 1) İştirak edən: $480\\cdot0{,}8=384$. 2) $x+2x=384\\Rightarrow x=128$.",ru:"Решение: 1) Участвовали: $384$. 2) $x+2x=384\\Rightarrow x=128$.",en:"Solution: 1) Participants: $384$. 2) $x+2x=384\\Rightarrow x=128$."}},
{id:174,type:'mcq',correct:0,question:{az:"Buğda üyüdüldükdə $80\\%$ un alınır, undan isə onun kütləsinin $30\\%$-i qədər artıq çörək alınır. 208 kg çörək almaq üçün nə qədər buğda üyütmək lazımdır?",ru:"При помоле пшеницы получают $80\\%$ муки, а хлеба — на $30\\%$ больше массы муки. Сколько пшеницы нужно, чтобы получить 208 кг хлеба?",en:"Milling wheat yields $80\\%$ flour; baking yields bread $30\\%$ heavier than the flour. How much wheat is needed for 208 kg of bread?"},options:[{az:"200 kq",ru:"200 кг",en:"200 kg"},{az:"160 kq",ru:"160 кг",en:"160 kg"},{az:"260 kq",ru:"260 кг",en:"260 kg"},{az:"128 kq",ru:"128 кг",en:"128 kg"},{az:"240 kq",ru:"240 кг",en:"240 kg"}],explanation:{az:"Həlli: 1) Un: $208:1{,}3=160$ kg. 2) Buğda: $160:0{,}8=200$ kg.",ru:"Решение: 1) Мука: $208:1{,}3=160$ кг. 2) Пшеница: $160:0{,}8=200$ кг.",en:"Solution: 1) Flour: $208:1{,}3=160$ kg. 2) Wheat: $160:0{,}8=200$ kg."}},
{id:175,type:'mcq',correct:0,question:{az:"Sinifdəki oğlanların sayını $30\\%$ artırıb, qızların sayını $50\\%$ azaltdıqda şagirdlərin sayı dəyişməzsə, sinifdə ən azı neçə şagird olduğunu tapın.",ru:"Если число мальчиков увеличить на $30\\%$, а девочек уменьшить на $50\\%$, число учеников не изменится. Найдите минимальное число учеников в классе.",en:"If the number of boys is increased by $30\\%$ and girls decreased by $50\\%$, the total stays the same. Find the minimum number of students."},options:[{az:"16",ru:"16",en:"16"},{az:"8",ru:"8",en:"8"},{az:"12",ru:"12",en:"12"},{az:"20",ru:"20",en:"20"},{az:"24",ru:"24",en:"24"}],explanation:{az:"Həlli: 1) $O+Q=1{,}3O+0{,}5Q\\Rightarrow 0{,}5Q=0{,}3O\\Rightarrow 3O=5Q$. 2) $O=5t$, $Q=3t$; $1{,}3O$ tam olsun deyə $t$ cütdür: $t=2$. 3) Ən azı: $O=10$, $Q=6$, cəmi 16.",ru:"Решение: 1) $3O=5Q$. 2) $O=5t$, $Q=3t$; чтобы $1{,}3O$ было целым, $t$ чётно: $t=2$. 3) Минимум: $O=10$, $Q=6$, всего 16.",en:"Solution: 1) $3O=5Q$. 2) $O=5t$, $Q=3t$; for $1{,}3O$ to be integer, $t$ must be even: $t=2$. 3) Minimum: $10+6=16$."}},
{id:176,type:'mcq',correct:0,question:{az:"Akif hər birinin qiyməti 250 manat olan su filtrinin satıldığı mağazada işləyir. Onun vəzifə maaşı 1000 manatdır. Bundan əlavə hər məhsulun satışından $4\\%$-i həcmində bonus alır. Yanvar ayında 1600 manat maaş alan Akif ay ərzində cəmi neçə su filtri satmışdır?",ru:"Ак продаёт фильтры для воды по 250 манатов. Оклад 1000 манатов плюс бонус $4\\%$ с каждой продажи. Получив 1600 манатов за январь, сколько фильтров он продал?",en:"Akif sells water filters at 250 manats each. His salary is 1000 manats plus a $4\\%$ bonus on each sale. Receiving 1600 manats in January, how many filters did he sell?"},options:[{az:"60",ru:"60",en:"60"},{az:"40",ru:"40",en:"40"},{az:"50",ru:"50",en:"50"},{az:"75",ru:"75",en:"75"},{az:"80",ru:"80",en:"80"}],explanation:{az:"Həlli: 1) Bonus: $1600-1000=600$ manat. 2) Satış məbləği: $600:0{,}04=15000$ manat. 3) Filtrlər: $15000:250=60$ ədəd.",ru:"Решение: 1) Бонус: $600$ манатов. 2) Сумма продаж: $600:0{,}04=15000$. 3) Фильтров: $15000:250=60$.",en:"Solution: 1) Bonus: $600$ manats. 2) Sales total: $600:0{,}04=15000$. 3) Filters: $15000:250=60$."}},
{id:177,type:'mcq',correct:0,question:{az:"Üç çarxdan ibarət qurğunun birinci çarxı 3 dövür tamamladığında ikinci çarx 4 dövür, üçüncü çarx isə 12 dövür tamamlayır. Çarxların dişlərinin ümumi sayı 80 olarsa, birinci çarxın dişlərinin sayını tapın.",ru:"В механизме из трёх шестерён: когда первая делает 3 оборота, вторая — 4, третья — 12. Всего зубьев 80. Найдите число зубьев первой шестерни.",en:"In a 3-gear mechanism, when the first gear makes 3 rotations the second makes 4 and the third makes 12. With 80 teeth total, find the first gear's teeth."},options:[{az:"40",ru:"40",en:"40"},{az:"30",ru:"30",en:"30"},{az:"10",ru:"10",en:"10"},{az:"24",ru:"24",en:"24"},{az:"36",ru:"36",en:"36"}],explanation:{az:"Həlli: 1) Dövrlər nisbəti $3:4:12$ olduğundan dişlərin sayı tərs mütənasibdir: $\\frac{1}{3}:\\frac{1}{4}:\\frac{1}{12}=4:3:1$. 2) Vahid: $80:8=10$. 3) Birinci çarx: $4\\cdot10=40$ diş.",ru:"Решение: 1) Число зубьев обратно пропорционально оборотам: $4:3:1$. 2) Единица: $80:8=10$. 3) Первая шестерня: $40$ зубьев.",en:"Solution: 1) Teeth are inversely proportional to rotations: $4:3:1$. 2) Unit: $80:8=10$. 3) First gear: $40$ teeth."}}
];

function imgFail(el,name){ el.parentElement.innerHTML="<div class='img-missing'>["+UI[lang].imgMiss+name+"]</div>"; }

function buildCard(q){
 const ua=answers[q.id], done=ua!==undefined;
 let badge=!done?`<span class="q-badge b-un">${UI[lang].un}</span>`:(ua===q.correct?`<span class="q-badge b-ok">${UI[lang].ok}</span>`:`<span class="q-badge b-no">✘</span>`);
 let imgHtml="";
 if(q.image){imgHtml=`<div class="q-image"><img src="images/${q.image}" alt="${q.image}" onerror="imgFail(this,'${q.image}')"></div>`;}
 const opts=q.options.map((o,i)=>{
  let cls="opt"+(done?" disabled":"");
  if(done){ if(i===q.correct)cls+=" correct"; else if(i===ua)cls+=" wrongsel"; else cls+=" muted"; }
  return `<div class="${cls}" onclick="selectAnswer(${q.id},${i})"><span class="letter">${L[i]}</span><span>${o[lang]}</span></div>`;
 }).join("");
 let expl=done?`<div class="expl"><h4>${UI[lang].sol}</h4>${(ua===q.correct?UI[lang].ok:UI[lang].no)}<br><br>${q.explanation[lang]}</div>`:"";
 return `<div class="card" id="card-${q.id}"><div class="q-head"><span class="q-num">${UI[lang].q} ${q.id}</span>${badge}</div><div class="q-text">${q.question[lang]}</div>${imgHtml}${opts}${expl}</div>`;
}

function renderGrid(){
 document.getElementById('qGrid').innerHTML=questionsData.map((q,i)=>{
  let c="qbtn", a=answers[q.id];
  if(a!==undefined)c+=(a===q.correct?" right":" wrong");
  if(mode==='slide'&&i===current)c+=" current";
  return `<button class="${c}" onclick="goTo(${i})">${q.id}</button>`;
 }).join("");
}
function renderScore(){
 let ok=0,no=0;
 questionsData.forEach(q=>{const a=answers[q.id];if(a!==undefined){if(a===q.correct)ok++;else no++;}});
 const un=questionsData.length-ok-no;
 document.getElementById('scoreBox').innerHTML=`<span class="chip g">✔ ${ok}</span><span class="chip r">✘ ${no}</span><span class="chip n">○ ${un}</span>`;
}
function renderHeader(){
 const t=UI[lang];
 document.getElementById('appTitle').textContent=t.title;
 document.getElementById('appSub').textContent=t.sub;
 document.getElementById('langSeg').innerHTML=['az','ru','en'].map(l=>`<button class="${l===lang?'on':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join("");
 document.getElementById('modeSeg').innerHTML=`<button class="${mode==='slide'?'on':''}" onclick="setMode('slide')">${t.slide}</button><button class="${mode==='list'?'on':''}" onclick="setMode('list')">${t.list}</button>`;
}
function renderMathNow(){
 if(window.renderMathInElement){
  renderMathInElement(document.getElementById('content'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
 }
}
function render(){
 renderHeader(); renderGrid(); renderScore();
 const c=document.getElementById('content');
 if(mode==='slide'){
  const q=questionsData[current];
  c.innerHTML=`<div class="nav-btns"><button ${current===0?'disabled':''} onclick="prevQ()">${UI[lang].prev}</button><button ${current===questionsData.length-1?'disabled':''} onclick="nextQ()">${UI[lang].next}</button></div>`+buildCard(q)+`<div class="nav-btns"><button ${current===0?'disabled':''} onclick="prevQ()">${UI[lang].prev}</button><button ${current===questionsData.length-1?'disabled':''} onclick="nextQ()">${UI[lang].next}</button></div>`;
  window.scrollTo({top:0,behavior:'smooth'});
 }else{
  c.innerHTML=questionsData.map(q=>buildCard(q)).join("")+`<button class="reset-btn" onclick="resetAll()">${UI[lang].reset}</button>`;
 }
 renderMathNow();
}
function selectAnswer(id,idx){
 if(answers[id]!==undefined)return;
 answers[id]=idx;
 render();
}
function goTo(i){
 if(mode==='slide'){current=i;render();}
 else{const el=document.getElementById('card-'+questionsData[i].id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}
}
function prevQ(){if(current>0){current--;render();}}
function nextQ(){if(current<questionsData.length-1){current++;render();}}
function setLang(l){lang=l;render();}
function setMode(m){mode=m;render();}
function resetAll(){if(confirm(UI[lang].reset+'?')){for(const k in answers)delete answers[k];current=0;render();}}

document.addEventListener('keydown',e=>{
 if(mode!=='slide')return;
 if(e.key==='ArrowLeft')prevQ();
 if(e.key==='ArrowRight')nextQ();
});

render();
window.addEventListener('load',()=>{renderMathNow();});
</script>
</body>
</html>
